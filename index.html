/* ================= UPLOAD ================= */
// ITEM 20 (continuação — "sobe vários arquivos, alguns se perdem pelo
// caminho, e depois de um erro simplesmente para de subir mais nada"):
// antes, subir vários arquivos disparava um FileReader + push + upload
// PARA CADA ARQUIVO ESSENCIALMENTE AO MESMO TEMPO — uma rajada de
// dezenas de chamadas ao Apps Script em poucos segundos. Isso estourava
// limites de execução simultânea do lado do Google, fazendo alguns
// arquivos simplesmente nunca serem gravados (nem no Drive nem na
// planilha), sem nenhum aviso individual sobre QUAL arquivo falhou.
// Agora os arquivos de um lote são processados em fila, UM DE CADA VEZ —
// o próximo só começa depois que o anterior terminar (com sucesso ou
// falha) — com um indicador de progresso visível, parecido com o do
// Google Drive.
function handleUpload(file){
  return new Promise(resolve => {
    // ITEM 21 (lote trava silenciosamente sem subir nada): antes, uma
    // exceção em qualquer ponto aqui dentro (ex.: permsAtuais() ou dentro
    // do callback do FileReader) nunca chamava resolve() — a Promise ficava
    // pendurada PARA SEMPRE, e como handleUploadLote usa "await" em cada
    // arquivo da fila, o loop inteiro travava no primeiro arquivo, sem
    // nenhum aviso visível (nem toast, nem barra de progresso escondida).
    // Agora qualquer erro aqui dentro sempre resolve como falha, com uma
    // mensagem visível, garantindo que a fila nunca trave de vez.
    try{
      if(!file) return resolve({ok:false, erro:'arquivo inválido'});
      const u = currentUser();
      if(!u){ toast('Sessão inválida — faça login novamente.','error'); return resolve({ok:false, erro:'sem sessão'}); }
      if(!permsAtuais().includes('upload')){ toast('Sem permissão de upload nesta pasta.','error'); return resolve({ok:false, erro:'sem permissão'}); }
      const ext = (file.name.includes('.') ? file.name.split('.').pop() : 'bin').toLowerCase();
      const permitidos = formatosPermitidos();
      if(!permitidos.includes(ext)){
        toast('Formato .' + ext + ' não permitido. Formatos liberados: ' + permitidos.join(', ') + '.','error');
        return resolve({ok:false, erro:'formato não permitido'});
      }
      const reader = new FileReader();
      reader.onload = () => {
        try{
          const dataUrl = String(reader.result);
          const idDoc = uid('d');
          const base = {id:idDoc, pastaId: state.currentFolderId, titulo: file.name.replace(/\.[^.]+$/,''), tipo:'arquivo', ext:ext, mime:file.type||'', criadoPor:u.id, criadoEm:Date.now(), atualizadoEm:Date.now()};
          // docId sempre vai junto na resposta, mesmo em caso de falha —
          // é o que permite ao botão "Reenviar" do painel (ver
          // reenviarItemLote_) reaproveitar o MESMO documento já criado em
          // vez de criar um novo (o que geraria duplicata).
          salvarDocArquivo(base, dataUrl).then(ok => resolve({ok, docId: idDoc})).catch(err => {
            toast('Falha ao salvar ' + file.name + ': ' + (err && err.message ? err.message : 'erro desconhecido'), 'error');
            resolve({ok:false, erro: err, docId: idDoc});
          });
        }catch(err){
          toast('Falha ao processar ' + file.name + ': ' + (err && err.message ? err.message : 'erro desconhecido'), 'error');
          resolve({ok:false, erro: err});
        }
      };
      reader.onerror = () => { toast('Não foi possível ler ' + file.name + '.','error'); resolve({ok:false, erro:'falha ao ler o arquivo'}); };
      reader.readAsDataURL(file);
    }catch(err){
      toast('Falha ao enviar ' + (file && file.name || 'arquivo') + ': ' + (err && err.message ? err.message : 'erro desconhecido'), 'error');
      resolve({ok:false, erro: err});
    }
  });
}
// ITEM 27 (30+ minutos para 19 arquivos, contra menos de 1 minuto pelo
// Google Drive direto): o laço anterior processava um arquivo por vez,
// esperando a viagem de ida e volta completa ao servidor terminar antes
// de sequer começar o próximo — sem nenhum aproveitamento do tempo de
// espera de rede. Agora processa vários arquivos ao mesmo tempo (um
// "pool" de tarefas, igual ao Google Drive), com um teto de simultaneidade
// pra não sobrecarregar o Apps Script como uma rajada sem controle nenhum
// fazia antes (ver ITEM 20/21 acima). A interface também virou uma lista
// por arquivo, cada um com seu próprio indicador — igual ao painel de
// upload do Google Drive — em vez de uma única barra genérica.
// ITEM (403 e ERR_BLOCKED_BY_CLIENT em lote de 25 arquivos): cada arquivo
// enviado abre seu próprio iframe oculto (ver postApi_) para conversar com
// o Apps Script. Com concorrência alta, muitos desses iframes eram criados
// quase ao mesmo tempo — e isso tanto aumenta a chance de esbarrar num
// bloqueador de anúncios/rastreadores do navegador (que corta essa
// comunicação sem avisar, gerando falhas em cascata) quanto de esbarrar em
// alguma limitação de simultaneidade do próprio Apps Script. Reduzido de 4
// para 2 como margem de segurança — mais lento por arquivo individual,
// porém bem mais resistente a esse tipo de interferência num lote grande.
const UPLOAD_CONCORRENCIA = 2;
// ITEM (arquivo trava e não continua / X por arquivo / X fecha painel):
// antes, um erro imprevisto DENTRO do laço de um "trabalhador" (fora do
// try/catch que só cobria a chamada handleUpload em si) podia escapar como
// exceção não tratada. Como handleUploadLote usa `await Promise.all(...)`
// sobre os trabalhadores, a primeira exceção que escapasse fazia o
// Promise.all inteiro REJEITAR na hora — só o `finally` (que solta a
// trava de inatividade) rodava, mas o código de limpeza logo depois
// (esconderProgressoLote_/renderItens/toast) NUNCA era executado, porque
// ele fica FORA do try/finally. O painel ficava preso na tela, achando
// que ainda estava "enviando", e — pior — como a trava de inatividade
// (uploadEmAndamento_) já tinha sido liberada antes da hora, um usuário
// inativo durante o lote longo podia ter a sessão encerrada no meio do
// envio, o que arrancava os iframes ocultos usados pelos envios ainda em
// andamento e travava de vez os arquivos restantes.
// FIX: (1) cada trabalhador agora tem seu PRÓPRIO try/catch envolvendo o
// laço inteiro, então nenhuma exceção escapa e derruba Promise.all antes
// da hora — cada trabalhador sempre continua até esgotar a fila; (2) a
// limpeza final (esconder painel, renderizar, avisar) está dentro de um
// finally, então roda sempre, não importa o que aconteça.
//
// CORREÇÃO (regressão): uma tentativa automática aqui, que existiu por
// pouco tempo, refazia handleUpload(file) inteiro em caso de falha —
// como handleUpload LÊ o arquivo de novo e CRIA um documento novo
// (uid('d') novo) a cada chamada, uma "nova tentativa" depois de um
// simples timeout do lado do cliente (o arquivo podia já ter sido salvo
// com sucesso no servidor) criava um SEGUNDO documento duplicado para o
// mesmo arquivo — e o original, que na verdade tinha dado certo, ainda
// aparecia com o ícone vermelho de falha no painel, porque a resposta da
// primeira tentativa nunca era reconciliada. Removida: agora cada arquivo
// é processado uma única vez aqui; o teto de tempo (Promise.race abaixo)
// é só uma rede de segurança contra uma chamada que nunca responde (não
// dispara nova tentativa nem novo documento). Para reenviar algo que
// falhou de verdade, o usuário usa o botão "Reenviar" existente no item
// (reenviarUpload), que reaproveita o MESMO documento em vez de criar
// outro.
let uploadLoteAtivo_ = null; // {arquivos, cancelados:Set<number>, concluidos, total}
// ITEM (reenviar individualmente arquivos com falha, sem duplicar):
// guarda, por índice do lote atual, o arquivo original e o docId que
// chegou a ser criado (se chegou) — é o que permite ao botão "Reenviar" de
// cada item reaproveitar exatamente o mesmo documento em vez de recriar
// um novo (ver reenviarItemLote_ abaixo). Independente de uploadLoteAtivo_
// (que só existe enquanto o lote automático está rodando), para continuar
// disponível mesmo depois do lote terminar, enquanto o painel ainda
// estiver na tela com itens com falha pendentes de reenvio manual.
let uploadLoteItens_ = null; // [{file, docId}]
async function handleUploadComTimeout_(file){
  let res;
  try{
    res = await Promise.race([
      handleUpload(file),
      new Promise(r => setTimeout(() => r({ok:false, erro:'tempo esgotado'}), 180000))
    ]);
  }catch(err){
    res = {ok:false, erro: err};
  }
  // ITEM (ícone vermelho em arquivo que já está no Drive): sob carga (lote
  // grande, várias chamadas ao mesmo tempo), o SERVIDOR pode legitimamente
  // demorar mais para responder do que o tempo que o navegador está
  // disposto a esperar — o Apps Script, porém, não é cancelado só porque o
  // cliente desistiu de esperar: ele continua processando e, minutos
  // depois, o arquivo aparece certinho no Drive. Antes, nesse caso, o item
  // ficava marcado como falha para sempre (o timeout do cliente virava a
  // palavra final), mesmo com o envio tendo dado certo no servidor. Agora,
  // antes de desistir de verdade, confirmamos diretamente com o servidor
  // (um pull imediato) se o documento já tem driveId — se tiver, o item é
  // corrigido para sucesso em vez de ficar com o ícone vermelho indevido.
  if(res && !res.ok && res.docId){
    const confirmado = await verificarUploadConfirmadoNoServidor_(res.docId);
    if(confirmado) return {ok:true, docId: res.docId};
  }
  return res;
}
// ITEM (ícone vermelho continua aparecendo mesmo com a verificação): uma
// única checagem imediata pode chegar cedo demais — se o próprio upload
// ainda estiver esperando na fila do lock do servidor (vários uploads
// concorrentes disputando o mesmo bloqueio), ele pode nem ter COMEÇADO a
// gravar ainda no instante exato em que perguntamos. Agora tenta
// novamente algumas vezes, com uma pequena espera entre elas, dando tempo
// real para o servidor esvaziar a fila antes de desistir de vez.
async function verificarUploadConfirmadoNoServidor_(docId){
  if(!session || !session.token) return false;
  const atrasos = [0, 4000, 8000, 8000]; // ~20s de janela extra, no total
  for(let i = 0; i < atrasos.length; i++){
    if(atrasos[i]) await new Promise(r => setTimeout(r, atrasos[i]));
    if(!session || !session.token) return false; // sessão pode ter caído nesse meio-tempo
    try{
      const data = await Sync.pull();
      if(data && Array.isArray(data.Documentos)){
        const doc = data.Documentos.find(d => d && d.id === docId);
        if(doc && doc.driveId && !doc.erroUpload){
          // Já aproveita essa leitura para atualizar o estado local também
          // (mesmo efeito de um pull normal), assim o resto do app já
          // reflete o sucesso na hora, sem esperar o próximo ciclo.
          try{ Sync.applyData(data); }catch(e){}
          return true;
        }
        if(doc && doc.erroUpload) return false; // falha real confirmada — não adianta insistir
      }
    }catch(e){}
  }
  return false;
}
// ITEM (duplicação sistemática + contagem que não bate): se
// handleUploadLote for chamada de novo ENQUANTO um lote anterior ainda
// está rodando (por exemplo, o evento "change" do seletor de arquivo
// disparando mais de uma vez para a mesma seleção — um comportamento real
// em alguns navegadores/extensões — ou o usuário clicando de novo antes
// do primeiro lote terminar), as DUAS chamadas rodavam ao mesmo tempo,
// cada uma com seu próprio conjunto de "trabalhadores" processando os
// MESMOS arquivos do zero — cada uma criando seu PRÓPRIO documento novo
// (daí IDs diferentes para o "mesmo" arquivo). Pior: as duas chamadas
// escrevem no MESMO painel (mostrarProgressoLote_ sempre usa os mesmos
// ids de elemento, tipo "upItem-0"), então a segunda chamada apagava e
// recriava o HTML do painel por baixo da primeira, embaralhando qual
// atualização pertencia a qual lote — exatamente o "a contagem não bate".
// Agora só um lote roda por vez: se chegar uma nova chamada enquanto uma
// já está em andamento, os arquivos entram numa fila e começam sozinhos,
// automaticamente, assim que o lote atual terminar — nunca dois ao mesmo
// tempo.
let filaProximoLote_ = [];
// ITEM (enviar uma pasta inteira): recebe os arquivos de uma pasta do
// computador (com File.webkitRelativePath preenchido pelo atributo
// webkitdirectory do #folderInput) e recria a MESMA estrutura de
// subpastas dentro da pasta atual do app antes de enviar o conteúdo —
// reaproveitando fielmente handleUploadLote (sem alterar nada nela) uma
// vez por subpasta, em sequência, trocando só o destino
// (state.currentFolderId) entre um grupo e outro.
async function handleUploadPasta_(files){
  const arquivos = Array.from(files || []).filter(Boolean);
  if(!arquivos.length) return;
  const u = currentUser(); if(!u) return;
  const raizOriginal = state.currentFolderId;
  const mapaPastas = new Map();
  mapaPastas.set('', raizOriginal || null);
  function obterOuCriarPastaPara_(caminhoRelativo){
    if(mapaPastas.has(caminhoRelativo)) return mapaPastas.get(caminhoRelativo);
    const partes = caminhoRelativo.split('/');
    const nome = partes[partes.length - 1];
    const caminhoPai = partes.slice(0, -1).join('/');
    const pastaIdPai = obterOuCriarPastaPara_(caminhoPai);
    const pastas = DB.get('Pastas');
    const existente = pastas.find(p => p.nome === nome && (p.parentId || null) === (pastaIdPai || null));
    let pastaId;
    if(existente){
      pastaId = existente.id;
    } else {
      const novaPasta = {id: uid('p'), nome, parentId: pastaIdPai || null, criadaPor: u.id, criadoEm: Date.now()};
      pastas.push(novaPasta);
      DB.set('Pastas', pastas);
      pastaId = novaPasta.id;
    }
    mapaPastas.set(caminhoRelativo, pastaId);
    return pastaId;
  }
  // Agrupa os arquivos por pasta de destino, criando a estrutura de
  // subpastas necessária primeiro (uma vez por pasta, não por arquivo).
  const grupos = new Map(); // pastaId -> File[]
  arquivos.forEach(f => {
    const rel = f.webkitRelativePath || f.name;
    const caminhoPasta = rel.split('/').slice(0, -1).join('/');
    const pastaId = obterOuCriarPastaPara_(caminhoPasta);
    if(!grupos.has(pastaId)) grupos.set(pastaId, []);
    grupos.get(pastaId).push(f);
  });
  renderDashboard();
  toast('Criada a estrutura de pastas — enviando ' + arquivos.length + ' arquivo(s)…');
  // Processa uma subpasta de cada vez (sequencial, aguardando cada lote
  // terminar por completo) — handleUploadLote não é alterada em nada,
  // só é chamada várias vezes com o destino certo a cada chamada.
  for(const [pastaId, arquivosDaPasta] of grupos){
    state.currentFolderId = pastaId;
    await handleUploadLote(arquivosDaPasta);
  }
  state.currentFolderId = raizOriginal;
  renderDashboard();
}
async function handleUploadLote(files){
  const arquivos = Array.from(files || []).filter(Boolean);
  if(!arquivos.length) return;
  if(uploadLoteAtivo_){
    filaProximoLote_ = filaProximoLote_.concat(arquivos);
    toast('Já existe um envio em andamento — esse(s) arquivo(s) vão entrar na fila e começar automaticamente em seguida.', 'info');
    return;
  }
  const total = arquivos.length;
  let sucesso = 0, falhas = 0, cancelados = 0, proximoIndice = 0;
  const cancelSet = new Set();
  uploadLoteAtivo_ = {arquivos, cancelados: cancelSet, concluidos: 0, total};
  uploadLoteItens_ = arquivos.map(f => ({file: f, docId: null}));
  mostrarProgressoLote_(arquivos.map(f => f.name));
  iniciarUploadEmAndamento_();
  // ITEM (painel de envio demorando para aparecer): mostrarProgressoLote_
  // já roda de forma síncrona logo no início, mas o navegador só PINTA
  // essa mudança na tela quando o bloco de código atual termina e a aba
  // "respira". Como o resto desta função começa imediatamente a preparar
  // e disparar os workers de upload (leitura de arquivo, chamadas de
  // rede), sem essa pausa o painel podia acabar aparecendo só um pouco
  // depois, junto com a primeira atualização de status, em vez de na
  // hora. Esta pausa de dois quadros de animação (requestAnimationFrame)
  // força o navegador a pintar o painel na tela ANTES de começar
  // qualquer trabalho de upload — o usuário vê a janela abrir
  // imediatamente ao selecionar os arquivos.
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  try{
    async function trabalhador(){
      while(proximoIndice < arquivos.length){
        const meuIndice = proximoIndice++;
        // CORREÇÃO (bug crítico): o try/catch envolvia o laço `while`
        // INTEIRO, não cada arquivo. Ou seja, uma exceção ao processar UM
        // arquivo abortava TODOS os arquivos restantes daquele trabalhador
        // de uma vez — sem lançar erro (por isso Promise.all "terminava
        // com sucesso" mesmo com arquivos nunca sequer tentados). Isso
        // explica dois sintomas juntos: (1) o painel ficava com itens
        // presos no relógio (nunca chegavam a 'falha' nem a 'ok'); e (2)
        // pior, como handleUploadLote considerava o lote "concluído" (o
        // finally rodava), a trava de inatividade (uploadLoteAtivo_) era
        // liberada demais cedo — então, se o usuário estava ausente
        // durante o lote, a sessão podia encerrar por inatividade com
        // arquivos ainda sem enviar. Agora o try/catch envolve só a
        // iteração de UM arquivo — se algo inesperado acontecer com um
        // arquivo específico, ele é contado como falha (com o ícone de
        // reenviar) e o trabalhador CONTINUA para o próximo, sem abandonar
        // o resto da fila.
        try{
          if(cancelSet.has(meuIndice)){
            cancelados++; atualizarItemLote_(meuIndice, 'cancelado');
            uploadLoteAtivo_.concluidos++;
            continue;
          }
          atualizarItemLote_(meuIndice, 'enviando');
          const res = await handleUploadComTimeout_(arquivos[meuIndice]);
          if(res && res.docId) uploadLoteItens_[meuIndice].docId = res.docId;
          if(cancelSet.has(meuIndice)){
            // cancelado enquanto já estava em voo: o envio pode até ter
            // completado no servidor, mas para o usuário ele foi descartado.
            cancelados++; atualizarItemLote_(meuIndice, 'cancelado');
          } else if(res && res.ok){
            sucesso++; atualizarItemLote_(meuIndice, 'ok');
          } else {
            falhas++; atualizarItemLote_(meuIndice, 'falha');
          }
        }catch(erroArquivo){
          // Falha inesperada só neste arquivo — conta como falha (com
          // ícone de reenviar) e segue para o próximo, sem parar o
          // trabalhador nem os outros arquivos da fila.
          falhas++; atualizarItemLote_(meuIndice, 'falha');
        }
        uploadLoteAtivo_.concluidos++;
      }
    }
    const trabalhadores = [];
    for(let w = 0; w < Math.min(UPLOAD_CONCORRENCIA, total); w++) trabalhadores.push(trabalhador());
    await Promise.all(trabalhadores);
  }catch(erroFatal){
    // Segurança extra: mesmo que algo inesperado ainda assim escape (não
    // deveria, dado o try/catch por arquivo acima), a limpeza abaixo
    // continua garantida via finally.
  }finally{
    terminarUploadEmAndamento_();
    uploadLoteAtivo_ = null;
    // Rede de segurança final: qualquer arquivo que, por algum motivo
    // imprevisto, nunca tenha sido tocado por nenhum trabalhador (ainda
    // com o ícone de relógio) é marcado como falha agora — com o ícone de
    // reenviar disponível — em vez de ficar preso no painel para sempre
    // parecendo "ainda enviando".
    for(let i = 0; i < total; i++){
      const statusEl = document.getElementById('upStatus-' + i);
      if(statusEl && statusEl.classList.contains('up-item-status') &&
         !statusEl.classList.contains('ok') && !statusEl.classList.contains('falha') &&
         !statusEl.classList.contains('cancelado') && !statusEl.classList.contains('enviando')){
        falhas++; atualizarItemLote_(i, 'falha');
      }
    }
    // ITEM (só fechar sozinho se TODOS os arquivos foram enviados com
    // sucesso): antes o painel sempre se fechava automaticamente ao final
    // do lote, mesmo havendo falhas. Agora, se houver algum item com
    // falha real, o painel permanece aberto — com um ícone de "Reenviar"
    // ao lado de cada um — em vez de fechar. O fechamento automático só
    // acontece quando não sobra nenhum item pendente/com falha na lista
    // (ver verificarFechamentoAutomaticoLote_, chamada tanto aqui quanto
    // depois de cada reenvio manual bem-sucedido).
    renderItens();
    const restantes = total - sucesso - falhas - cancelados;
    if(restantes > 0){
      // Não deveria sobrar nada não contabilizado; se sobrar por algum
      // motivo imprevisto, soma como falha em vez de desaparecer em
      // silêncio, para o usuário sempre saber o total real.
      falhas += restantes;
    }
    verificarFechamentoAutomaticoLote_();
    if(cancelados && !falhas) toast(sucesso + ' de ' + total + ' arquivo(s) enviados — ' + cancelados + ' cancelado(s).');
    else if(!falhas && !cancelados) toast(sucesso + ' arquivo' + (sucesso === 1 ? '' : 's') + ' enviado' + (sucesso === 1 ? '' : 's') + ' com sucesso.');
    else toast(sucesso + ' de ' + total + ' arquivo(s) enviados — ' + falhas + ' com falha' + (cancelados ? ' e ' + cancelados + ' cancelado(s)' : '') + '.', 'error');
    // Se chegaram arquivos novos enquanto este lote ainda estava rodando
    // (ver a checagem de reentrância no início da função), eles esperaram
    // na fila — agora que este lote terminou de vez (uploadLoteAtivo_ já
    // está null), começa o próximo automaticamente, sozinho.
    if(filaProximoLote_.length){
      const proximos = filaProximoLote_;
      filaProximoLote_ = [];
      handleUploadLote(proximos);
    }
  }
}

function atualizarItemLote_(indice, estado){
  const itemEl = document.getElementById('upItem-' + indice);
  const statusEl = document.getElementById('upStatus-' + indice);
  const cancelarEl = document.getElementById('upCancelar-' + indice);
  const reenviarEl = document.getElementById('upReenviar-' + indice);
  if(itemEl) itemEl.classList.toggle('cancelado', estado === 'cancelado');
  if(statusEl){
    statusEl.className = 'up-item-status ' + estado;
    if(estado === 'enviando') statusEl.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
    else if(estado === 'ok') statusEl.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
    else if(estado === 'cancelado') statusEl.innerHTML = '<i class="fa-solid fa-ban"></i>';
    else statusEl.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i>';
  }
  // O X de cancelar continua escondido quando o item já terminou bem (ok)
  // ou já foi cancelado (nesses casos ele some sozinho da lista, ver
  // abaixo). Quando o item termina em FALHA, porém, o X permanece visível
  // — reaproveitado aqui como "remover da lista", já que o botão de
  // Reenviar nem sempre resolve (ex.: quando o conteúdo local sumiu do
  // navegador) e antes não sobrava nenhuma forma de tirar o item travado
  // da tela (ver cancelarItemLote_).
  if(cancelarEl){
    cancelarEl.classList.toggle('hidden', estado === 'ok' || estado === 'cancelado');
    cancelarEl.title = (estado === 'falha') ? 'Remover da lista' : 'Cancelar';
  }
  if(reenviarEl) reenviarEl.classList.toggle('hidden', estado !== 'falha');
  // Atualiza só o número do contador (não a lista inteira, que fica
  // parada de propósito durante um lote ativo — ver comentário logo
  // abaixo) assim que este item específico é confirmado no Drive, para o
  // total de arquivos subir em tempo real conforme cada um termina.
  if(estado === 'ok') atualizarContagemArquivos_();
  // ITEM (remover da janela de envio à medida que sobe): arquivos enviados
  // com sucesso (ou cancelados, que não precisam de nenhuma ação do
  // usuário) somem da lista pouco depois de concluídos — só o "check"
  // aparece por um instante antes de sumir, igual ao painel de upload do
  // Google Drive. Arquivos com FALHA continuam visíveis, com o ícone de
  // reenviar ao lado, até o usuário tentar de novo (ou fechar o painel
  // manualmente) — não são removidos sozinhos.
  if(estado === 'ok' || estado === 'cancelado') setTimeout(() => removerItemLote_(itemEl), 650);
}
// ITEM (item marcado como falha no painel, mas já enviado com sucesso):
// chamada sempre que chegam dados novos do servidor (Sync.applyData) —
// reconfere cada item do lote atual/mais recente que ainda esteja
// marcado como 'falha' no painel; se o documento correspondente já tem
// driveId (ou seja, terminou de subir depois que o painel desistiu de
// esperar), corrige o item para sucesso, que então some sozinho como
// qualquer envio bem-sucedido.
function reconciliarPainelUploadComDados_(){
  if(!uploadLoteItens_ || !uploadLoteItens_.length) return;
  const painel = document.getElementById('uploadProgressPanel');
  if(!painel) return; // painel já fechado — nada para reconciliar
  const docs = DB.get('Documentos');
  uploadLoteItens_.forEach((item, indice) => {
    if(!item || !item.docId) return;
    const statusEl = document.getElementById('upStatus-' + indice);
    if(!statusEl || !statusEl.classList.contains('falha')) return;
    const doc = docs.find(d => d && d.id === item.docId);
    if(doc && doc.driveId && !doc.erroUpload) atualizarItemLote_(indice, 'ok');
  });
}
// Remove visualmente um item já concluído do painel (com uma pequena
// transição) e atualiza o título com a contagem de arquivos que ainda
// restam na lista — e verifica se já dá pra fechar o painel sozinho.
function removerItemLote_(itemEl){
  if(!itemEl || !itemEl.parentNode) return;
  itemEl.classList.add('up-item-saindo');
  setTimeout(() => {
    if(itemEl && itemEl.parentNode) itemEl.remove();
    atualizarTituloLote_();
    verificarFechamentoAutomaticoLote_();
  }, 260);
}
function itensRestantesLote_(){
  const panel = document.getElementById('uploadProgressPanel');
  return panel ? panel.querySelectorAll('.up-list .up-item').length : 0;
}
function atualizarTituloLote_(){
  const panel = document.getElementById('uploadProgressPanel');
  if(!panel) return;
  const titleSpan = panel.querySelector('.up-title span');
  if(!titleSpan) return;
  const restantes = itensRestantesLote_();
  titleSpan.textContent = restantes > 0
    ? ('Enviando ' + restantes + ' arquivo' + (restantes === 1 ? '' : 's') + '…')
    : 'Envio concluído';
}
// ITEM (só fechar sozinho se TODOS os arquivos foram enviados com
// sucesso): como um item com falha NUNCA é removido automaticamente
// (fica na lista com o ícone de reenviar até o usuário agir), a lista só
// chega a "zero itens restantes" quando não sobra nenhuma falha pendente
// — seja porque tudo deu certo de primeira, seja porque o usuário
// reenviou manualmente cada item que tinha falhado. Só nesse momento o
// painel se fecha sozinho; havendo qualquer falha ainda não resolvida,
// ele permanece na tela.
function verificarFechamentoAutomaticoLote_(){
  const panel = document.getElementById('uploadProgressPanel');
  if(!panel) return;
  if(itensRestantesLote_() > 0) return;
  const titleSpan = panel.querySelector('.up-title span');
  if(titleSpan) titleSpan.textContent = 'Envio concluído';
  const jaEscondido = panel.style.display === 'none';
  setTimeout(() => {
    const atual = document.getElementById('uploadProgressPanel');
    if(atual && !atual.querySelector('.up-list .up-item')) atual.remove();
  }, jaEscondido ? 0 : 900);
}
// ITEM 2 (X ao lado de cada arquivo): cancela um arquivo da fila do lote
// atual. Se ele ainda não começou a enviar, é pulado (nunca chega a subir
// pro Drive). Se já estiver em voo, o envio em si não é abortado no meio
// (não dá pra cancelar uma requisição já em andamento com segurança), mas
// o resultado é descartado e o item aparece como "cancelado" para o
// usuário.
function cancelarItemLote_(indice){
  const statusEl = document.getElementById('upStatus-' + indice);
  // Item já terminou com falha: o X aqui vira "remover da lista" (ver
  // atualizarItemLote_) — só descarta visualmente o item, sem depender do
  // lote ainda estar em andamento (uploadLoteAtivo_ pode já ter virado
  // null se o lote inteiro já encerrou, o que antes fazia este clique não
  // fazer nada e deixava o item travado pra sempre no painel).
  if(statusEl && statusEl.classList.contains('falha')){
    removerItemLote_(document.getElementById('upItem-' + indice));
    return;
  }
  if(!uploadLoteAtivo_) return;
  uploadLoteAtivo_.cancelados.add(indice);
  // Só marca visualmente na hora se ainda estiver "aguardando" (relógio) —
  // se já estiver "enviando", o próprio trabalhador atualiza o visual
  // quando a chamada em andamento terminar (ver handleUploadLote).
  if(statusEl && statusEl.classList.contains('up-item-status') && !statusEl.classList.contains('enviando')){
    atualizarItemLote_(indice, 'cancelado');
  }
}
// ITEM (ícone de reenviar ao lado de arquivo com falha): tenta enviar de
// novo SOMENTE aquele item. Reaproveita o mesmo documento já criado
// (uploadLoteItens_[indice].docId), em vez de recriar um novo — assim não
// duplica o arquivo. Se o documento chegou a ter driveId (falhou só ao
// MOVER, não ao enviar o conteúdo), pede pro servidor tentar mover de
// novo; se ainda tem a cópia local do conteúdo mas nunca subiu, reenvia o
// conteúdo; e só refaz a leitura do arquivo do zero (sem risco de
// duplicar) no caso raro de nunca ter chegado a criar documento nenhum
// (falha bem no início, antes de qualquer gravação).
async function reenviarItemLote_(indice){
  if(!uploadLoteItens_ || !uploadLoteItens_[indice]) return;
  const item = uploadLoteItens_[indice];
  const itemEl = document.getElementById('upItem-' + indice);
  if(!itemEl) return; // painel já foi fechado / item não existe mais
  atualizarItemLote_(indice, 'enviando');
  iniciarUploadEmAndamento_();
  let ok = false;
  try{
    const docExistente = item.docId ? DB.get('Documentos').find(x => x.id === item.docId) : null;
    if(docExistente && docExistente.driveId){
      DB.set('Documentos', DB.get('Documentos').map(x => x.id === item.docId ? Object.assign({}, x, {movePending:true, erroUpload:''}) : x));
      ok = true; // confirmação real virá do próximo pull; item some quando o Drive confirmar
    } else if(docExistente && docExistente.arquivo){
      DB.set('Documentos', DB.get('Documentos').map(x => x.id === item.docId ? Object.assign({}, x, {erroUpload:''}) : x));
      const res = await enviarArquivoAoDrive_(Object.assign({}, docExistente, {erroUpload:''}));
      ok = !!(res && res.ok);
      // Aplica o driveId/driveUrl já retornados pelo servidor direto no
      // cache local — sem isso, o item só sai do estado "sem driveId" (e
      // só entra na contagem/lista do dashboard) depois que um pull em
      // segundo plano confirmar, o que pode levar alguns segundos e dá a
      // impressão de que o total de arquivos não atualizou ao reenviar.
      if(ok && res.res && res.res.driveId){
        DB.set('Documentos', DB.get('Documentos').map(x => x.id === item.docId ? Object.assign({}, x, {driveId: res.res.driveId, driveUrl: res.res.driveUrl || '', arquivo:'', erroUpload:''}) : x));
      }
      // Mesma verificação de segurança do lote automático: se o cliente
      // deu como falha (timeout) mas o servidor tinha na verdade
      // terminado o envio, confirma antes de mostrar o ícone vermelho de
      // novo.
      if(!ok) ok = await verificarUploadConfirmadoNoServidor_(item.docId);
    } else if(docExistente){
      toast('O conteúdo original de "' + item.file.name + '" não está mais disponível neste navegador. Remova o item e envie de novo.', 'error');
      ok = false;
    } else {
      // nunca chegou a criar documento nenhum — pode tentar do zero com
      // segurança, nada será duplicado.
      const res = await handleUploadComTimeout_(item.file);
      if(res && res.docId) item.docId = res.docId;
      ok = !!(res && res.ok);
    }
  }catch(err){
    ok = false;
  }finally{
    terminarUploadEmAndamento_();
  }
  atualizarItemLote_(indice, ok ? 'ok' : 'falha');
  renderItens();
  if(!ok) toast('Falha ao reenviar "' + item.file.name + '".', 'error');
}
// ITEM 2 (X para fechar a janela de envio): apenas esconde o painel — os
// arquivos que ainda estiverem na fila ou em voo continuam sendo
// enviados normalmente em segundo plano (a trava de inatividade do ITEM 3
// continua ativa até o lote inteiro terminar, painel visível ou não).
function fecharPainelLote_(){
  const el = document.getElementById('uploadProgressPanel');
  if(el) el.style.display = 'none';
}
function esconderProgressoLote_(){
  const el = document.getElementById('uploadProgressPanel');
  if(el) el.remove();
}

        corpo = '<div class="' + (protegido ? 'pdf-restrito' : '') + '"><video class="prev-media" controls src="' + d.arquivo + '"></video></div>';
      } else {
        corpo = '<div class="' + (protegido ? 'pdf-restrito' : '') + '">' + placeholderMidia + '</div>';
        videoPendente = {doc: d, fallbackIframe: drivePrev};
      }
    }
    else if(cat === 'audio' && d.arquivo){
      corpo = '<div style="padding:24px 0"><audio controls style="width:100%" src="' + d.arquivo + '"></audio></div>';
    }
    else if(cat === 'txt' && d.arquivo){
      corpo = '<div class="doc-body">' + esc(dataURLTexto(d.arquivo)) + '</div>';
    }
    else if(cat === 'word' || cat === 'sheet'){
      corpo = placeholderOffice;
      officePendente = {kind: cat, doc: d};
    }
    else corpo = noPrev(ci);
  } else if(d.tipo === 'arquivo' && !d.erroUpload){
    // ITEM 14: quando o documento ainda não tem nem cópia local (d.arquivo,
    // já pode ter expirado a proteção de pendência local) nem driveId (o
    // envio ainda não foi confirmado pelo servidor), a mensagem antiga
    // ("Pré-visualização indisponível para este formato") era enganosa —
    // o problema não é o formato do arquivo, é que o conteúdo ainda não
    // está disponível em lugar nenhum por causa de um envio em andamento
    // (ver "Enviando para o Drive…" na listagem). O polling automático
    // (agendarPull) já está tentando resolver isso sozinho.
    corpo = '<div class="no-prev"><i class="fa-solid fa-cloud-arrow-up fa-fade"></i>Este arquivo ainda está sendo enviado ao Drive.<br>A pré-visualização estará disponível assim que o envio terminar — tente novamente em instantes.</div>';
  } else corpo = noPrev(ci);

  bloqueioAtivo = protegido;

  const acoes =
    (podeEmail
      ? '<button class="btn btn-light" data-action="email-doc" data-id="' + d.id + '"><i class="fa-solid fa-envelope"></i> Email</button>'
      : '<button class="btn btn-light" disabled title="Envio por e-mail não permitido"><i class="fa-solid fa-lock"></i> Email</button>') +
    (podeBaixar
      ? '<button class="btn btn-light" data-action="baixar-doc" data-id="' + d.id + '"><i class="fa-solid fa-download"></i> Baixar</button>'
      : '<button class="btn btn-light" disabled title="Download não permitido"><i class="fa-solid fa-lock"></i> Baixar</button>') +
    (podeImprimir ? '<button class="btn btn-light" data-action="imprimir-doc" data-id="' + d.id + '"><i class="fa-solid fa-print"></i> Imprimir</button>' : '') +
    '<button class="btn btn-primary" data-action="fechar-modal">Fechar</button>';
  openModal('<div class="doc-head"><h3><i class="fa-solid ' + ci.ic + '"></i> ' + esc(d.titulo) + '</h3>' +
    '<button class="btn-ic" data-action="fechar-modal" title="Fechar"><i class="fa-solid fa-xmark"></i></button></div>' +
    '<div class="doc-meta"><span><i class="fa-solid fa-user"></i>' + esc(autor) + '</span>' +
    '<span><i class="fa-solid fa-folder"></i>' + (pasta ? esc(pasta.nome) : 'Raiz') + '</span>' +
    '<span><i class="fa-solid fa-clock"></i>' + fmtData(d.atualizadoEm || d.criadoEm) + '</span>' +
    (d.tamanho ? '<span><i class="fa-solid fa-database"></i>' + fmtTam(d.tamanho) + '</span>' : '') + '</div>' +
    (d.descricao ? '<p class="modal-sub" style="margin-top:-8px"><i class="fa-solid fa-align-left"></i> ' + esc(d.descricao) + '</p>' : '') +
    '<div class="doc-viewer-corpo">' + corpo + '</div>' +
    '<div class="modal-actions">' + acoes + '</div>', 'modal-doc-view');
  ajustarAlturaDocViewer_();

  const cont0 = $('#officePrev');
  if(officePendente && cont0){
    const alvo = officePendente;
    const falha = () => { cont0.innerHTML = '<div class="no-prev" style="background:transparent"><i class="fa-solid ' + ci.ic + '"></i>Não foi possível gerar a pré-visualização.<br>Use "Baixar" para abrir no aplicativo correspondente.</div>'; };
    obterBuffer(alvo.doc)
      .then(buf => alvo.kind === 'word' ? renderDocx(buf, cont0) : renderXlsx(buf, cont0))
      .catch(falha);
  }
  if(imgPendente || videoPendente){
    const alvo = imgPendente || videoPendente;
    const isImg = !!imgPendente;
    const cont = $('#midiaPrev');
    const falhaMidia = () => {
      if(alvo.fallbackIframe && cont && cont.parentElement){
        cont.parentElement.innerHTML = '<iframe class="pdf-frame" scrolling="yes" referrerpolicy="no-referrer" src="' + esc(alvo.fallbackIframe) + '"></iframe>';
      } else if(cont){
        cont.innerHTML = '<i class="fa-solid ' + ci.ic + '"></i>Não foi possível carregar a pré-visualização.<br>Use "Baixar" para abrir no aplicativo correspondente.';
      }
    };
    obterBuffer(alvo.doc).then(buf => {
      if(!cont || !cont.parentElement) return;
      const mime = alvo.doc.mime || (isImg ? 'image/*' : 'video/*');
      const url = URL.createObjectURL(new Blob([buf], {type: mime}));
      currentBlobUrl = url;
      cont.parentElement.innerHTML = isImg
        ? '<img class="prev-img" src="' + url + '" alt="">'
        : '<video class="prev-media" controls src="' + url + '"></video>';
    }).catch(falhaMidia);
  }
  if(pdfPendente){
    const alvo = pdfPendente;
    const cont = $('#pdfRestrito');
    const falhaSemAlternativa = () => { if(cont) cont.innerHTML = '<div class="no-prev" style="width:100%"><i class="fa-solid fa-lock"></i>Visualização protegida indisponível para este arquivo.<br>Solicite permissão de download para acessar o conteúdo.</div>'; };
    // ITEM: quando o nosso visualizador (canvas) não consegue ler os bytes
    // do arquivo (ex.: sem cópia local e a busca ao Drive falhou por CORS),
    // caímos de volta para o player embutido do próprio Drive — que sempre
    // funciona, por ser a página pública do próprio Drive, mas cuja barra de
    // rolagem é deles, não nossa.
    const falhaComFallback = () => {
      if(alvo.fallbackIframe && cont && cont.parentElement){
        cont.parentElement.innerHTML = '<iframe class="pdf-frame" scrolling="yes" referrerpolicy="no-referrer" src="' + esc(alvo.fallbackIframe) + '"></iframe>';
      } else {
        falhaSemAlternativa();
      }
    };
    obterBuffer(alvo.doc)
      .then(buf => renderPdfProtegido(new Uint8Array(buf), cont, alvo.protegido))
      .catch(alvo.protegido ? falhaSemAlternativa : falhaComFallback);
  }
}

/* ITEM 5: log de exclusões. Vem só do backend (aba "Excluidos" da planilha,
   alimentada pelo Apps Script sempre que um arquivo ou pasta é apagado do
   Drive) — mostramos aqui data/hora, usuário e o que foi excluído. */
/* Cada registro não tem um id próprio (vem direto da planilha), então
   montamos uma chave estável a partir dos seus próprios campos para
   controlar a seleção de checkboxes entre re-renderizações. */
function excluidoKey(r){ return [r.data_hora, r.usuario, r.tipo, r.nome].map(v => String(v == null ? '' : v)).join('||'); }
function renderExcluidos(){
  const registros = DB.get('Excluidos').slice().sort((a,b) => new Date(b.data_hora) - new Date(a.data_hora));
  const chavesAtuais = new Set(registros.map(excluidoKey));
  /* remove da seleção qualquer chave que não exista mais na lista atual */
  Array.from(state.selecaoExcluidos).forEach(k => { if(!chavesAtuais.has(k)) state.selecaoExcluidos.delete(k); });
  const nSel = state.selecaoExcluidos.size;
  const todosSelecionados = registros.length > 0 && nSel === registros.length;
  $('#viewRoot').innerHTML = '<div class="view">' +
  '<div class="page-title" style="display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap">' +
    '<span>Excluídos</span>' +
    (registros.length ? '<button class="btn btn-danger" data-action="limpar-excluidos" style="font-size:13px;padding:8px 14px"><i class="fa-solid fa-broom"></i> Limpar excluídos</button>' : '') +
  '</div>' +
  '<section class="card"><div class="card-head"><h2><i class="fa-solid fa-trash-can"></i> Histórico de exclusões</h2></div>' +
  '<p class="sobre-texto" style="padding:12px 22px 0">Registro de todo arquivo ou pasta apagado do Google Drive, com data/hora e quem fez a exclusão.</p>' +
  (nSel ? '<div class="sel-bar" style="margin:14px 22px 0;border-radius:8px;border:1px solid var(--border)">' +
      '<span class="sel-count"><i class="fa-solid fa-check-double"></i> ' + nSel + ' selecionado' + (nSel>1?'s':'') + '</span>' +
      '<button class="btn btn-danger" data-action="excluir-selecionados-excluidos"><i class="fa-solid fa-trash-can"></i> Excluir selecionados</button>' +
      '<button class="btn btn-light" data-action="limpar-selecao-excluidos"><i class="fa-solid fa-xmark"></i> Limpar seleção</button>' +
    '</div>' : '') +
  (registros.length
    ? '<div class="table-wrap"><table><thead><tr>' +
        '<th style="width:36px"><input type="checkbox" class="sel-chk" data-action="toggle-sel-all-excluidos" ' + (todosSelecionados ? 'checked' : '') + '></th>' +
        '<th>Data/Hora</th><th>Usuário</th><th>Tipo</th><th>Nome</th>' +
      '</tr></thead><tbody>' +
      registros.map(r => {
        const key = excluidoKey(r);
        const marcado = state.selecaoExcluidos.has(key);
        return '<tr class="' + (marcado ? 'sel-row' : '') + '">' +
        '<td><input type="checkbox" class="sel-chk" data-action="toggle-sel-excluido" data-key="' + esc(key) + '" ' + (marcado ? 'checked' : '') + '></td>' +
        '<td><small>' + esc(new Date(r.data_hora).toLocaleString('pt-BR')) + '</small></td>' +
        '<td>' + esc(r.usuario || '—') + '</td>' +
        '<td>' + (r.tipo === 'pasta' ? '<span class="tag tag-view"><i class="fa-solid fa-folder"></i> Pasta</span>' : '<span class="tag tag-view"><i class="fa-solid fa-file"></i> Arquivo</span>') + '</td>' +
        '<td>' + esc(r.nome || '—') + '</td>' +
      '</tr>';
      }).join('') +
      '</tbody></table></div>'
    : '<p class="sobre-texto" style="padding:0 22px 20px">Nenhuma exclusão registrada ainda.</p>') +
  '</section></div>';
}

document.addEventListener('click', e => {
  const pop = $('.viewmenu-pop.open');
  if(pop && !e.target.closest('.viewmenu')) pop.classList.remove('open');
  if(!e.target.closest('.item-menu')){
    document.querySelectorAll('.item-menu-pop.open').forEach(p => p.classList.remove('open'));
  }
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const a = el.dataset.action;
  const id = el.dataset.id || null;
  // ITEM: ação escolhida dentro do menu "⋮" (celular) — fecha o menu na hora,
  // antes de executar a ação, pra não ficar sobreposto na tela.
  if(el.dataset.fechaMenu){
    document.querySelectorAll('.item-menu-pop.open').forEach(p => p.classList.remove('open'));
  }

  if(a === 'recarregar'){ location.reload(); return; }
  // ITEM 2: ações do painel de progresso de upload — ficam antes da
  // checagem de usuário logado só por consistência com "recarregar" acima
  // (na prática sempre há sessão ativa quando o painel está visível).
  if(a === 'up-cancelar'){ cancelarItemLote_(Number(el.dataset.idx)); return; }
  if(a === 'up-reenviar'){ reenviarItemLote_(Number(el.dataset.idx)); return; }
  if(a === 'up-fechar'){ fecharPainelLote_(); return; }

  const u = currentUser();
  if(!u) return;

  switch(a){
    case 'importar-pendentes-drive': {
      const tmp = window.__pendentesDriveTmp || {pastas:[], arquivos:[]};
      const agora = Date.now();
      if(tmp.pastas.length){
        const pastasAtuais = DB.get('Pastas');
        tmp.pastas.forEach(p => pastasAtuais.push({id: uid('p'), nome: p.nome, parentId: null, driveFolderId: p.driveFolderId, criadaPor: u.id, criadoEm: agora}));
        DB.set('Pastas', pastasAtuais);
      }
      if(tmp.arquivos.length){
        const docsAtuais = DB.get('Documentos');
        tmp.arquivos.forEach(a => {
          const ext = (a.nome.includes('.') ? a.nome.split('.').pop() : 'bin').toLowerCase();
          docsAtuais.push({id: uid('d'), pastaId: null, titulo: a.nome.replace(/\.[^.]+$/, ''), tipo:'arquivo', ext:ext, mime:'', driveId: a.driveId, driveUrl: a.url, tamanho: a.tamanho||0, criadoPor: u.id, criadoEm: agora, atualizadoEm: agora});
        });
        DB.set('Documentos', docsAtuais);
      }
      delete window.__pendentesDriveTmp;
      fecharModal();
      toast('Itens importados na Raiz. Você pode movê-los para as pastas corretas.');
      renderDashboard();
      break;
    }
    case 'sincronizar-drive': {
      if(!ehAdmin(u)){ toast('Apenas administradores podem sincronizar com o Drive.','error'); break; }
      sincronizacaoCompletaDrive_();
      break;
    }
    case 'limpar-ids-duplicados': {
      if(!podeSincronizarDrive_(u)){ toast('Sem permissão para esta ação.','error'); break; }
      modalConfirm('Limpar IDs duplicados', 'Procura linhas de Documentos/Pastas que compartilham o mesmo id (efeito de uma gravação concorrente) e remove a cópia incompleta de cada grupo, mantendo sempre a mais completa. Não mexe em registros com ids diferentes. Continuar?', () => {
        toast('Procurando e limpando duplicatas…','info');
        Sync.limparIdsDuplicados().then(res => {
          if(!res || res.ok === false){ toast((res&&res.erro)||'Não foi possível limpar as duplicatas.','error'); return; }
          const total = (res.documentosRemovidos||0) + (res.pastasRemovidas||0);
          if(!total){ toast('Nenhuma linha duplicada encontrada.'); return; }
          toast(res.documentosRemovidos + ' documento(s) e ' + res.pastasRemovidas + ' pasta(s) duplicados removidos.');
          Sync.pull().then(data => { if(data) Sync.applyData(data); renderApp(); }).catch(()=>{});
        }).catch(() => toast('Falha de conexão ao limpar duplicatas.','error'));
      });
      break;
    }
    case 'remover-orfaos-drive': {
      const tmp = window.__orfaosDriveTmp || {pastas:[], arquivos:[]};
      const idsPastas = tmp.pastas.map(p => p.id);
      const idsDocs = tmp.arquivos.map(a => a.id);
      // ITEM 4: ao remover uma pasta órfã, também removemos (localmente) suas
      // subpastas e documentos, já que a pasta-mãe não existe mais no Drive.
      if(idsPastas.length){
        let todasPastas = new Set(idsPastas);
        let mudou = true;
        while(mudou){
          mudou = false;
          DB.get('Pastas').forEach(p => {
            if(p.parentId && todasPastas.has(p.parentId) && !todasPastas.has(p.id)){ todasPastas.add(p.id); mudou = true; }
          });
        }
        const docsDentro = DB.get('Documentos').filter(d => d.pastaId && todasPastas.has(d.pastaId)).map(d => d.id);
        marcarExcluido_('Pastas', Array.from(todasPastas));
        marcarExcluido_('Documentos', docsDentro.concat(idsDocs));
        DB.set('Pastas', DB.get('Pastas').filter(p => !todasPastas.has(p.id)));
        DB.set('Documentos', DB.get('Documentos').filter(d => !(d.pastaId && todasPastas.has(d.pastaId)) && !idsDocs.includes(d.id)));
      } else if(idsDocs.length){
        marcarExcluido_('Documentos', idsDocs);
        DB.set('Documentos', DB.get('Documentos').filter(d => !idsDocs.includes(d.id)));
      }
      delete window.__orfaosDriveTmp;
      fecharModal();
      toast('Itens removidos do app — sincronizado com o Drive.');
      renderDashboard();
      break;
    }
    case 'logout': {
      if(session && session.token) gasCall_('apiLogout',[session.token]).catch(()=>{}); limparSessao_();
      mostrarLogin(); buscarDadosLogin();
      const lf = $('#loginForm'); if(lf) lf.reset();
      const le = $('#loginErro'); if(le) le.textContent = '';
      const lst = $('#loginStatus'); if(lst){ lst.innerHTML = ''; lst.classList.add('hidden'); }
      break;
    }
    case 'nav':
      navigate(el.dataset.view);
      break;
    case 'menu-view': {
      alternarPopupMenu_('viewPop');
      break;
    }
    case 'menu-enviar': { alternarPopupMenu_('enviarPop'); break; }
    case 'menu-ordenar': { alternarPopupMenu_('ordenarPop'); break; }
    case 'menu-imprimir': { alternarPopupMenu_('imprimirPop'); break; }
    case 'set-ordenar':
      state.ordenacao = {campo: el.dataset.campo, direcao: el.dataset.direcao};
      renderDashboard();
      break;
    case 'imprimir-lista': imprimirListaArquivos_(el.dataset.escopo); break;
    case 'toggle-item-menu': {
      const alvo = document.getElementById(el.dataset.target);
      const jaAberto = alvo && alvo.classList.contains('open');
      document.querySelectorAll('.item-menu-pop.open').forEach(p => { p.classList.remove('open'); p.classList.remove('abre-para-cima'); });
      if(alvo && !jaAberto){
        alvo.classList.add('open');
        // ITEM 15 (menu "⋮" cortado no fim da lista): antes ele sempre
        // abria para baixo, sem checar se havia espaço na tela — perto do
        // fim da lista (como no último arquivo), as opções de baixo
        // ficavam cortadas fora da área visível. Agora verifica o espaço

        const rectBtn = el.getBoundingClientRect();
        const alturaEstimada = alvo.scrollHeight || 240;

    }
    case 'set-view':
      state.viewMode = el.dataset.mode;

    case 'open-folder':

    case 'goto':
      limparSelecao(); state.currentFolderId = id || null; state.search = ''; renderDashboard(); break;
    case 'voltar': {

      const p = pastaPorId(state.currentFolderId);

    case 'toggle-sel': {

    }
    case 'limpar-selecao':

      renderItens(); renderSelBar();
      break;
    case 'toggle-sel-excluido': {
      const key = el.dataset.key;
      if(el.checked) state.selecaoExcluidos.add(key); else state.selecaoExcluidos.delete(key);
      renderExcluidos();
      break;
    }
    case 'toggle-sel-all-excluidos': {
      const registros = DB.get('Excluidos');
      if(el.checked) registros.forEach(r => state.selecaoExcluidos.add(excluidoKey(r)));
      else state.selecaoExcluidos.clear();
      renderExcluidos();
      break;
    }
    case 'limpar-selecao-excluidos':
      state.selecaoExcluidos.clear();
      renderExcluidos();
      break;
    case 'excluir-selecionados-excluidos': {
      const n = state.selecaoExcluidos.size;
      if(!n) break;
      modalConfirm('Excluir selecionados', 'Remover ' + n + ' registro' + (n>1?'s':'') + ' selecionado' + (n>1?'s':'') + ' do histórico de exclusões? Isso não afeta os arquivos/pastas em si, apenas este registro.', () => {
        // CORREÇÃO: antes isto só apagava a cópia local (guardarFolhaSeguro),
        // sem avisar o servidor — e como apiPush recusa gravar na folha
        // "Excluidos", os registros voltavam no próximo pull (outra ação, ou

        gasCall_('apiExcluirRegistrosExcluidos', [session.token, chaves]).then(res => {
          if(!res || res.ok === false){ toast((res && res.erro) || 'Não foi possível remover os registros.', 'error'); return; }
          marcarExcluidoHistorico_(chaves);
          const restantes = DB.get('Excluidos').filter(r => !state.selecaoExcluidos.has(excluidoKey(r)));
          guardarFolhaSeguro('Excluidos', restantes);
          state.selecaoExcluidos.clear();
          toast('Registro(s) removido(s) do histórico.'); renderExcluidos();
        }).catch(() => toast('Falha de conexão ao remover os registros.', 'error'));
      });
      break;
    }
    case 'email-selecionados': {
      const keys = [...state.selecao];
      const docIdsAll = keys.filter(k => k.indexOf('doc:') === 0).map(k => k.slice(4));
      if(!docIdsAll.length){ toast('Selecione ao menos um arquivo para enviar por e-mail.','info'); break; }

    }
    case 'confirmar-email-multi': {
      const docIds = (el.dataset.ids || '').split(',').filter(Boolean);
      if(!docIds.length){ toast('Nenhum arquivo selecionado.','error'); break; }
      const destinatario = ($('#eDestinatarioMulti') || {}).value?.trim() || '';
      const assunto = ($('#eAssuntoMulti') || {}).value?.trim() || '';

      // ITEM: pastas selecionadas não podem ir para dentro de si mesmas, de

      let proibidas = new Set();

      if(destId && proibidas.has(destId)){ toast('Não é possível mover uma pasta para dentro dela mesma ou de outra pasta selecionada.','error'); break; }

      let movidosD = 0, semPermD = 0, jaLaD = 0;
      if(tmp.docIds.length){
        const docsAtuais = DB.get('Documentos');
        const atualizados = docsAtuais.map(x => {

          movidosD++;

        });
        DB.set('Documentos', atualizados);
      }
      let movidosP = 0, semPermP = 0, jaLaP = 0;

          if(tmp.pastaIds.indexOf(x.id) === -1) return x;

      modalConfirm('Excluir selecionados', 'Excluir definitivamente ' + partes.join(' e ') + '? Pastas são excluídas com todo o conteúdo, inclusive no Google Drive.', () => {
        const permsCtx = permsAtuais();

      $$('#viewRoot input[data-fmt]').forEach(cb => cb.checked = false);
      break;
    case 'salvar-config': {
      if(!ehAdmin(u)){ toast('Apenas administradores podem alterar as configurações.','error'); break; }
      const formats = $$('#viewRoot input[data-fmt]:checked').map(i => i.dataset.fmt);
      if(!formats.length){ toast('Selecione ao menos um formato de upload.','error'); break; }
      const inatividadeEl = $('#cfgInatividade');
      let tempoInatividadeMin = INATIVIDADE_PADRAO_MIN;
      if(inatividadeEl){
        tempoInatividadeMin = parseInt(inatividadeEl.value, 10);
        if(!isFinite(tempoInatividadeMin)) tempoInatividadeMin = INATIVIDADE_PADRAO_MIN;
        tempoInatividadeMin = Math.min(INATIVIDADE_MAX_MIN, Math.max(INATIVIDADE_MIN_MIN, tempoInatividadeMin));
      }
      const obj = Object.assign({}, getEmpresa(), {
        nome: $('#cfgNome').value.trim(),
        fantasia: $('#cfgFantasia').value.trim(),
        cnpj: $('#cfgCnpj').value.trim(),
        responsavel: $('#cfgResp').value.trim(),
        endereco: $('#cfgEnd').value.trim(),
        cidade: $('#cfgCidade').value.trim(),
        cep: $('#cfgCep').value.trim(),
        telefone: $('#cfgTel').value.trim(),
        email: $('#cfgEmail').value.trim(),
        site: $('#cfgSite').value.trim(),
        logo: cfgLogo || '',
        formats: formats,
        tempoInatividadeMin: tempoInatividadeMin
      });
      try{ setEmpresa(obj); }catch(err){ toast('Logotipo muito grande para o armazenamento local.','error'); break; }
      reiniciarMonitorInatividade_();
      toast('Configurações salvas com sucesso!');
      renderApp();
      break;
    }
    case 'fechar-modal': fecharModal(); break;
    case 'confirmar-pendente': fecharModal(); if(acaoPendente){ const f = acaoPendente; acaoPendente = null; f(); } break;
    case 'verificar-versao':
      verificarVersao();
      break;
    case 'salvar-pasta': {
      const nome = ($('#mNomePasta') || {}).value;
      if(!nome || !nome.trim()){ toast('Informe o nome da pasta.','error'); return; }
      if(id){
        const p = pastaPorId(id); if(!p) break;
        const permsP = ehAdmin(u) ? ALL_PERMS.slice() : permsEff(u.id, p);
        if(!(permsP.includes('editar') || permsP.includes('excluir_pasta'))){ toast('Sem permissão para renomear esta pasta.','error'); break; }
        DB.set('Pastas', DB.get('Pastas').map(x => x.id === id ? Object.assign({}, x, {nome: nome.trim()}) : x));
        fecharModal(); toast('Pasta renomeada.'); renderDashboard();
      } else {
        if(!permsAtuais().includes('criar_pasta')){ toast('Sem permissão para criar pastas.','error'); break; }
        const pastas = DB.get('Pastas');
        pastas.push({id: uid('f'), nome: nome.trim(), parentId: state.currentFolderId, criadaPor: u.id, criadaEm: Date.now()});
        DB.set('Pastas', pastas); fecharModal(); toast('Pasta criada — sincronizando no Google Drive…'); renderDashboard();
      }
      break;
    }
    case 'salvar-doc': {
      const titulo = ($('#mTitulo') || {}).value.trim();
      if(!titulo){ toast('Informe um título para o documento.','error'); return; }
      const descricao = ($('#mDescricao') || {}).value.trim();
      const docs = DB.get('Documentos');
      if(id){
        const ex = docs.find(x => x.id === id);
        if(ex && ex.tipo === 'arquivo'){
          DB.set('Documentos', docs.map(x => x.id === id ? Object.assign({}, x, {titulo:titulo, descricao:descricao, atualizadoEm:Date.now()}) : x));
          toast('Arquivo renomeado.');
        } else {
          const conteudo = ($('#mConteudo') || {}).value;
          DB.set('Documentos', docs.map(x => x.id === id ? Object.assign({}, x, {titulo:titulo, descricao:descricao, conteudo:conteudo, atualizadoEm:Date.now()}) : x));
          toast('Documento atualizado.');
        }
      } else {
        if(!permsAtuais().includes('upload')){ toast('Sem permissão de upload nesta pasta.','error'); break; }
        const conteudo = ($('#mConteudo') || {}).value;
        docs.push({id: uid('d'), pastaId: state.currentFolderId, titulo:titulo, descricao:descricao, tipo:'texto', conteudo:conteudo, criadoPor:u.id, criadoEm:Date.now(), atualizadoEm:Date.now()});
        DB.set('Documentos', docs);
        toast('Documento gravado com sucesso.');
      }
      fecharModal(); renderItens(); break;
    }
    case 'salvar-permissoes': {
      let perms = DB.get('Permissoes');
      const idsRemovidos = [];
      $$('#modalCard .prow').forEach(row => {
        const userId = row.dataset.user;
        let conjunto = $$('.ptog.on', row).map(b => b.dataset.perm);
        if(conjunto.length && !conjunto.includes('visualizar')) conjunto.unshift('visualizar');
        // Marca explicitamente os ids das permissões antigas removidas
        // aqui (ver DB.set / tombstones) — sem isso, a proteção contra
        // cache local incompleto trataria essa remoção como "ausência
        // não intencional" e a preservaria no servidor em vez de excluir.
        perms.filter(pp => pp.pastaId === id && pp.userId === userId).forEach(pp => idsRemovidos.push(pp.id));
        perms = perms.filter(pp => !(pp.pastaId === id && pp.userId === userId));
        if(conjunto.length) perms.push({id: uid('p'), pastaId: id, userId: userId, perms: conjunto});
      });
      if(idsRemovidos.length) marcarExcluido_('Permissoes', idsRemovidos);
      DB.set('Permissoes', perms); fecharModal(); toast('Permissões da pasta atualizadas e sincronizadas.'); renderDashboard(); break;
    }
    case 'novo-usuario':
      if(ehAdmin(u)) modalNovoUsuario();
      else toast('Apenas administradores podem criar usuários.','error');
      break;
    case 'salvar-usuario': {
      if(!ehAdmin(u)){ toast('Apenas administradores podem criar usuários.','error'); break; }
      const nome = $('#mNomeUser').value.trim(), email = $('#mEmailUser').value.trim().toLowerCase(),
            senha = $('#mSenhaUser').value, ehAdminNovo = $('#mAdminUser').checked;
      /* ITEM 6: não existe mais seletor de "papel" — o acesso do usuário é
         definido pelas permissões marcadas abaixo. "papel" só continua
         guardando se a conta é administrador (acesso total) ou não. */
      if(!nome || !email.includes('@')){ toast('Informe nome e e-mail válidos.','error'); return; }
      if(senha.length < 10){ toast('A senha deve ter ao menos 10 caracteres.','error'); return; }
      if(getUsuarios().some(x => x.email.toLowerCase() === email)){ toast('Este e-mail já está cadastrado.','error'); return; }
      let perms = lerCheckboxes($('#modalCard'));
      if(!perms.length) perms = PRESETS.visualizador.slice();
      if(!perms.includes('visualizar')) perms.unshift('visualizar');
      const usuarios = DB.get('Usuarios');
      usuarios.push({id: uid('u'), nome:nome, email:email, senha:senha, papel: ehAdminNovo ? 'admin' : 'editor', perms:perms, criadoEm:Date.now()});
      DB.set('Usuarios', usuarios); fecharModal(); toast('Usuário criado.'); renderUsuarios(); break;
    }
    case 'excluir-usuario': {
      if(u.papel !== 'master'){ toast('Apenas o Master Admin pode excluir usuários.','error'); break; }
      const x = getUsuarios().find(y => y.id === id);
      modalConfirm('Excluir usuário', 'Remover o usuário <b>' + esc(x ? x.nome : '') + '</b> e suas permissões de pasta?', () => {
        const permsDoUsuario = DB.get('Permissoes').filter(p => p.userId === id).map(p => p.id);
        marcarExcluido_('Usuarios', id);
        marcarExcluido_('Permissoes', permsDoUsuario);
        DB.set('Usuarios', DB.get('Usuarios').filter(y => y.id !== id));
        DB.set('Permissoes', DB.get('Permissoes').filter(p => p.userId !== id));
        toast('Usuário excluído.'); renderUsuarios();
      }); break;
    }
    case 'limpar-excluidos': {
      if(!ehAdmin(u)){ toast('Apenas administradores podem limpar o histórico.','error'); break; }
      modalConfirm('Limpar excluídos', 'Apagar definitivamente todo o histórico de exclusões? Isso não afeta os arquivos/pastas em si, apenas este registro.', () => {
        guardarFolhaSeguro('Excluidos', []);
        Sync.limparExcluidos();
        toast('Histórico de exclusões limpo.'); renderExcluidos();
      }); break;
    }
    case 'salvar-senha': {
      const atual = $('#senhaAtual').value, nova = $('#senhaNova').value, conf = $('#senhaConf').value;
      if(nova.length < 10){ toast('A nova senha deve ter 10+ caracteres.','error'); return; }
      if(nova !== conf){ toast('A confirmação não confere.','error'); return; }
      // ITEM 11: a senha atual agora é verificada no servidor (o navegador
      // não tem mais acesso a nenhum campo de senha pra comparar sozinho).
      Sync.trocarSenha(u.id, atual, nova).then(res => {
        if(res && res.ok){
          ['senhaAtual','senhaNova','senhaConf'].forEach(i => $('#'+i).value = '');
          toast('Senha alterada com sucesso.');
        } else {
          toast((res && res.erro) || 'Não foi possível alterar a senha.','error');
        }
      }).catch(() => toast('Não foi possível conectar ao servidor.','error'));
      break;
    }
  }
});

document.addEventListener('change', e => {
  if(e.target.id === 'fileInput'){
    // ITEM 22 (0 arquivos sobem, nenhuma mensagem aparece): e.target.files
    // é uma lista "viva" — limpar e.target.value ANTES de usá-la também
    // esvazia essa lista, então handleUploadLote recebia sempre 0 arquivos
    // e retornava na hora, em silêncio. Agora copiamos os arquivos para um
    // array de verdade ANTES de limpar o campo.
    const files = Array.from(e.target.files || []);
    e.target.value = '';
    handleUploadLote(files);
    return;
  }
  if(e.target.id === 'folderInput'){
    const files = Array.from(e.target.files || []);
    e.target.value = '';
    handleUploadPasta_(files);
    return;
  }
  if(e.target.id === 'camInput' || e.target.id === 'camGallery'){
    const files = Array.from(e.target.files || []);
    e.target.value = '';
    if(!files.length) return;
    if(camPages.length >= CAM_MAX_PAGINAS){ toast('Limite de ' + CAM_MAX_PAGINAS + ' páginas por digitalização atingido.','error'); return; }
    // ITEM (seleção automática das bordas do documento, como no scanner
    // do Google Drive): cada imagem (foto da câmera ou da galeria) passa
    // pela tela de ajuste de bordas — detecção automática inicial +
    // arraste dos 4 cantos para corrigir — antes de virar página, em vez
    // de usar a foto/imagem inteira direto como antes. Para seleção
    // múltipla da galeria, as imagens entram numa fila e são processadas
    // uma de cada vez (ver processarProximoAjuste_).
    const vagas = Math.max(0, CAM_MAX_PAGINAS - camPages.length);
    ajusteFila = files.slice(0, vagas);
    if(files.length > ajusteFila.length){
      toast('Só ' + ajusteFila.length + ' imagem(ns) cabem no limite de ' + CAM_MAX_PAGINAS + ' páginas — o restante foi ignorado.', 'info');
    }
    processarProximoAjuste_();
    return;
  }
  if(e.target.id === 'logoInput'){
    const f = e.target.files[0]; e.target.value = '';
    if(!f) return;
    if(!/^image\//.test(f.type)){ toast('Selecione um arquivo de imagem.','error'); return; }
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = String(reader.result);
      if(dataUrl.length > 400000){ toast('Imagem muito grande (máx. ~300 KB).','error'); return; }
      cfgLogo = dataUrl;
      const pv = $('#cfgLogoPrev'); if(pv) pv.src = cfgLogo;
      toast('Logotipo carregado — clique em "Salvar alterações" para aplicar.','info');
    };
    reader.readAsDataURL(f);
    return;
  }
});

/* V19 (histórico): esta função reconciliava Drive -> Sheets automaticamente
   sempre que um administrador logava e a aba "Pastas" estava vazia.
   REMOVIDO (a pedido): a chamada automática após o login. A função continua
   disponível e é chamada manualmente pelo botão "Sincronizar com o
   Drive" em Configurações (ver ação 'sincronizar-drive'), nunca mais de
   forma automática. */
function repararDriveSeNecessario_(){
  const u=currentUser();
  if(!u || !ehAdmin(u)) return Promise.resolve(false);
  const pastas=DB.get('Pastas');
  if(pastas.length>0) return Promise.resolve(false);
  return Sync.repararDrive().then(res=>{
    if(!res || res.ok===false) throw new Error((res&&res.erro)||'Não foi possível sincronizar as pastas do Google Drive.');
    return Sync.pull().then(data=>{
      if(!data || data.ok===false || data.authOk!==true || !Sync.applyData(data))
        throw new Error('As pastas foram encontradas no Drive, mas não puderam ser carregadas da planilha.');
      toast('Pastas e arquivos existentes no Google Drive foram sincronizados.','info');
      return true;
    });
  });
}

/* V36 LOGIN: autenticacao por POST/HTTPS. A senha fica somente no corpo da requisicao
   e e processada no servidor. O backend mantem compatibilidade com contas salgadas e legadas. */
// ITEM 5 (login lento): pré-busca o desafio de login assim que o usuário
// sai do campo de e-mail (ex.: ao clicar/Tab para o campo de senha), para
// que a chamada apiLoginDesafio já esteja resolvida (ou em andamento) antes
// mesmo de ele terminar de digitar a senha e clicar em "Entrar".
const loginEmailEl_ = $('#loginEmail');
if(loginEmailEl_){
  const dispararPrefetch_ = () => {
    const email = loginEmailEl_.value.trim().toLowerCase();
    if(!email || email.indexOf('@') === -1 || email.indexOf('.') === -1) return;
    if(desafioPreFetch_ && desafioPreFetch_.email === email) return;
    desafioPreFetch_ = {email, dados: null, obtidoEm: 0};
    gasCall_('apiLoginDesafio', [email]).then(res => {
      if(res && res.ok && res.nonce && desafioPreFetch_ && desafioPreFetch_.email === email){
        desafioPreFetch_ = {email, dados: res, obtidoEm: Date.now()};
      } else if(desafioPreFetch_ && desafioPreFetch_.email === email){
        desafioPreFetch_ = null;
      }
    }).catch(() => { if(desafioPreFetch_ && desafioPreFetch_.email === email) desafioPreFetch_ = null; });
  };
  let prefetchDebounce_ = null;
  loginEmailEl_.addEventListener('blur', dispararPrefetch_);
  // Também tenta ao digitar (com debounce) — cobre autofill de gerenciador
  // de senha e casos em que o "blur" não dispara de forma confiável.
  loginEmailEl_.addEventListener('input', () => {
    clearTimeout(prefetchDebounce_);
    prefetchDebounce_ = setTimeout(dispararPrefetch_, 500);
  });
}

$('#loginForm').addEventListener('submit', e => {
  e.preventDefault();
  const email = $('#loginEmail').value.trim().toLowerCase();
  const senha = $('#loginSenha').value;
  const btn = $('#loginForm').querySelector('button[type="submit"]');
  $('#loginErro').textContent = '';
  if(btn){ btn.disabled = true; btn.dataset.original = btn.dataset.original || btn.innerHTML; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Acessando...'; }
  Sync.login(email, senha).then(res => {
    if(res && res.ok && res.usuario){
      const usr = res.usuario;
      guardarFolhaSeguro('Usuarios', mesclarRows(DB.get('Usuarios'), [usr]).map(normUserRow));
      salvarSessao_({ userId: usr.id, token: res.token });

      // V24 FIX: login válido não é suficiente. Primeiro carregamos os dados
      // reais da planilha com a sessão recém-criada; só depois mostramos o
      // Dashboard. Isso evita entrar com o cache local vazio/desatualizado.
      $('#loginErro').textContent = '';
      return Sync.pull().then(data => {
        const v = Number(data && data.__v || 0);
        backendAntigo = v < APP_VERSAO;

        if(!data || data.ok === false || data.authOk !== true || !Sync.applyData(data)){
          throw new Error('O login foi validado, mas os dados da planilha não puderam ser carregados.');
        }

        // Login confirmado: abrir o Dashboard imediatamente.
        // REMOVIDO (a pedido): a reconciliação automática Drive -> Planilha
        // que rodava sozinha logo após o login. Se as pastas não aparecerem
        // (planilha "Pastas" vazia mas o Drive já tem conteúdo), o admin
        // pode acionar manualmente "Sincronizar com o Drive" em
        // Configurações → Integração Google Drive + Sheets.
        iniciarApp();
        toast('Bem-vindo(a), ' + usr.nome + '!');
        renderApp();
      });
    } else {
      $('#loginErro').textContent = (res && res.erro) || 'E-mail ou senha inválidos.';
    }
  }).catch((erro) => {
    $('#loginErro').textContent = String(erro && erro.message || 'Não foi possível carregar os dados da planilha.');
    if(session && session.token) gasCall_('apiLogout',[session.token]).catch(()=>{});
    limparSessao_();
  }).finally(() => { if(btn){ btn.disabled = false; btn.innerHTML = btn.dataset.original; } });
});

/* ================= BOOT =================
   A URL do Apps Script vem sempre de Code.gs, injetada automaticamente
   nesta página no momento em que ela é servida (ver DEFAULT_GAS_URL e o
   item sobre a remoção da configuração manual, que ficava na antiga tela

}catch(err){

}
