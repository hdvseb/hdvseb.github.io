};

function adotarDados(data){
  let mudou = false;
  try{
    if(Array.isArray(data.Empresa) && data.Empresa.length){
      const antigo = JSON.stringify(empresaMemoria || {});
      empresaMemoria = Object.assign({}, EMPRESA_PADRAO, data.Empresa[0] || {});
      if(JSON.stringify(empresaMemoria) !== antigo) mudou = true;
      guardarFolhaSeguro('Empresa', data.Empresa);
    }
    if(Array.isArray(data.Permissoes)){
      const novo = filtrarTombstones_('Permissoes',data.Permissoes.map(normPermRow));
      if(JSON.stringify(novo) !== JSON.stringify(DB.get('Permissoes'))) mudou = true;
      guardarFolhaSeguro('Permissoes', novo);
    }
    if(Array.isArray(data.Usuarios)){
      const novo = filtrarTombstones_('Usuarios',data.Usuarios.map(normUserRow));
      if(JSON.stringify(novo) !== JSON.stringify(DB.get('Usuarios'))) mudou = true;
      guardarFolhaSeguro('Usuarios', novo);
    }
    ['Pastas','Documentos'].forEach(f=>{
      if(Array.isArray(data[f])){
        const semExcluidos = filtrarTombstones_(f, data[f]);
        let semRace = protegerPendentesLocais_(f, semExcluidos);
        if(f === 'Documentos') semRace = preservarConteudoNaoEnviado_(semRace);
        if(JSON.stringify(semRace) !== JSON.stringify(DB.get(f))) mudou = true;
        guardarFolhaSeguro(f, semRace);
      }
    });
    if(Array.isArray(data.Excluidos)) guardarFolhaSeguro('Excluidos', filtrarTombstonesExcluidos_(data.Excluidos));
    // CORREÇÃO (V48): ver ownerIsAdmin acima — guardado à parte (não passa
    // por DB.set) porque não é uma "planilha" e não deve disparar push.
    if(Array.isArray(data.AdminIds)){
      const antigo = JSON.stringify(DB.get('AdminIds'));
      if(JSON.stringify(data.AdminIds) !== antigo) mudou = true;
      guardarFolhaSeguro('AdminIds', data.AdminIds);
    }
  }catch(e){}
  return mudou;
}
/* Busca os dados da planilha para a tela de login (logotipo, empresa, usuários). */
function buscarDadosLogin(){
  const st = $('#loginStatus');
  const setStatus = (html) => {
    if(st){ st.innerHTML = html; st.className = 'login-status erro'; st.classList.remove('hidden'); }
  };
  const limparStatus = () => { if(st){ st.innerHTML = ''; st.classList.add('hidden'); } };

  let tentativa = 0;
  const tentar = () => {
    tentativa++;
    const inicio = Date.now();

    Sync.pull().then(data => {
      if(!data || typeof data !== 'object'){
        throw new Error('Resposta inválida da planilha.');
      }

      const v = Number(data.__v || 0);
      backendAntigo = v < APP_VERSAO;

      // Empresa.logo é a ÚNICA fonte do logotipo. O HTML não contém o
      // logotipo da empresa.
      Sync.applyData(data);
      aplicarMarca();

      if(!String((getEmpresa()||{}).logo||'').trim()){
        gasCall_('apiLogoPublico',[]).then(r=>{
          if(r&&r.ok&&r.logo){
            empresaMemoria=Object.assign({},getEmpresa(),{logo:String(r.logo)});
            guardarFolhaSeguro('Empresa',[empresaMemoria]);
            aplicarMarca();
          }
        }).catch(()=>{});
      }

      if(Number(data.usuarioCount || 0) > 0){
        limparStatus();
        mostrarLogin();
        return;
      }

      // ITEM 7 (aviso falso de "sem usuários" ao recarregar): esse aviso
      // era um pré-check informativo que disparava assim que a página
      // abria — mais sensível a atraso de "esquentar" do Apps Script do
      // que o próprio login (que naturalmente só é tentado alguns
      // segundos depois, tempo suficiente do backend responder direito).
      // Confirmado que o login continua funcionando normalmente mesmo
      // quando esse aviso aparecia — ou seja, era um falso alarme. Como
      // o próprio login já avisa claramente se e-mail/senha estiverem
      // errados, esse aviso extra não protegia nada que valesse assustar
      // quem só quer entrar. Continua tentando de novo em segundo plano
      // (a checagem serve para o "Verificar versão"/backendAntigo acima),
      // mas não mostra mais nada na tela — nem depois de esgotar as
      // tentativas.
      if(tentativa < 3){
        setTimeout(tentar, 1200 * tentativa);
        return;
      }
      limparStatus();
      mostrarLogin();
    }).catch(err => {
      aplicarMarca();

      if(tentativa < 3){
        // Tenta novamente porque o Apps Script pode responder com atraso
        // após uma nova implantação.
        setTimeout(tentar, 1200 * tentativa);
        return;
      }

      const msg = String(err && err.message || '');
      let dica = 'Verifique a implantação /exec do Apps Script e se ela está publicada como "Qualquer pessoa".';
      if(msg.indexOf('Tempo esgotado') !== -1){
        dica = 'O Apps Script não respondeu. Publique novamente a implantação /exec da versão 28.';
      }

      setStatus('<i class="fa-solid fa-circle-exclamation"></i> Não foi possível carregar os dados da planilha. ' + dica);
      mostrarLogin();
    });
  };

  tentar();
}

/* Sincronização periódica com o app logado.
   REMOVIDO (a pedido): o carregamento/varredura automática das pastas do
   Drive ao abrir o app. Antes, toda vez que o app iniciava (ou era
   recarregado) com uma sessão ativa de administrador, o front chamava
   automaticamente Sync.ensureDriveRoot() (localiza/cria a pasta raiz no
   Drive), Sync.repararDrive() (varredura recursiva de toda a árvore do
   Drive quando "Pastas" estava vazia) e verificarPendentesDrive()
   (varredura recursiva em busca de itens não cadastrados). Essas chamadas
   agora só acontecem quando o administrador aciona manualmente o botão
   "Sincronizar com o Drive" em Configurações → Integração Google Drive
   + Sheets (ver ação 'sincronizar-drive'). O pull normal (dados já
   salvos na planilha) continua acontecendo aqui normalmente. */
function sincronizarInicial(){
  if(!Sync.url()) return;
  Sync.pull().then(data => {
    if(!data || typeof data !== 'object') return;
    const v = Number(data.__v || 0);
    backendAntigo = v < APP_VERSAO;
    if(backendAntigo && !$('#app').classList.contains('hidden')) modalBackendAntigo();
    const adotou = Sync.applyData(data);
    if(adotou){
      // CORREÇÃO (V48): só reenvia (pushAll) se alguma migração local de
      // fato alterou algo — ver comentário acima de cleanupExemplos/
      // migrateDados. Em uso normal (dados já migrados) isso evita 5
      // pushes completos e desnecessários a cada login/reload.
      const mudouMigracao = cleanupExemplos() || migrateDados();
      if(mudouMigracao && !backendAntigo) Sync.pushAll();
    }
    const u = currentUser();
    if(!u){ if(session && session.token) gasCall_('apiLogout',[session.token]).catch(()=>{}); limparSessao_(); mostrarLogin(); buscarDadosLogin(); }
    else if(!$('#app').classList.contains('hidden')) renderApp();
    else aplicarMarca();
    // ITEM 11 ("Enviando para o Drive…" travado para sempre): o polling
    // automático em agendarPull() já resolve isso sozinho, mas só continua
    // rodando enquanto a MESMA aba/sessão ficar aberta. Se a pessoa
    // recarregar a página ou voltar depois com algum arquivo/pasta ainda
    // pendente no cache local (por causa de um timeout anterior, mesmo que
    // o servidor já tenha terminado o envio de verdade), ninguém religava
    // esse polling — o status ficava parado ali, mesmo com o arquivo já
    // salvo no Drive. Agora, toda vez que o app inicia, verifica se sobrou
    // pendência do cache local e, se houver, já retoma o polling sozinho.
    if(u && (existeUploadPendente_() || existeMovePendente_())) agendarPull(true);
  }).catch(() => {
    const u = currentUser();
    if(!u){ mostrarLogin(); } else if(!$('#app').classList.contains('hidden')) renderApp();
  });
}
/* ITEM 7: ao abrir o app, se for administrador, verifica no Drive se há
   subpastas/arquivos dentro de "SGD_Arquivos" que não constam cadastrados na
   planilha (por exemplo, algo adicionado direto pelo Google Drive) e oferece
   para importar. Só roda para admin e só uma vez por sessão carregada. */
let pendentesJaChecados = false;
function verificarPendentesDrive(){
  const u = currentUser();
  if(!u || !podeSincronizarDrive_(u) || !Sync.url() || pendentesJaChecados) return;
  pendentesJaChecados = true;
  Sync.escanearPendentes().then(res => {
    if(!res || res.ok === false) return;
    const pastas = res.pastas || [], arquivos = res.arquivos || [];
    if(!pastas.length && !arquivos.length) return;
    modalPendentesDrive(pastas, arquivos);
  }).catch(()=>{});
}

/* ITEM 4: sincronização manual (botão em Configurações, só admin) — pede ao
   backend quais pastas/arquivos cadastrados no app já não existem mais no
   Drive (apagados direto por lá) e oferece remover essas entradas órfãs do
   app, pra ele ficar sempre igual ao Drive. */
// ITEM (unificar os dois botões de sincronização com o Drive): antes
// eram duas ações separadas — "Sincronizar pastas do Drive" (importa para
// a planilha o que já existe fisicamente no Drive mas ainda não está
// cadastrado) e "Sincronizar com o Drive" (avisa sobre o que está
// cadastrado na planilha mas não existe mais no Drive, para remover).
// São as duas metades de uma reconciliação completa — agora rodam em
// sequência, num único botão: primeiro importa o que falta, depois
// verifica o que sobrou.
function sincronizacaoCompletaDrive_(pastaId){
  const u = currentUser();
  if(!u || !podeSincronizarDrive_(u) || !Sync.url()){ toast('Configure a URL do backend primeiro.','error'); return Promise.resolve(); }
  const escopo = pastaId || null;
  const pastaEscopo = escopo ? pastaPorId(escopo) : null;
  toast(pastaEscopo ? ('Sincronizando "' + pastaEscopo.nome + '" com o Drive…') : 'Sincronizando com o Drive…', 'info');
  Sync.ensureDriveRoot();
  return Sync.repararDrive(escopo).then(res => {
    if(!res || res.ok === false){
      toast((res&&res.erro)||'Não foi possível sincronizar as pastas do Google Drive.','error');
      return;
    }
    return Sync.pull().then(data => {
      if(!data || data.ok===false || data.authOk!==true || !Sync.applyData(data)){
        toast('Itens encontrados no Drive, mas não foi possível recarregar a planilha.','error');
        return;
      }
      renderApp();
      // A checagem de "itens pendentes" (modal de importação no primeiro
      // carregamento) continua sendo só do sistema inteiro — quando a
      // sincronização já foi escopada a uma pasta, repararDrive() acima já
      // cuidou de importar o que faltava especificamente ali.
      if(!escopo){
        pendentesJaChecados = false;
        verificarPendentesDrive();
      }
      // CORREÇÃO (V48): para árvores grandes de pastas no Drive, o servidor
      // pode devolver "completo:false" — processou um trecho da árvore
      // dentro do tempo disponível e parou de propósito (em vez de estourar
      // o tempo e travar o servidor). Nesse caso pede para clicar de novo
      // e continuar de onde parou, antes de checar o sentido oposto
      // (itens removidos do Drive) — não faz sentido avisar sobre "itens
      // removidos" enquanto a importação ainda está incompleta.
      if(res.completo === false){
        toast('Parte das pastas/arquivos do Drive foi sincronizada. Clique em "Atualizar" novamente para continuar (área grande, processada em etapas).','info');
        return;
      }
      // Importação concluída — agora verifica o sentido oposto: itens que
      // estão na planilha mas não existem mais no Drive (também escopado à
      // mesma pasta, quando informado).
      return Sync.verificarOrfaos(escopo).then(res2 => {
        if(!res2 || res2.ok === false){ toast('Itens do Drive importados. Não foi possível verificar itens removidos do Drive agora.','error'); return; }
        const pastas = res2.pastas || [], arquivos = res2.arquivos || [];
        if(!pastas.length && !arquivos.length){
          toast('Tudo certo — o app já está igual ao Drive.');
        } else {
          modalOrfaosDrive(pastas, arquivos);
        }
      });
    });
  }).catch(() => toast('Não foi possível sincronizar com o Google Drive.','error'));
}

      pastas.map(p => '<div style="padding:3px 0"><i class="fa-solid fa-folder" style="color:var(--muted)"></i> ' + esc(p.nome) + '</div>').join('') +
      arquivos.map(a => '<div style="padding:3px 0"><i class="fa-solid fa-file" style="color:var(--muted)"></i> ' + esc(a.titulo) + '</div>').join('') +
    '</div>' +

}
function verificarVersao(){
  toast('Verificando versão do backend…','info');
  return Sync.pull().then(data => {
    const v = Number(data && data.__v || 0);
    if(v >= APP_VERSAO){
      backendAntigo = false;
      fecharModal();
      // ITEM 17 (mesma causa já corrigida antes, em sincronizarInicial —
      // ver comentário "CORREÇÃO (V48)" mais abaixo — mas que continuava
      // acontecendo aqui): clicar em "Verificar versão" disparava
      // Sync.pushAll(), reenviando as 5 planilhas inteiras de uma vez
      // (Usuarios/Pastas/Documentos/Empresa/Permissoes), todas disputando
      // o mesmo bloqueio (lock) do servidor ao mesmo tempo — gerando
      // exatamente o aviso "Não foi possível confirmar a sincronização"
      // mesmo sem nenhuma mudança pendente de verdade para sincronizar.
      // Verificar a versão não precisa forçar um reenvio geral; só garante
      // que a pasta raiz do Drive existe.
      toast('Backend atualizado (v' + v + ').');
      Sync.ensureDriveRoot();
      return true;
    }
    modalBackendAntigo();
    return false;
  }).catch(() => { toast('Falha ao conectar no Apps Script. Verifique a URL.','error'); return false; });
}

/* ============ helpers de arquivo ============ */
function b64ToBytes(b64){ const bin = atob(b64); const b = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i); return b; }
function dataURLtoBlobUrl(dataurl){
  const bytes = b64ToBytes(String(dataurl).split(',')[1]);
  const mime = (String(dataurl).match(/data:(.*?);/) || [,'application/octet-stream'])[1];
  return URL.createObjectURL(new Blob([bytes], {type:mime}));
}
function dataURLTexto(dataurl){
  const bin = atob(String(dataurl).split(',')[1]);
  try{ return decodeURIComponent(escape(bin)); }catch(e){ return bin; }
}
function blobToDataURL(blob){
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result)); r.onerror = rej; r.readAsDataURL(blob); });
}
function obterBuffer(d){
  if(d.arquivo) return Promise.resolve(b64ToBytes(d.arquivo.split(',')[1]).buffer);
  // ITEM 2 (visualização do documento): antes buscava os bytes direto do
  // navegador em drive.google.com/uc?export=download — como os arquivos são
  // salvos como PRIVATE/NONE no Drive, essa chamada falha quase sempre por
  // CORS/permissão, e o app caía no iframe de fallback (.../preview), que é
  // a tela "permita que o Google acesse os cookies necessários" (bloqueio de
  // cookies de terceiros do navegador). Agora os bytes vêm pelo próprio
  // Apps Script (apiObterConteudoDocumento), que já tem acesso ao arquivo
  // mesmo sendo privado — sem depender de fetch direto ao Drive nem de
  // cookies de terceiros no caminho normal de visualização.
  if(d.driveId){
    if(!(session && session.token)) return Promise.reject(new Error('sessão expirada'));
    return gasCall_('apiObterConteudoDocumento', [session.token, d.id]).then(res => {
      if(!res || !res.ok || !res.base64) throw new Error((res && res.erro) || 'não foi possível obter o arquivo');
      return b64ToBytes(res.base64).buffer;
    });
  }
  return Promise.reject(new Error('sem arquivo'));
}
function salvarArquivoBin(d, dataUrl, titulo){
  const docs = DB.get('Documentos');
  const tamanho = Math.round(dataUrl.length * 0.75);
  const atualizado = Object.assign({}, d, {titulo: titulo || d.titulo, arquivo: dataUrl, tamanho: tamanho, atualizadoEm: Date.now(), erroUpload: ''});
  DB.set('Documentos', docs.map(x => x.id === d.id ? atualizado : x));
  if(Sync.url()) enviarArquivoAoDrive_(atualizado);
  return true;
}
function fileToJpegDataUrl(file, maxDim, quality){
  maxDim = maxDim || 1600; quality = quality || 0.82;
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        const sc = Math.min(1, maxDim / Math.max(w, h));
        w = Math.round(w * sc); h = Math.round(h * sc);
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        res(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = rej;
      img.src = String(r.result);
    };
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}
function paginasParaPDF(pages){
  if(!window.jspdf || !window.jspdf.jsPDF){
    throw new Error('Biblioteca de geração de PDF (jsPDF) não carregou no navegador. Verifique sua conexão com a internet, desative bloqueadores de script/anúncio para este site e recarregue a página.');
  }
  const jsPDF = window.jspdf.jsPDF;
  const pdf = new jsPDF({unit:'mm', format:'a4'});
  pages.forEach((p, i) => {
    if(i > 0) pdf.addPage();
    const props = pdf.getImageProperties(p);
    const pageW = 210, pageH = 297, margin = 8;
    const ratio = Math.min((pageW - 2*margin) / props.width, (pageH - 2*margin) / props.height);
    const w = props.width * ratio, h = props.height * ratio;
    pdf.addImage(p, 'JPEG', (pageW - w) / 2, (pageH - h) / 2, w, h);
  });
  return pdf.output('datauristring');
}
/* ===== pré-visualização DOCX / XLSX ===== */
function renderDocx(buf, cont){
  if(!window.mammoth) throw new Error('mammoth indisponível');
  return window.mammoth.convertToHtml({arrayBuffer: buf}).then(res => {
    cont.classList.add('docx-view');
    cont.innerHTML = (res.value && res.value.trim()) ? sanitizarHtmlGerado_(res.value) : '<p>(documento vazio)</p>';
  });
}
function renderXlsx(buf, cont){
  if(!window.XLSX) throw new Error('xlsx indisponível');
  const wb = window.XLSX.read(new Uint8Array(buf), {type:'array'});
  let html = '';
  wb.SheetNames.forEach(name => {
    const ws = wb.Sheets[name];
    const rows = window.XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
    if(!rows.length) return;
    html += '<h4 class="sheet-title"><i class="fa-solid fa-table-cells" style="color:var(--primary);margin-right:6px"></i>' + esc(name) + '</h4>' +
      '<div class="table-x"><table class="sheet-table"><tbody>' +
      rows.slice(0, 2000).map((r, i) => '<tr>' + r.map(c => (i === 0 ? '<th>' : '<td>') + esc(String(c)) + (i === 0 ? '</th>' : '</td>')).join('') + '</tr>').join('') +
      '</tbody></table></div>';
  });
  cont.classList.add('sheet-view');
  cont.innerHTML = html || '<p>(planilha vazia)</p>';
}
function baixarArquivo(d){
  const ext = d.ext || (d.tipo === 'texto' ? 'txt' : 'bin');
  const nome = (d.titulo || 'documento') + '.' + ext;
  if(d.arquivo){
    const url = dataURLtoBlobUrl(d.arquivo);
    const a = document.createElement('a'); a.href = url; a.download = nome;
    document.body.appendChild(a); a.click(); a.remove();

/* ===== CÂMERA ===== */
let camPages = [];
/* ===== DETECÇÃO DE BORDAS + RECORTE DE PERSPECTIVA (tipo scanner) =====
   Estado da etapa de ajuste de bordas: uma imagem por vez (ajusteImg),
   os 4 cantos escolhidos em coordenadas RELATIVAS 0–1 da imagem
   (ajusteCantos = {tl,tr,br,bl}), e uma fila de arquivos ainda não
   processados (ajusteFila) para o caso de seleção múltipla pela galeria
   — cada imagem passa pela tela de ajuste, uma de cada vez. */
let ajusteImg = null;
let ajusteCantos = null;
let ajusteFila = [];
function distanciaPontos_(a, b){ return Math.hypot(a.x - b.x, a.y - b.y); }
// Detecção automática (melhor esforço) das bordas do documento: reduz a
// imagem, converte para escala de cinza, calcula a intensidade de borda
// por linha/coluna (gradiente simples) e acha onde a borda do documento
// provavelmente termina, varrendo de cada lado para o centro. Não é uma
// detecção de contorno completa (como visão computacional de verdade
// faria), mas dá um ponto de partida razoável na maioria das fotos — o
// usuário sempre pode arrastar os cantos para corrigir depois.
function detectarBordasIniciais_(img){
  try{
    const maxDim = 400;
    const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
    if(!iw || !ih) return null;
    const scale = Math.min(1, maxDim / Math.max(iw, ih));
    const w = Math.max(1, Math.round(iw * scale)), h = Math.max(1, Math.round(ih * scale));
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);
    const data = ctx.getImageData(0, 0, w, h).data;
    const gray = new Float32Array(w * h);
    for(let i = 0; i < w * h; i++){
      gray[i] = 0.299*data[i*4] + 0.587*data[i*4+1] + 0.114*data[i*4+2];
    }
    const colEdge = new Float32Array(w), rowEdge = new Float32Array(h);
    for(let y = 1; y < h-1; y++){
      for(let x = 1; x < w-1; x++){
        const idx = y*w+x;
        colEdge[x] += Math.abs(gray[idx+1] - gray[idx-1]);
        rowEdge[y] += Math.abs(gray[idx+w] - gray[idx-w]);
      }
    }
    function acharLimite_(arr, doInicioParaFim){
      const n = arr.length;
      let max = 0;
      for(let i = 0; i < n; i++) if(arr[i] > max) max = arr[i];
      if(max <= 0) return doInicioParaFim ? Math.round(n*0.04) : Math.round(n*0.96);
      const limiar = max * 0.15;
      if(doInicioParaFim){
        for(let i = 0; i < n; i++) if(arr[i] >= limiar) return Math.max(0, i - Math.round(n*0.01));
        return Math.round(n*0.04);
      }
      for(let i = n-1; i >= 0; i--) if(arr[i] >= limiar) return Math.min(n-1, i + Math.round(n*0.01));
      return Math.round(n*0.96);
    }
    let l = acharLimite_(colEdge, true) / w, r = acharLimite_(colEdge, false) / w;
    let t = acharLimite_(rowEdge, true) / h, b = acharLimite_(rowEdge, false) / h;
    if(r < l){ const tmp = l; l = r; r = tmp; }
    if(b < t){ const tmp = t; t = b; b = tmp; }
    // Margem de segurança: se a detecção deu uma área minúscula ou quase
    // a imagem inteira sem sobra nenhuma, usa uma margem padrão em vez de
    // confiar num resultado pouco útil.
    if((r - l) < 0.25 || (b - t) < 0.25){ l = 0.04; r = 0.96; t = 0.04; b = 0.96; }
    return { tl:{x:l,y:t}, tr:{x:r,y:t}, br:{x:r,y:b}, bl:{x:l,y:b} };
  }catch(e){ return null; }
}
// Resolve a homografia (transformação projetiva 3x3) que mapeia os 4
// pontos de origem para os 4 pontos de destino, via eliminação
// gaussiana de um sistema linear 8x8 — é a mesma matemática por trás do
// "four point transform" usado em apps de scanner.
function resolverHomografia_(origem, destino){
  const A = [], B = [];
  for(let i = 0; i < 4; i++){
    const sx = origem[i].x, sy = origem[i].y, dx = destino[i].x, dy = destino[i].y;
    A.push([sx, sy, 1, 0, 0, 0, -sx*dx, -sy*dx]); B.push(dx);
    A.push([0, 0, 0, sx, sy, 1, -sx*dy, -sy*dy]); B.push(dy);
  }
  const n = 8;
  for(let i = 0; i < n; i++){
    let maxRow = i;
    for(let k = i+1; k < n; k++) if(Math.abs(A[k][i]) > Math.abs(A[maxRow][i])) maxRow = k;
    const tmpA = A[i]; A[i] = A[maxRow]; A[maxRow] = tmpA;
    const tmpB = B[i]; B[i] = B[maxRow]; B[maxRow] = tmpB;
    if(Math.abs(A[i][i]) < 1e-12) continue;
    for(let k = i+1; k < n; k++){
      const f = A[k][i] / A[i][i];
      for(let j = i; j < n; j++) A[k][j] -= f * A[i][j];
      B[k] -= f * B[i];
    }
  }
  const hVec = new Array(n).fill(0);
  for(let i = n-1; i >= 0; i--){
    let s = B[i];
    for(let j = i+1; j < n; j++) s -= A[i][j] * hVec[j];
    hVec[i] = Math.abs(A[i][i]) < 1e-12 ? 0 : s / A[i][i];
  }
  return hVec; // [a,b,c,d,e,f,g,h] da matriz 3x3 (m22 = 1)
}
// Aplica o recorte de perspectiva: para cada pixel do retângulo de
// SAÍDA, calcula de onde ele vem na imagem ORIGEM (usando a homografia
// destino->origem, que evita ter que inverter matriz) e copia a cor —
// resultado é o documento "esticado" para um retângulo reto, como um
// scanner de verdade faz com uma foto em ângulo.
function aplicarTransformacaoPerspectiva_(img, cantosPixel, larguraSaida, alturaSaida){
  const destinoRetangulo = [
    {x:0, y:0}, {x:larguraSaida, y:0}, {x:larguraSaida, y:alturaSaida}, {x:0, y:alturaSaida}
  ];
  const origemCantos = [cantosPixel.tl, cantosPixel.tr, cantosPixel.br, cantosPixel.bl];
  const m = resolverHomografia_(destinoRetangulo, origemCantos);
  const cOrig = document.createElement('canvas');
  cOrig.width = img.naturalWidth; cOrig.height = img.naturalHeight;
  cOrig.getContext('2d').drawImage(img, 0, 0);
  const dadosOrig = cOrig.getContext('2d').getImageData(0, 0, cOrig.width, cOrig.height).data;
  const sw = cOrig.width, sh = cOrig.height;
  const cSaida = document.createElement('canvas');
  cSaida.width = larguraSaida; cSaida.height = alturaSaida;
  const ctxSaida = cSaida.getContext('2d');
  const dadosSaida = ctxSaida.createImageData(larguraSaida, alturaSaida);
  for(let y = 0; y < alturaSaida; y++){
    for(let x = 0; x < larguraSaida; x++){
      const den = m[6]*x + m[7]*y + 1;
      const sx = (m[0]*x + m[1]*y + m[2]) / den;
      const sy = (m[3]*x + m[4]*y + m[5]) / den;
      const ix = Math.round(sx), iy = Math.round(sy);
      const outIdx = (y*larguraSaida + x) * 4;
      if(ix >= 0 && ix < sw && iy >= 0 && iy < sh){
        const inIdx = (iy*sw + ix) * 4;
        dadosSaida.data[outIdx] = dadosOrig[inIdx];
        dadosSaida.data[outIdx+1] = dadosOrig[inIdx+1];
        dadosSaida.data[outIdx+2] = dadosOrig[inIdx+2];
        dadosSaida.data[outIdx+3] = 255;
      }else{
        dadosSaida.data[outIdx] = 255; dadosSaida.data[outIdx+1] = 255; dadosSaida.data[outIdx+2] = 255; dadosSaida.data[outIdx+3] = 255;
      }
    }
  }
  ctxSaida.putImageData(dadosSaida, 0, 0);
  return cSaida;
}
// Mesmo limite usado no upload normal (MAX_UPLOAD_BYTES no Code.gs) —
// evita montar um PDF/lote de imagens que o servidor vai rejeitar de
// qualquer forma depois de todo o trabalho de captura já feito. O limite
// de páginas é só uma segurança extra contra digitalizações enormes por
// engano (ex.: capturar dezenas de páginas sem perceber).
const CAM_MAX_BYTES = 25 * 1024 * 1024;
const CAM_MAX_PAGINAS = 40;
function camTamanhoBytes_(){ return camPages.reduce((soma, p) => soma + Math.round(p.length * 0.75), 0); }
function camTamanhoFmt_(bytes){ return bytes >= 1024*1024 ? (bytes/(1024*1024)).toFixed(1)+' MB' : Math.max(1,Math.round(bytes/1024))+' KB'; }
// Adiciona uma página já processada (depois do ajuste de bordas, ou a
// imagem inteira quando o usuário optar por pular o recorte) à lista de
// páginas do scanner, respeitando os mesmos limites de quantidade/tamanho
// que já existiam antes (CAM_MAX_PAGINAS / CAM_MAX_BYTES).
function adicionarPaginaProcessada_(dataUrl){
  if(!dataUrl) return false;
  if(camPages.length >= CAM_MAX_PAGINAS){
    toast('Limite de ' + CAM_MAX_PAGINAS + ' páginas por digitalização atingido — esta página não foi adicionada.', 'error');
    return false;
  }
  const bytesPagina = Math.round(dataUrl.length * 0.75);
  if(camTamanhoBytes_() + bytesPagina > CAM_MAX_BYTES){
    toast('Esta página passaria do limite de ~' + camTamanhoFmt_(CAM_MAX_BYTES) + ' por digitalização — não foi adicionada.', 'error');
    return false;
  }
  camPages.push(dataUrl);
  return true;
}
// Abre a tela de ajuste de bordas para UM arquivo de imagem — detecta um
// retângulo inicial automaticamente e deixa o usuário arrastar os 4
// cantos para corrigir, igual ao scanner do Google Drive.
function abrirAjusteBordas_(file){
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    try{ URL.revokeObjectURL(url); }catch(e){}
    ajusteImg = img;
    ajusteCantos = detectarBordasIniciais_(img) || {tl:{x:0.04,y:0.04}, tr:{x:0.96,y:0.04}, br:{x:0.96,y:0.96}, bl:{x:0.04,y:0.96}};
    openModal(htmlModalAjusteBordas_(img.src), 'modal-ajuste-bordas');
    atualizarHandlesEPoligono_();
    ativarArrastarHandles_();
  };
  img.onerror = () => {
    try{ URL.revokeObjectURL(url); }catch(e){}
    toast('Não foi possível carregar uma das imagens selecionadas.', 'error');
    processarProximoAjuste_();
  };
  img.src = url;
}
function htmlModalAjusteBordas_(imgSrc){
  const restantes = ajusteFila.length;
  return '<h3><i class="fa-solid fa-crop"></i> Ajustar bordas do documento</h3>' +
    '<p class="modal-sub">Arraste os 4 cantos para marcar exatamente as bordas do documento' + (restantes ? ' (' + restantes + ' imagem(ns) restante(s) depois desta)' : '') + '.</p>' +
    '<div class="ajuste-bordas-wrap" id="ajusteBordasWrap">' +
      '<img id="ajusteBordasImg" src="' + imgSrc + '" draggable="false" alt="">' +
      '<svg id="ajusteBordasSvg" class="ajuste-bordas-svg" viewBox="0 0 100 100" preserveAspectRatio="none">' +
        '<polygon id="ajustePoligono" class="ajuste-poligono"></polygon>' +
        '<circle class="ajuste-handle" data-canto="tl" r="4"></circle>' +
        '<circle class="ajuste-handle" data-canto="tr" r="4"></circle>' +
        '<circle class="ajuste-handle" data-canto="br" r="4"></circle>' +
        '<circle class="ajuste-handle" data-canto="bl" r="4"></circle>' +
      '</svg>' +
    '</div>' +

function atualizarHandlesEPoligono_(){
  const svg = document.getElementById('ajusteBordasSvg');
  if(!svg || !ajusteCantos) return;
  const ordem = ['tl','tr','br','bl'];
  ordem.forEach(k => {
    const c = ajusteCantos[k];
    const el = svg.querySelector('.ajuste-handle[data-canto="' + k + '"]');
    if(el){ el.setAttribute('cx', c.x*100); el.setAttribute('cy', c.y*100); }
  });
  const poligono = svg.querySelector('#ajustePoligono');
  if(poligono) poligono.setAttribute('points', ordem.map(k => (ajusteCantos[k].x*100) + ',' + (ajusteCantos[k].y*100)).join(' '));
}
// Arrastar os cantos funciona por Pointer Events (unifica mouse e toque
// — essencial já que este recurso é usado principalmente no celular).
// As coordenadas são convertidas direto para percentual da área visível
// da imagem (0–1), então funcionam independente do tamanho real de tela.
function ativarArrastarHandles_(){
  const svg = document.getElementById('ajusteBordasSvg');
  const wrap = document.getElementById('ajusteBordasWrap');
  if(!svg || !wrap) return;
  let cantoArrastando = null;
  function posParaRelativo_(clientX, clientY){
    const rect = wrap.getBoundingClientRect();
    let x = rect.width ? (clientX - rect.left) / rect.width : 0;
    let y = rect.height ? (clientY - rect.top) / rect.height : 0;
    return { x: Math.min(1, Math.max(0, x)), y: Math.min(1, Math.max(0, y)) };
  }
  svg.querySelectorAll('.ajuste-handle').forEach(handle => {
    handle.addEventListener('pointerdown', e => {
      e.preventDefault();
      cantoArrastando = handle.dataset.canto;
      try{ handle.setPointerCapture(e.pointerId); }catch(err){}
    });
  });
  svg.addEventListener('pointermove', e => {
    if(!cantoArrastando || !ajusteCantos) return;
    e.preventDefault();
    ajusteCantos[cantoArrastando] = posParaRelativo_(e.clientX, e.clientY);
    atualizarHandlesEPoligono_();
  });
  const soltar = () => { cantoArrastando = null; };
  svg.addEventListener('pointerup', soltar);
  svg.addEventListener('pointercancel', soltar);
  svg.addEventListener('pointerleave', soltar);
}
// Finaliza a página atual da fila: aplica o recorte de perspectiva (ou
// usa a imagem inteira, se cantosRelativos for null) e segue para a
// próxima imagem pendente, se houver.
function finalizarAjusteAtual_(cantosRelativos, descartar){
  const img = ajusteImg;
  ajusteImg = null; ajusteCantos = null;
  if(img && !descartar){
    let dataUrl = null;
    try{
      if(cantosRelativos){
        const iw = img.naturalWidth, ih = img.naturalHeight;
        const cantosPixel = {
          tl: {x: cantosRelativos.tl.x*iw, y: cantosRelativos.tl.y*ih},
          tr: {x: cantosRelativos.tr.x*iw, y: cantosRelativos.tr.y*ih},
          br: {x: cantosRelativos.br.x*iw, y: cantosRelativos.br.y*ih},
          bl: {x: cantosRelativos.bl.x*iw, y: cantosRelativos.bl.y*ih}
        };
        const larguraTopo = distanciaPontos_(cantosPixel.tl, cantosPixel.tr);
        const larguraBase = distanciaPontos_(cantosPixel.bl, cantosPixel.br);
        const alturaEsq = distanciaPontos_(cantosPixel.tl, cantosPixel.bl);
        const alturaDir = distanciaPontos_(cantosPixel.tr, cantosPixel.br);
        let larguraSaida = Math.round(Math.max(larguraTopo, larguraBase));
        let alturaSaida = Math.round(Math.max(alturaEsq, alturaDir));
        const maxLado = 1600;
        const escalaTeto = Math.min(1, maxLado / Math.max(larguraSaida, alturaSaida, 1));
        larguraSaida = Math.max(50, Math.round(larguraSaida*escalaTeto));
        alturaSaida = Math.max(50, Math.round(alturaSaida*escalaTeto));
        const canvasResultado = aplicarTransformacaoPerspectiva_(img, cantosPixel, larguraSaida, alturaSaida);
        dataUrl = canvasResultado.toDataURL('image/jpeg', 0.85);
      }else{
        const maxDim = 1600;
        const sc = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.round(img.naturalWidth*sc), h = Math.round(img.naturalHeight*sc);
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        dataUrl = c.toDataURL('image/jpeg', 0.85);
      }
    }catch(e){
      toast('Não foi possível processar esta página: ' + (e && e.message || e), 'error');
      dataUrl = null;
    }
    if(dataUrl) adicionarPaginaProcessada_(dataUrl);
  }
  processarProximoAjuste_();
}
// Segue para a próxima imagem da fila (seleção múltipla da galeria) ou,

/* ITEM 15: reenvia um documento que ficou com "erroUpload".
   CORREÇÃO: "erroUpload" agora também pode vir de uma FALHA AO MOVER um
   arquivo já existente no Drive (ver processarDoc_ em Code.gs — antes essa
   falha era engolida em silêncio; agora é registrada aqui). Nesse caso o
   documento já tem driveId e NÃO tem mais o base64 original guardado
   localmente (foi limpo assim que o upload original teve sucesso) — reenviar
   deve pedir para o servidor tentar mover de novo, não reenviar conteúdo.
   Só quando o documento nunca chegou a ter driveId (upload original que
   falhou) é que usamos a cópia local do arquivo para reenviar o conteúdo. */

async function reenviarUpload(docId){
  const d = DB.get('Documentos').find(x => x.id === docId);
  if(!d){ return; }
  if(d.driveId){
    DB.set('Documentos', DB.get('Documentos').map(x => x.id === docId ? Object.assign({}, x, {movePending: true, erroUpload: ''}) : x));
    toast('Tentando mover "' + d.titulo + '" no Drive de novo…');
    renderItens();
    return;
  }
  if(!d.arquivo){
    toast('O conteúdo original não está mais disponível neste navegador. Exclua este item e envie o arquivo de novo.', 'error');
    return;
  }
  DB.set('Documentos', DB.get('Documentos').map(x => x.id === docId ? Object.assign({}, x, {erroUpload:''}) : x));
  toast('Reenviando "' + d.titulo + '" para o Drive…');
  renderItens();
  const res = await enviarArquivoAoDrive_(d);
  // Aplica o driveId/driveUrl já retornados pelo servidor direto no cache
  // local, assim que o envio termina de verdade — sem isso, o total de
  // arquivos e a lista só refletiam o reenvio depois que uma sincronização
  // em segundo plano confirmasse (podendo levar alguns segundos).
  if(res && res.ok && res.res && res.res.driveId){
    DB.set('Documentos', DB.get('Documentos').map(x => x.id === docId ? Object.assign({}, x, {driveId: res.res.driveId, driveUrl: res.res.driveUrl || '', arquivo:'', erroUpload:''}) : x));
  } else if(res && res.ok === false){
    DB.set('Documentos', DB.get('Documentos').map(x => x.id === docId ? Object.assign({}, x, {erroUpload: String(res.erro||'falha ao reenviar')}) : x));
    toast('Falha ao reenviar "' + d.titulo + '": ' + (res.erro || 'motivo desconhecido'), 'error');
  }
  renderItens();
}

/* ITEM 13/14/26: envia o conteúdo do arquivo pro Drive pelo endpoint
   dedicado, fora da planilha (POST em iframe, sem depender de CORS).
   Não fica mais na mesma fila serial do push de metadados
   (filaPush_['Documentos']) — sai direto, permitindo vários arquivos
   subirem o conteúdo ao mesmo tempo (ver ITEM 26/27 acima) — e já dispara
   um pull assim que o servidor confirmar. */
function enviarArquivoAoDrive_(doc){
  const u = currentUser();
  if(!u) return Promise.resolve({ok:false});
  return Sync.uploadArquivo({
    userId: u.id,
    docId: doc.id,
    pastaId: doc.pastaId,
    titulo: doc.titulo,
    ext: doc.ext,
    mime: doc.mime,
    criadoEm: doc.criadoEm,
    arquivo: doc.arquivo
  });
}


async function salvarDocArquivo(base, dataUrl){
  const tamanho = Math.round(dataUrl.length * 0.75);
  const docs = DB.get('Documentos');
  const doc = Object.assign({}, base, {arquivo: dataUrl, tamanho});
  docs.push(doc);
  const pPush = DB.set('Documentos', docs);
  // ITEM 20 (continuação): devolve uma Promise que só se resolve depois
  // que TANTO o push de metadados QUANTO o envio do conteúdo ao Drive
  // terminarem (sucesso ou falha) — antes esta função retornava `true`
  // na hora, sem esperar nada de verdade acontecer no servidor. Isso é o
  // que permite ao lote de upload esperar um arquivo terminar antes de
  // começar o próximo, em vez de disparar tudo de uma vez.
  const pUpload = Sync.url() ? Promise.resolve(pPush).then(() => enviarArquivoAoDrive_(doc)) : Promise.resolve({ok:true});
  const res = await pUpload;
  let ok = (res && res.ok) !== false;
  // ITEM (falso negativo em conexão de celular lenta/instável): se o
  // cliente desistiu por timeout (ver postApi_) mas o servidor pode ter
  // terminado o envio um pouco depois, confirma diretamente com o
  // servidor antes de desistir de vez — mesmo mecanismo de segurança já
  // usado no upload em lote (handleUploadComTimeout_), agora reaproveitado
  // aqui para cobrir também a digitalização por câmera e a galeria.
  if(!ok && Sync.url()) ok = await verificarUploadConfirmadoNoServidor_(doc.id);
  // Aplica o driveId/driveUrl já retornados pelo servidor direto no
  // cache local assim que o upload termina de verdade — sem isso, o
  // total de arquivos e a lista só refletiam o envio depois que uma
  // sincronização em segundo plano confirmasse (podendo levar alguns
  // segundos após um lote/reenvio terminar).
  if(ok && res && res.res && res.res.driveId){
    DB.set('Documentos', DB.get('Documentos').map(x => x.id === doc.id ? Object.assign({}, x, {driveId: res.res.driveId, driveUrl: res.res.driveUrl || '', arquivo:'', erroUpload:''}) : x));
  }
  return ok;
}

/* ITEM: mover PASTA para dentro de outra pasta (não só arquivos). Não deixa
   escolher a própria pasta nem nenhuma subpasta dela como destino, senão
   criaria um laço (pasta dentro de si mesma). */
function descendentesDe_(pastaId){
  const proibidas = new Set([pastaId]);
  let mudou = true;
  while(mudou){
    mudou = false;
    DB.get('Pastas').forEach(x => {
      if(x.parentId && proibidas.has(x.parentId) && !proibidas.has(x.id)){ proibidas.add(x.id); mudou = true; }
    });
  }
  return proibidas;
}

    destinos.map(x => '<option value="' + x.id + '">' + esc(nomeCaminho(x)) + '</option>').join('');

function ownerIsAdmin(p){
  // CORREÇÃO (V48 - itens excluídos "voltando sozinhos"): usuários sem
  // privilégio de admin só recebem, na sincronização, o PRÓPRIO registro em
  // "Usuarios" (por segurança/privacidade — ver dadosParaUsuario_ no
  // servidor) — então getUsuarios() nunca encontra o dono de uma
  // pasta/documento criado por OUTRA pessoa, e o código antigo assumia
  // "sem informação = dono é admin" nesse caso. Isso fazia o cliente
  // liberar (e mostrar o botão de) ações como excluir/editar que o
  // SERVIDOR sempre rejeitava de verdade — pois o servidor tem a lista
  // completa de usuários e sabe que o dono real não é admin. O resultado:
  // a exclusão "funcionava" na tela, mas era desfeita na sincronização
  // seguinte (ou ao recarregar a página), dando a impressão de que o
  // arquivo "voltava sozinho". Agora usamos AdminIds — a lista de ids de
  // administradores, enviada pelo servidor a QUALQUER usuário, admin ou
  // não — em vez de tentar adivinhar a partir da lista (incompleta) de
  // usuários. Mantém o comportamento antigo como reserva apenas se
  // AdminIds ainda não tiver chegado (ex.: cache local de versão anterior).
  if(!p.criadaPor) return true;
  const admins = DB.get('AdminIds');
  if(Array.isArray(admins) && admins.length) return admins.includes(p.criadaPor);
  const o = getUsuarios().find(x => x.id === p.criadaPor);
  return !o || ehAdmin(o);
}
function permsGlobais(u){ return (u.perms && u.perms.length ? u.perms : PRESETS.visualizador).slice(); }
function getPermissoes(){ return DB.get('Permissoes').map(normPermRow); }
function getUsuarios(){ return DB.get('Usuarios').map(normUserRow); }
function permsEff(userId, pasta){
  const u = getUsuarios().find(x => x.id === userId);
  if(!u || !pasta) return [];
  if(ehAdmin(u)) return ALL_PERMS.slice();
  const global = permsGlobais(u);
  const permRows = getPermissoes();
  let cur = pasta, grant = null, blocked = false;
  while(cur){
    const e = permRows.find(p => p.pastaId === cur.id && p.userId === userId);
    if(e){ grant = e.perms || []; break; }
    // ITEM 2/3: antes, quem CRIOU a pasta ganhava acesso total (ALL_PERMS)
    // dentro dela automaticamente, mesmo sem permissão explícita concedida
    // pelo admin — isso ignorava as permissões globais reais do usuário
    // (ex.: um usuário com permissão só de Visualizar/Enviar/Criar pasta
    // conseguia Baixar/Imprimir/Mover/Editar/Excluir dentro das próprias
    // pastas). Agora ser dono da pasta só interrompe a herança de
    // permissões de pastas superiores — as permissões globais do usuário
    // continuam valendo normalmente, sem elevação automática.
    if(cur.criadaPor === userId) break;
    if(!ownerIsAdmin(cur)){ blocked = true; break; }
    cur = pastaPorId(cur.parentId);
  }
  if(blocked) return [];
  if(grant === 'ALL') return ALL_PERMS.slice();
  if(grant) return grant.filter(k => global.includes(k));
  return global.slice();
}
function permsAtuais(){
  const u = currentUser();
  if(ehAdmin(u)) return ALL_PERMS.slice();
  if(!state.currentFolderId) return permsGlobais(u);
  return permsEff(u.id, pastaPorId(state.currentFolderId));
}
function permsDoc(d){
  const u = currentUser();
  if(ehAdmin(u)) return ALL_PERMS.slice();
  const global = permsGlobais(u);
  // ITEM 2/3: antes, quem ENVIOU o arquivo ganhava acesso total a ele
  // automaticamente (mesma falha da pasta, acima) — removido pelo mesmo
  // motivo. As permissões do documento agora seguem sempre as permissões
  // globais do usuário e/ou as concedidas na pasta onde o arquivo está.
  if(!d.pastaId){
    return global.includes('visualizar') ? global : [];
  }
  return permsEff(u.id, pastaPorId(d.pastaId));
}
function trilha(){
  const chain = []; let cur = pastaPorId(state.currentFolderId);
  while(cur){ chain.unshift(cur); cur = pastaPorId(cur.parentId); }

}
// CORREÇÃO (V48 - lote de exclusão): antes, cada chamada recursiva desta
// função já gravava (DB.set) as três planilhas na hora, e quem chamava esta
// função também gravava a cada item do laço. Excluir N pastas/arquivos de
// uma vez gerava N (ou mais) pushes separados para o Apps Script — cada um
// disputando o LockService global do servidor e cada falha/timeout gerando
// seu próprio toast de erro (é isso que produzia a pilha de avisos "Não foi
// possível confirmar a sincronização..." repetida na tela). Agora a função
// só ACUMULA os ids a excluir num "acc" comum; quem chama grava tudo de uma
// vez, com no máximo 1 push por planilha para o lote inteiro.
function excluirPastaRec(id, acc){
  acc = acc || {pastas:new Set(), docs:new Set(), perms:new Set()};
  DB.get('Pastas').filter(p => p.parentId === id).forEach(f => excluirPastaRec(f.id, acc));
  const docsDaPasta = DB.get('Documentos').filter(d => d.pastaId === id).map(d => d.id);
  const permsDaPasta = DB.get('Permissoes').filter(p => p.pastaId === id).map(p => p.id);
  marcarExcluido_('Pastas', id);
  marcarExcluido_('Documentos', docsDaPasta);
  marcarExcluido_('Permissoes', permsDaPasta);
  acc.pastas.add(id);
  docsDaPasta.forEach(did => acc.docs.add(did));
  permsDaPasta.forEach(pid => acc.perms.add(pid));
  return acc;
}
// Aplica de uma só vez (1 push por planilha) o lote acumulado por
// excluirPastaRec/exclusão de arquivos avulsos.
function aplicarExclusaoEmLote_(acc){
  if(!acc) return;
  if(acc.pastas.size) DB.set('Pastas',      DB.get('Pastas').filter(p => !acc.pastas.has(p.id)));
  if(acc.docs.size)   DB.set('Documentos',  DB.get('Documentos').filter(d => !acc.docs.has(d.id)));
  if(acc.perms.size)  DB.set('Permissoes',  DB.get('Permissoes').filter(p => !acc.perms.has(p.id)));
}

/* ================= TOAST / MODAL ================= */
function toast(msg, tipo){
  tipo = tipo || 'success';
  const icons = {success:'fa-circle-check', error:'fa-triangle-exclamation', info:'fa-circle-info'};
  const t = document.createElement('div');
  t.className = 'toast ' + tipo;
  t.innerHTML = '<i class="fa-solid ' + icons[tipo] + '"></i><span>' + esc(msg) + '</span>';
  $('#toasts').appendChild(t);
  setTimeout(() => { t.classList.add('saindo'); setTimeout(() => t.remove(), 320); }, 4200);
}
// ITEM 10 (toasts empilhados ao subir vários arquivos): cada arquivo de um
// lote grande passa pela mesma fila de sincronização (filaPush_), e se essa
// fila ficar sobrecarregada (muitos arquivos de uma vez, cada um com seu
// próprio push de metadados + upload), mais de um pode acabar demorando
// além do tempo limite — o que é normal e já é tratado sozinho em segundo
// plano (agendarPull continua tentando convergir com o servidor). O
// problema era só de exibição: o aviso aparecia UMA VEZ PARA CADA arquivo
// que desse timeout, empilhando vários toasts idênticos e assustadores na
// tela. Agora esse aviso específico é limitado a aparecer no máximo uma
// vez a cada alguns segundos, não importa quantos arquivos do lote
// esbarrem nele ao mesmo tempo.
const toastUltimaVez_ = {};
function toastLimitado_(msg, tipo, chave, intervaloMs){
  const agora = Date.now();
  if(toastUltimaVez_[chave] && (agora - toastUltimaVez_[chave]) < intervaloMs) return;
  toastUltimaVez_[chave] = agora;
  toast(msg, tipo);
}

/* ITEM (visualizador de documento): calcula, em pixels, o espaço que sobra
   dentro do modal depois de descontar cabeçalho/metadados/descrição/botões,
   e aplica essa altura na área de pré-visualização — assim só ela rola,
   sem disputa com a barra de rolagem do modal inteiro. */
function ajustarAlturaDocViewer_(){
  const card = document.querySelector('.modal-card.modal-doc-view');
  const corpo = card && card.querySelector('.doc-viewer-corpo');
  if(!card || !corpo) return;
  const calc = () => {
    const estilo = getComputedStyle(card);
    const padV = parseFloat(estilo.paddingTop) + parseFloat(estilo.paddingBottom);
    const outros = Array.from(card.children).reduce((soma, el) => el === corpo ? soma : soma + el.offsetHeight, 0);
    // ITEM: antes usava card.scrollHeight como teto — só que, na primeira
    // medição, o próprio .doc-viewer-corpo ainda estava no tamanho mínimo
    // (240px), então scrollHeight vinha pequeno e o cálculo ficava "preso"
    // nesse valor pequeno pra sempre (nunca crescia de fato com a tela).
    // Agora o teto é só a altura máxima real do modal (92% da viewport).
    const tetoCard = window.innerHeight * 0.92;
    const disponivel = tetoCard - padV - outros - 14;
    corpo.style.height = Math.max(320, disponivel) + 'px';
  };
  calc();
  if(state._ajustarViewerResize) window.removeEventListener('resize', state._ajustarViewerResize);
  state._ajustarViewerResize = calc;
  window.addEventListener('resize', calc);
}

/* ================= MONITOR DE INATIVIDADE (ITEM 5) =================
   Antes não existia nenhum encerramento automático por inatividade no
   navegador — só o servidor derrubava a sessão (fixo em 30 min) na
   PRÓXIMA chamada à API, ou seja, um usuário que ficasse com a aba aberta
   e parada continuava vendo a tela do app normalmente até tentar fazer
   alguma ação. Agora o app conta o tempo sem atividade do usuário (mouse,
   teclado, toque, scroll) e, ao atingir o limite configurado em
   Configurações (mesmo valor usado pelo servidor), fecha a sessão sozinho
   e volta para a tela de login. */
let ultimaAtividade_ = Date.now();
let monitorInatividadeId_ = null;
// ITEM 24 (sessão expira no meio de um envio de vários arquivos): o envio
// em lote não gera nenhum evento de mouse/teclado, então o cronômetro de
// inatividade seguia contando normalmente durante um envio automático
// longo — se o tempo configurado se esgotasse no meio da fila, a sessão
// era encerrada e TODOS os arquivos restantes falhavam (sem sessão
// válida, nada consegue ser enviado). Este contador marca "isso é
// atividade de verdade, não deixe a sessão cair" enquanto qualquer envio
// em lote estiver rodando.
let uploadEmAndamento_ = 0;
function iniciarUploadEmAndamento_(){ uploadEmAndamento_++; registrarAtividade_(); }
function terminarUploadEmAndamento_(){ uploadEmAndamento_ = Math.max(0, uploadEmAndamento_ - 1); registrarAtividade_(); }
function registrarAtividade_(){ ultimaAtividade_ = Date.now(); }
// ITEM 3 (só entrar em inatividade após enviar o TOTAL de arquivos): além
// do contador uploadEmAndamento_ (que cobre a duração da chamada de lote
// como um todo), checamos também diretamente o progresso do lote atual
// (uploadLoteAtivo_) — enquanto nem todos os itens do lote chegaram a um
// estado final (enviado, com falha ou cancelado), o app é considerado
// "enviando" para fins de inatividade, mesmo que o painel tenha sido
// fechado com o X (ver fecharPainelLote_) ou que algum detalhe de
// contagem fique defasado por um instante.
function loteUploadEmAndamento_(){
  if(uploadEmAndamento_ > 0) return true;
  return !!(uploadLoteAtivo_ && uploadLoteAtivo_.concluidos < uploadLoteAtivo_.total);
}
function tempoInatividadeMsCliente_(){
  const min = Number((getEmpresa() || {}).tempoInatividadeMin);
  const clamped = isFinite(min) ? Math.min(INATIVIDADE_MAX_MIN, Math.max(INATIVIDADE_MIN_MIN, min)) : INATIVIDADE_PADRAO_MIN;
  return clamped * 60 * 1000;
}
/* ITEM 4 (inatividade fecha a aba em vez de voltar para o login): antes,
   ao encerrar por inatividade, o app limpava a sessão e voltava a mostrar
   a tela de login na mesma aba. Depois passamos a tentar fechar a própria
   aba de verdade (nem todo navegador permite — abas abertas só por
   navegação direta, sem window.open, costumam bloquear o fechamento por
   padrão).
   ITEM (voltar a mostrar login, mas com um refresh antes): a pedido,
   quando o fechamento automático não funciona, em vez de deixar a página
   em branco sem nenhuma mensagem, agora fazemos um location.reload()
   antes de mostrar o login — a sessão já foi limpa acima, então a página
   recarregada do zero cai naturalmente na tela de login, com todo o
   estado da aba (memória, variáveis, timers) reiniciado do zero em vez de
   reaproveitar o que sobrou da sessão anterior. */
function encerrarPorInatividade_(){
  if(!session) return;
  if(session.token) gasCall_('apiLogout', [session.token]).catch(() => {});
  limparSessao_();
  pararMonitorInatividade_();
  clearTimeout(pullTimer);
  limparSelecao();
  try{ fecharModal(); }catch(e){}
  if(currentBlobUrl){ const u = currentBlobUrl; currentBlobUrl = null; try{ URL.revokeObjectURL(u); }catch(e){} }
  document.querySelectorAll('iframe[aria-hidden="true"]').forEach(f => { try{ f.remove(); }catch(e){} });
  esconderProgressoLote_();
  $('#app').classList.add('hidden');
  $('#loginScreen').classList.add('hidden');
  try{ window.open('', '_self'); }catch(e){}
  try{ window.close(); }catch(e){}
  try{ if(window.top && window.top !== window) window.top.close(); }catch(e){}
  setTimeout(() => {
    try{ window.close(); }catch(e){}
    // A aba continua aberta apesar das tentativas acima — a sessão já
    // está limpa (ver limparSessao_ no início da função), então um
    // refresh completo aqui já cai direto na tela de login, com a aba
    // inteira reiniciada do zero.
    try{ location.reload(); }catch(e){}
  }, 250);
}
function iniciarMonitorInatividade_(){
  registrarAtividade_();
  if(monitorInatividadeId_) return;
  ['mousemove','mousedown','keydown','touchstart','scroll','click'].forEach(ev => {
    document.addEventListener(ev, registrarAtividade_, {passive:true});
  });
  monitorInatividadeId_ = setInterval(() => {
    if(!session){ pararMonitorInatividade_(); return; }
    if(loteUploadEmAndamento_()){ registrarAtividade_(); return; }
    if(Date.now() - ultimaAtividade_ > tempoInatividadeMsCliente_()) encerrarPorInatividade_();
  }, 15000);
}
function pararMonitorInatividade_(){
  if(monitorInatividadeId_){ clearInterval(monitorInatividadeId_); monitorInatividadeId_ = null; }
}
function reiniciarMonitorInatividade_(){ registrarAtividade_(); }

/* ===== ações de item (pasta/documento) — botões no desktop, menu "⋮" no celular =====
   ITEM (celular): cada linha tinha 4-6 ícones lado a lado, apertados demais na
   tela pequena. Agora, no celular, as ações viram um único botão "⋮" que abre
   um menu com a lista de ações (mesmo padrão do Google Drive mobile). No
   computador o comportamento visual não muda — continuam sendo os ícones. */
function acaoBaixarDescr_(d, permitido){
  return permitido
    ? {ic:'fa-download', title:'Baixar', action:'baixar-doc', id:d.id}
    : {ic:'fa-lock', title:'Download não permitido pela sua permissão', disabled:true};
}
function itemMenuLinha_(o){
  if(o.disabled) return '<div class="menu-line locked"><i class="fa-solid ' + o.ic + '"></i>' + esc(o.title) + '</div>';
  return '<button class="menu-line' + (o.danger ? ' danger' : '') + '" data-action="' + o.action + '" data-id="' + esc(o.id) + '" data-fecha-menu="1"><i class="fa-solid ' + o.ic + '"></i>' + esc(o.title) + '</button>';
}
function renderAcoes_(itens, tipo, id){
  itens = itens.filter(Boolean);
  if(!itens.length) return '';
  // Consolidado num único botão "⋮" com menu flutuante em qualquer
  // tamanho de tela — antes só o celular usava esse menu; no computador
  // cada ação virava um ícone solto na linha, ocupando bastante espaço.
  const menuId = 'menuItem-' + tipo + '-' + id;
  return '<div class="item-menu"><button class="btn-ic" data-action="toggle-item-menu" data-target="' + menuId + '" title="Mais ações"><i class="fa-solid fa-ellipsis-vertical"></i></button>' +
    '<div class="item-menu-pop" id="' + menuId + '">' + itens.map(itemMenuLinha_).join('') + '</div></div>';
}
function itensPasta_(p, dono, perms){
  const podeGerir = perms.includes('editar') || perms.includes('excluir_pasta');
  return [
    dono ? {ic:'fa-share-nodes', title:'Permissões da pasta', action:'compartilhar', id:p.id} : null,
    // ITEM 4: renomear pasta — usa a mesma permissão de "editar" (ou
    // "excluir_pasta", que já cobre gestão completa da pasta) que o
    // servidor já aceita em autorizadoPushPasta_ para atualizar uma pasta
    // sem trocar de pai.
    podeGerir ? {ic:'fa-pen', title:'Renomear', action:'renomear-pasta', id:p.id} : null,
    // ITEM: mover pasta usa a mesma permissão de "excluir_pasta" (gestão de
    // pastas) — admin sempre tem via permsAtuais/permsEff.
    perms.includes('excluir_pasta') ? {ic:'fa-folder-tree', title:'Mover', action:'mover-pasta', id:p.id} : null,
    // CORREÇÃO: processarPasta_ (Code.gs) já registrava erroUpload quando a
    // movimentação física no Drive falhava, mas o app nunca mostrava isso
    // nem oferecia reenviar — a pasta ficava com aparência de "movida" na
    // tela para sempre, mesmo com a movimentação física silenciosamente
    // mal-sucedida no Drive.
    p.erroUpload && perms.includes('excluir_pasta') ? {ic:'fa-rotate-right', title:'Tentar mover no Drive de novo (' + p.erroUpload + ')', action:'reenviar-pasta', id:p.id} : null,
    perms.includes('excluir_pasta') ? {ic:'fa-trash-can', title:'Excluir pasta', action:'excluir-pasta', id:p.id, danger:true} : null
  ];
}
function itensDoc_(d, pd){
  return [
    pd.includes('visualizar') ? {ic:'fa-eye', title:'Visualizar', action:'ver-doc', id:d.id} : null,
    pd.includes('enviar_email') ? {ic:'fa-envelope', title:'Email', action:'email-doc', id:d.id} : null,
    acaoBaixarDescr_(d, pd.includes('download')),
    d.erroUpload ? {ic:'fa-rotate-right', title:'Reenviar para o Drive (' + d.erroUpload + ')', action:'reenviar-doc', id:d.id} : null,
    pd.includes('editar') ? {ic:'fa-folder-tree', title:'Mover', action:'mover-doc', id:d.id} : null,
    pd.includes('editar') ? {ic:'fa-pen', title:'Editar', action:'editar-doc', id:d.id} : null,
    pd.includes('excluir') ? {ic:'fa-trash-can', title:'Excluir', action:'excluir-doc', id:d.id, danger:true} : null
  ];
}
// ITEM 1 (campo "localizar"): antes a busca só filtrava dentro da pasta
// aberta no momento — pesquisar um documento que estivesse em outra pasta
// simplesmente não trazia resultado nenhum. Agora, quando há texto digitado
// no campo de busca, a pesquisa passa a considerar TODAS as pastas e
// TODOS os documentos aos quais o usuário logado tem acesso (permissão de
// "visualizar"), em qualquer nível da árvore — não só os itens da pasta
// atual. Sem texto de busca, o comportamento continua o de sempre (mostra
// só o conteúdo da pasta aberta).
function caminhoPasta_(pastaId){
  const partes = [];
  let cur = pastaPorId(pastaId);
  while(cur){ partes.unshift(cur.nome); cur = pastaPorId(cur.parentId); }
  return partes.length ? partes.join(' / ') : 'Início';
}
function itensVisiveis(){
  const u = currentUser();
  const q = state.search.trim().toLowerCase();
  let folders, docs;
  if(q){
    folders = DB.get('Pastas');
    docs    = DB.get('Documentos');
    if(!ehAdmin(u)){
      folders = folders.filter(p => p.criadaPor === u.id || permsEff(u.id, p).includes('visualizar'));
      docs    = docs.filter(d => permsDoc(d).includes('visualizar'));
    }
  } else {
    folders = DB.get('Pastas').filter(p => (p.parentId || null) === (state.currentFolderId || null));
    docs    = DB.get('Documentos').filter(d => (d.pastaId  || null) === (state.currentFolderId || null));
    if(!state.currentFolderId && !ehAdmin(u)){
      folders = folders.filter(p => permsEff(u.id, p).includes('visualizar'));
      docs = docs.filter(d => permsDoc(d).includes('visualizar'));
    } else if(state.currentFolderId){
      folders = folders.filter(p => p.criadaPor === u.id || ehAdmin(u) || permsEff(u.id, p).includes('visualizar'));
      // ITEM 2/3: faltava esse mesmo filtro aqui — dentro de uma pasta, os
      // ARQUIVOS apareciam pra todo mundo que tivesse acesso à pasta, mesmo
      // sem permissão de Visualizar concedida a esse usuário especificamente.
      if(!ehAdmin(u)) docs = docs.filter(d => permsDoc(d).includes('visualizar'));
    }
  }
  docs = docs.filter(d => formatoVisivel(d, u));
  // ITEM (dashboard só mostra arquivos enviados com sucesso): enquanto um
  // arquivo ainda está subindo (ou falhou) ele fica "solto" na tela
  // principal com um status ao lado — o que também deixava mais visível
  // qualquer duplicata temporária durante o envio. Agora a lista principal
  // só mostra arquivos já confirmados no Drive (com driveId); os que ainda
  // estão subindo ou que falharam ficam visíveis SÓ no painel de envio
  // (onde dá pra cancelar ou reenviar), e só aparecem aqui quando
  // realmente terminarem com sucesso.
  if(Sync.url()) docs = docs.filter(d => d.tipo !== 'arquivo' || d.driveId);
  if(q){
    folders = folders.filter(p => p.nome.toLowerCase().includes(q));
    docs    = docs.filter(d => d.titulo.toLowerCase().includes(q));
  }
  // ITEM (ordenar por nome/data + último arquivo sempre no início): antes
  // a ordem exibida era simplesmente a que vinha do servidor/cache local,
  // que podia variar (um item novo em envio aparecia só no fim da lista
  // até ser confirmado, por exemplo). Agora a lista é sempre ordenada
  // explicitamente aqui, conforme a escolha do usuário no botão
  // "Ordenar" (nome ou data), com "data mais recente primeiro" como
  // padrão — assim o último arquivo enviado sempre aparece no topo do
  // Dashboard, de forma consistente.
  const {campo, direcao} = state.ordenacao;
  const mult = direcao === 'asc' ? 1 : -1;
  const comparar = campo === 'nome'
    ? (a, b, chave) => String(a[chave] || '').localeCompare(String(b[chave] || ''), 'pt-BR', {sensitivity:'base'}) * mult
    : (a, b) => ((a.atualizadoEm || a.criadoEm || 0) - (b.atualizadoEm || b.criadoEm || 0)) * mult;
  folders = folders.slice().sort((a, b) => campo === 'nome' ? comparar(a, b, 'nome') : comparar(a, b));
  docs    = docs.slice().sort((a, b) => campo === 'nome' ? comparar(a, b, 'titulo') : comparar(a, b));
  return {folders, docs, buscaGlobal: !!q};
}
// Atualiza só o número "X pastas • Y arquivos" do topo do Dashboard, sem
// re-renderizar a lista inteira. Recebe os totais já calculados quando o
// chamador já tem essa informação (renderItens); senão, recalcula sozinha
// a partir de itensVisiveis() — é o caminho usado durante um lote de
// upload/reenvio ativo, onde a lista fica parada de propósito (ver
// handleUploadLote) mas o contador deve continuar subindo em tempo real a
// cada arquivo que termina.
function atualizarContagemArquivos_(totalPastas, totalArquivos){
  const cont = $('#contagemArquivos');
  if(!cont) return;
  if(totalPastas === undefined || totalArquivos === undefined){
    const iv = itensVisiveis();
    totalPastas = iv.folders.length; totalArquivos = iv.docs.length;
  }
  cont.innerHTML = '<i class="fa-solid fa-folder"></i> ' + totalPastas + ' pasta' + (totalPastas === 1 ? '' : 's') + ' &nbsp;•&nbsp; <i class="fa-solid fa-file"></i> ' + totalArquivos + ' arquivo' + (totalArquivos === 1 ? '' : 's');
}
function renderItens(){
  const el = $('#itens'); if(!el) return;
  try{
    const u = currentUser();
    const {folders, docs, buscaGlobal} = itensVisiveis();
    // ITEM 2 (contador não atualizava durante a busca): antes o total de
    // pastas/arquivos só era calculado uma vez em renderDashboard() e nunca
    // era refeito quando o usuário digitava no campo de busca (que só
    // chama renderItens(), não renderDashboard()). Agora o contador é
    // atualizado aqui, a cada renderização, refletindo o resultado da
    // busca (inclusive busca global em todas as pastas).
    atualizarContagemArquivos_(folders.length, docs.length);
    const perms = permsAtuais();
    const usuarios = getUsuarios();
    const nomeDe = id => (usuarios.find(x => x.id === id) || {}).nome || '—';
    const mode = state.viewMode || 'detalhes';
    const grid = ['xg','g','m','p'].includes(mode);

    const acoesPasta = (p, dono) => renderAcoes_(itensPasta_(p, dono, perms), 'pasta', p.id);
    const acoesDoc = (d, pd) => renderAcoes_(itensDoc_(d, pd), 'doc', d.id);
    const chk = (tipo, itemId) => !state.selecaoAtiva ? '' :
      '<input type="checkbox" class="sel-chk" data-action="toggle-sel" data-tipo="' + tipo + '" data-id="' + itemId + '" ' + (state.selecao.has(selKey(tipo, itemId)) ? 'checked' : '') + '>';
    const selCls = (tipo, itemId) => state.selecaoAtiva && state.selecao.has(selKey(tipo, itemId)) ? ' sel-row' : '';
    // CORREÇÃO: indicador de falha no Drive (upload ou movimentação) só
    // aparecia no modo "detalhes", e só para documentos — pastas nunca
    // mostravam nada mesmo quando processarPasta_ registrava erroUpload no
    // servidor. Agora o aviso aparece nos três modos de visualização, tanto
    // para pastas quanto para documentos.
    const avisoDrive = msg => msg ? ' <i class="fa-solid fa-triangle-exclamation" style="color:#c0392b" title="' + esc(msg) + '"></i>' : '';

    let html = '';
    if(grid){
      el.className = 'itens-grid mode-' + mode;
      html = folders.map(p => {
        const dono = p.criadaPor === u.id || ehAdmin(u);
        const privada = !ownerIsAdmin(p) && p.criadaPor !== u.id;
        return '<div class="gcard' + selCls('pasta', p.id) + '" data-action="open-folder" data-id="' + p.id + '">' +
          chk('pasta', p.id) +
          '<span class="item-ic ic-pasta"><i class="fa-solid ' + (privada ? 'fa-user-lock' : 'fa-folder') + '"></i></span>' +
          '<span class="gname" title="' + esc(p.nome) + '">' + esc(p.nome) + avisoDrive(p.erroUpload) + '</span>' +
          '<span class="gsmall">' + esc(nomeDe(p.criadaPor)) + ' • ' + fmtData(p.criadaEm) +
            (buscaGlobal ? ' • <i class="fa-solid fa-folder-tree"></i> ' + esc(caminhoPasta_(p.parentId)) : '') + '</span>' +
          '<div class="gcard-actions">' + acoesPasta(p, dono) + '</div></div>';
      }).join('') +
      docs.map(d => {
        const ci = catInfo(d); const pd = permsDoc(d);
        return '<div class="gcard' + selCls('doc', d.id) + '">' +
