<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão de Documentos</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html-docx-js@0.3.1/dist/html-docx.js"></script>
<style>
:root{
  --primary:#1552c2; --primary-dark:#0e3f9e; --heading:#173f8f;
  --bg:#eef2f7; --sidebar-bg:#f5f8fc; --border:#d8e0ec;
  --text:#22314f; --muted:#6b7a99;
  --danger:#d64545; --success:#2f9e6e; --warn:#e8a13c;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:15px}
.hidden{display:none!important}
button{font-family:inherit}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border:none;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;transition:.2s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-light{background:#fff;color:var(--primary);border:1px solid var(--border)}
.btn-light:hover{background:#f2f7ff;border-color:var(--primary)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#b93636}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-block{width:100%;justify-content:center}
.btn-ic{width:34px;height:34px;border:1px solid var(--border);background:#fff;border-radius:8px;color:var(--primary);cursor:pointer;transition:.2s;display:inline-flex;align-items:center;justify-content:center;flex:0 0 34px}
.btn-ic:hover{background:#eaf2ff;border-color:var(--primary)}
.btn-ic.danger{color:var(--danger)}
.btn-ic.danger:hover{background:#fdeeee;border-color:var(--danger)}
.btn-ic.locked{color:#9aa7c0;background:#f2f5fa;cursor:not-allowed}
/* Câmera: só faz sentido em aparelho com câmera embutida (celular/tablet).
   Em telas largas (computador) fica escondida; some por padrão e só
   reaparece na media query de celular mais abaixo. */
.btn-camera-mobile{display:none}
/* ===== login ===== */
.login-screen{min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:linear-gradient(160deg,#0b2f7d 0%,#1552c2 55%,#2f7ae0 100%);padding:24px}
.login-card{background:#fff;border-radius:16px;padding:36px 34px;width:min(430px,94vw);box-shadow:0 24px 60px rgba(0,20,60,.35);animation:fadeUp .45s ease}
.login-card img{width:210px;display:block;margin:0 auto 14px;object-fit:contain;max-height:90px}
.login-card h1{font-size:20px;color:var(--heading);text-align:center;margin-bottom:18px}
.login-status{margin:-8px 0 14px;text-align:center;font-size:12px;color:var(--muted)}
.login-status i{margin-right:5px}
.login-status.ok{color:var(--success)}
.login-status.erro{color:var(--danger)}
.campo{display:block;margin-bottom:14px;font-size:13px;font-weight:600;color:var(--heading)}
.campo input,.campo textarea,.campo select{display:block;width:100%;margin-top:6px;padding:11px 12px;border:1px solid var(--border);border-radius:8px;font:inherit;font-weight:400;color:var(--text);background:#fbfcff;transition:.2s}
.campo input:disabled{background:#eef1f6;color:#7a8aa8}
.campo input:focus,.campo textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(21,82,194,.15)}
.erro{color:var(--danger);font-size:13px;min-height:18px;margin-bottom:6px}
.email-multi-list{list-style:none;margin:0 0 16px;padding:10px 12px;background:#f5f8fc;border:1px solid var(--border);border-radius:8px;max-height:160px;overflow-y:auto;font-size:13.5px}
.email-multi-list li{padding:4px 0;display:flex;align-items:center;gap:8px;color:var(--text)}
.email-multi-list li i{color:var(--primary);font-size:12px}
/* ===== shell ===== */
/* ITEM 13 (menu do celular sumindo ao rolar / cabeçalho fixo não colava):
   antes, #app não tinha altura própria — .shell só usava min-height, então
   .main nunca ficava realmente restrito a uma altura, e era a PÁGINA
   INTEIRA que rolava (não uma área interna). Isso fazia a barra do topo
   (com o botão de menu ☰) rolar para fora da tela no celular junto com o
   resto, apesar do position:sticky nela — e fazia o cabeçalho fixo do
   Dashboard "brigar" pela mesma posição, escondido atrás da topbar. Agora
   #app tem altura real de tela cheia e só .main rola de verdade — barra do
   topo e menu lateral ficam sempre no lugar, como num app de verdade. */
#app{height:100vh;height:100dvh;display:flex;flex-direction:column}
.topbar{height:66px;flex:0 0 auto;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 20px;z-index:40}
.topbar .logo-rio{height:46px;width:auto;max-width:220px;object-fit:contain}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.user-hello{color:var(--heading);font-weight:700;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-toggle{display:none;border:none;background:none;font-size:20px;color:var(--primary);cursor:pointer}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;border-radius:999px;padding:5px 11px}
.sync i{font-size:7px}
.sync.on{background:#e5f6ee;color:var(--success)}
.sync.off{background:#fdf3e2;color:var(--warn)}
.shell{display:flex;flex:1;min-height:0}
.sidebar{width:262px;flex:0 0 262px;background:var(--sidebar-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:22px 14px}
.sidebar-version{margin-top:auto;padding:14px 6px 4px;font-size:11px;color:var(--muted);text-align:center;border-top:1px solid var(--border)}
.nav-item{display:flex;align-items:center;gap:13px;width:100%;padding:13px 15px;border:none;background:none;border-radius:9px;color:var(--primary);font-weight:600;font-size:14.5px;cursor:pointer;transition:.18s;text-align:left;margin-bottom:6px}
.nav-item i{width:20px;text-align:center}
.nav-item:hover{background:#e6effc}
.nav-item.active{background:#dcebff;box-shadow:inset 3px 0 0 var(--primary)}
.main{flex:1;min-height:0;padding:28px 34px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.page-title{font-size:26px;color:var(--heading);font-weight:700;padding-bottom:14px;border-bottom:1px solid #b9c8e4;margin-bottom:22px}
.view{animation:fadeUp .35s ease}
/* ===== cards / toolbar ===== */
.card{background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 1px 3px rgba(16,42,90,.07);overflow:visible}
/* Cabeçalho do Dashboard (título, busca, seleção, navegação de pastas)
   fixo no topo da área de conteúdo ao rolar a lista de arquivos — o
   .card tem overflow:visible, então o sticky funciona relativo ao
   scroll de .main, sem ficar preso/cortado pelo card. */
.dash-sticky-head{position:sticky;top:0;z-index:15;background:#fff;background-clip:padding-box;border-radius:10px 10px 0 0;-webkit-transform:translateZ(0);transform:translateZ(0);will-change:transform;isolation:isolate;box-shadow:0 1px 0 #fff,0 6px 10px -6px rgba(15,32,66,.18)}
.card.mb{margin-bottom:20px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px 0;flex-wrap:wrap}
.card-head-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-left:auto}
.card-head h2{font-size:16.5px;color:var(--heading);display:flex;align-items:center;gap:10px}
.card-head h2 i{color:var(--primary)}
.toolbar{display:flex;gap:12px;align-items:center;padding:16px 22px;flex-wrap:wrap}
.toolbar-actions{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search-box{flex:1;min-width:220px;display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:8px;background:#fff;padding:0 14px;height:44px;transition:.2s}
.search-box:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px rgba(21,82,194,.13)}
.search-box i{color:var(--muted)}
.search-box input{border:none;outline:none;flex:1;font:inherit;height:100%;background:transparent}
.search-clear{border:none;background:transparent;color:var(--muted);cursor:pointer;padding:4px;display:flex;align-items:center;justify-content:center;border-radius:50%;line-height:0}
.search-clear:hover{color:var(--primary);background:rgba(21,82,194,.08)}
.search-clear:hover i{color:var(--primary)}
.viewmenu{position:relative}
.viewmenu-pop{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 30px rgba(10,30,70,.18);padding:6px;z-index:80;min-width:220px;display:none;max-height:340px;overflow-y:auto}
.viewmenu-pop.open{display:block;animation:pop .18s ease}
/* ===== menu de ações "três pontinhos" (usado no celular) ===== */
.item-menu{position:relative;display:inline-flex}
.item-menu>.btn-ic{width:34px;height:34px;flex:0 0 34px;background:#fff;border-color:var(--border);color:var(--primary)}
.item-menu>.btn-ic:hover{background:#f2f7ff;border-color:var(--primary)}
.item-menu-pop{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 30px rgba(10,30,70,.18);padding:6px;z-index:90;min-width:210px;display:none;max-width:calc(100vw - 24px);max-height:calc(100vh - 90px);overflow-y:auto}
.item-menu-pop.abre-para-cima{top:auto;bottom:calc(100% + 6px)}
.item-menu-pop.open{display:block;animation:pop .18s ease}
.menu-line{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;text-align:left;padding:10px 12px;border-radius:8px;font:inherit;font-size:13.5px;font-weight:600;color:var(--text);cursor:pointer}
.menu-line:hover{background:#f4f8ff}
.menu-line i{width:16px;text-align:center;color:var(--primary)}
.menu-line.danger{color:var(--danger)}
.menu-line.danger i{color:var(--danger)}
.menu-line.locked{color:#9aa7c0;cursor:not-allowed}
.menu-line.locked i{color:#9aa7c0}
.vm-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:none;background:none;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--text);cursor:pointer;text-align:left}
.vm-item:hover{background:#f2f7ff}
.vm-item.active{background:#e3edff;color:var(--primary)}
.vm-item i{width:18px;text-align:center;color:var(--primary)}
.breadcrumb{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:0 22px 14px;font-size:13px}
.breadcrumb-row{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:0 22px 14px}
.breadcrumb-row .breadcrumb{padding:0}
.sel-row-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;flex-wrap:wrap}
.sel-row-btns{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.contagem-arquivos{color:var(--muted,#667085);font-size:13px;font-weight:600;white-space:nowrap}
.contagem-arquivos i{margin-right:6px}
.crumb{border:none;background:none;color:var(--primary);font-weight:600;cursor:pointer;font-size:13px;padding:4px 6px;border-radius:6px}
.crumb:hover{background:#eaf2ff}
.crumb.active{color:var(--muted);cursor:default;background:none}
.sep{color:#b6c4dd;font-size:10px}
/* ===== itens ===== */
.itens{padding:6px 12px 18px}
.item-row{display:flex;align-items:center;gap:14px;padding:13px 12px;border-radius:10px;transition:.15s;border-top:1px solid #eef2f9;flex-wrap:wrap}
.item-row:hover{background:#f4f8ff}
.lrow{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:8px;transition:.15s;border-top:1px solid #f0f4fa;flex-wrap:wrap}
.lrow:hover{background:#f4f8ff}
.lrow .item-ic{width:30px;height:30px;font-size:13px;flex:0 0 30px;border-radius:8px}
.lrow .gname{font-weight:600;font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-ic{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 42px}
.ic-pasta{background:#e3edff;color:var(--primary)}
.ic-doc{background:#e5f6ee;color:var(--success)}
.ic-pdf{background:#fdeeee;color:var(--danger)}
.ic-img{background:#e0f5f2;color:#0e8f7e}
.ic-video{background:#efe6fb;color:#7a3fd4}
.ic-audio{background:#fdf0e0;color:#d47a1a}
.ic-sheet{background:#e5f6ee;color:#217a4b}
.ic-word{background:#e3edff;color:#2b6cd4}
.ic-zip{background:#f3eee6;color:#8a6a2f}
.item-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item-info strong{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-info small{color:var(--muted);font-size:12px}
.item-desc{color:var(--muted);font-size:12.5px;white-space:normal;overflow-wrap:break-word;line-height:1.4}
.item-caminho{color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
.item-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chev{color:#b6c4dd;font-size:12px}
.item-row[data-action="open-folder"],.lrow[data-action="open-folder"]{cursor:pointer}
.sel-chk{width:18px;height:18px;flex:0 0 18px;cursor:pointer;accent-color:var(--primary)}
.item-row.sel-row,.lrow.sel-row{background:#eaf2ff}
.gcard{position:relative}
.gcard .sel-chk{position:absolute;top:8px;left:8px;z-index:2}
.gcard.sel-row{box-shadow:0 0 0 2px var(--primary) inset}
.sel-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 22px;background:#eaf2ff;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.sel-bar .sel-count{font-weight:700;color:var(--primary);font-size:13.5px;display:flex;align-items:center;gap:6px;margin-right:auto}

.itens-grid{display:grid;gap:12px;padding:12px 16px 18px}
.mode-xg{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.mode-g{grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
.mode-m{grid-template-columns:repeat(auto-fill,minmax(138px,1fr))}
.mode-p{grid-template-columns:repeat(auto-fill,minmax(106px,1fr));gap:8px}
.gcard{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center;transition:.15s}
.gcard:hover{box-shadow:0 8px 20px rgba(16,42,90,.12);transform:translateY(-1px)}
.gcard[data-action="open-folder"]{cursor:pointer}
.gcard .item-ic{width:64px;height:64px;font-size:27px;flex-basis:64px}
.mode-g .gcard .item-ic{width:52px;height:52px;font-size:22px;flex-basis:52px}
.mode-m .gcard .item-ic{width:42px;height:42px;font-size:18px;flex-basis:42px}
.mode-m .gcard{padding:12px 8px 10px}
.mode-p .gcard{padding:10px 6px 8px;gap:6px}
.mode-p .gcard .item-ic{width:30px;height:30px;font-size:14px;flex-basis:30px;border-radius:8px}
.gname{font-weight:700;color:var(--text);font-size:13.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mode-xg .gname{font-size:15px}
.mode-p .gname{font-size:11px;font-weight:600}
.gsmall{color:var(--muted);font-size:11px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mode-m .gsmall,.mode-p .gsmall{display:none}
.gcard-actions{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.gcard-actions .btn-ic{width:28px;height:28px;flex-basis:28px;font-size:12px}
.mode-p .gcard-actions .btn-ic{width:24px;height:24px;flex-basis:24px;font-size:11px}
.mode-xg .gcard-actions .btn-ic{width:32px;height:32px;flex-basis:32px}
.vazio{padding:44px 20px;text-align:center;color:var(--primary);grid-column:1/-1}
.vazio i{font-size:30px;opacity:.55;display:block;margin-bottom:10px}
.tag{font-size:11px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap}
.tag-admin{background:#e6e0fb;color:#5b3fd4}
.tag-edit{background:#e3edff;color:var(--primary)}
.tag-down{background:#e0f5f2;color:#0e8f7e}
.tag-view{background:#eef1f6;color:#5c6c8c}
.tag-info{background:#e3edff;color:var(--primary);display:inline-flex;align-items:center;gap:6px}
.tag-arq{background:#eef1f6;color:#41537a;display:inline-flex;align-items:center;gap:5px}
.mini-perms{display:inline-flex;gap:7px;flex-wrap:wrap}
.mini-perms i{color:#5c76a8;font-size:12px}
/* ===== tabela ===== */
.table-wrap{overflow-x:auto;padding:14px 22px 22px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{color:var(--heading);text-align:left;font-size:12.5px;text-transform:uppercase;letter-spacing:.4px;padding:10px 12px;border-bottom:2px solid #dbe5f3}
td{padding:12px;border-bottom:1px solid #edf1f7;vertical-align:middle}
.tr-right{text-align:right}
.cell-user{display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--primary);color:#fff;font-weight:700;font-size:13px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 36px}
.select-papel{padding:7px 9px;border:1px solid var(--border);border-radius:7px;font:inherit;font-size:13px;color:var(--text);background:#fff}
.select-papel:disabled{background:#eef1f6;color:#7a8aa8}
/* ===== modal ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(8,20,45,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:18px;animation:fade .2s}
.modal-card{background:#fff;border-radius:14px;width:min(1060px,96vw);max-height:92vh;overflow-y:auto;padding:26px 26px 22px;animation:pop .25s ease;box-shadow:0 30px 70px rgba(0,10,40,.35)}
.modal-card h3{color:var(--heading);font-size:17px;margin-bottom:6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.modal-card h3 i{color:var(--primary)}
.modal-sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.modal-msg{margin:10px 0 18px;color:var(--text)}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap}
.ic-danger{color:var(--danger)!important}
.passos{margin:0 0 14px 20px;color:var(--text);font-size:14px;line-height:1.9}
/* ===== editores ===== */
.w-toolbar{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0;align-items:center}
.w-toolbar .btn-ic{width:32px;height:32px;flex-basis:32px}
.word-editor{min-height:300px;max-height:48vh;overflow:auto;background:#fff;border:1px solid var(--border);border-radius:10px;padding:18px 20px;font-size:14px;line-height:1.7}
.word-editor:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(21,82,194,.12)}
.word-editor h1,.word-editor h2,.word-editor h3{margin:12px 0 8px;color:var(--heading)}
.word-editor p{margin:0 0 10px}
.word-editor ul,.word-editor ol{margin:0 0 10px 22px}
.word-editor table{border-collapse:collapse;width:100%}
.word-editor td,.word-editor th{border:1px solid var(--border);padding:6px 8px}
.sheet-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.stab{border:1px solid var(--border);background:#fff;border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer}
.stab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.sheet-editor-wrap{overflow:auto;border:1px solid var(--border);border-radius:10px;padding:8px;background:#fff;max-height:52vh}
.sheet-table{border-collapse:collapse;font-size:12.5px}
.sheet-table th{background:#e3edff;color:var(--heading);text-align:left}
.sheet-table th,.sheet-table td{border:1px solid var(--border);padding:5px 8px;white-space:nowrap}
.sheet-table.edit td[contenteditable="true"]{min-width:90px;cursor:text}
.sheet-table.edit td[contenteditable="true"]:focus{outline:2px solid var(--primary);outline-offset:-2px;background:#f4f8ff}
.sheet-table .rn{background:#eef2f8;color:var(--muted);font-size:11px;text-align:center;min-width:36px;user-select:none}
/* câmera */
.cam-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin:10px 0}
.cam-item{position:relative}
.cam-item img{width:100%;height:110px;object-fit:cover;border-radius:8px;border:1px solid var(--border);display:block}
.cam-item .btn-ic{position:absolute;top:-9px;right:-9px}
/* ===== ajuste de bordas do documento (tipo scanner) ===== */
.modal-card.modal-ajuste-bordas{max-width:640px}
.ajuste-bordas-wrap{position:relative;width:100%;max-height:60vh;overflow:hidden;border-radius:10px;background:#111;touch-action:none;user-select:none;-webkit-user-select:none}
.ajuste-bordas-wrap img{display:block;width:100%;height:auto;max-height:60vh;object-fit:contain;pointer-events:none;user-select:none;-webkit-user-select:none}
.ajuste-bordas-svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.ajuste-poligono{fill:rgba(21,82,194,.22);stroke:var(--primary);stroke-width:.6;vector-effect:non-scaling-stroke}
.ajuste-handle{fill:#fff;stroke:var(--primary);stroke-width:.8;vector-effect:non-scaling-stroke;cursor:grab;touch-action:none}
.ajuste-handle:active{cursor:grabbing;fill:var(--primary)}
/* ===== permissões da pasta ===== */
.perm-topbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:0 0 12px}
.perm-topbar .search-box{height:40px;min-width:200px}
.perm-bulk{display:flex;gap:8px;flex-wrap:wrap}
.perm-bulk button{border:1px solid var(--border);background:#fff;color:var(--primary);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer}
.perm-bulk button:hover{background:var(--primary);color:#fff}
.perm-scroll{max-height:52vh;overflow-y:auto;padding-right:6px}
.perm-scroll::-webkit-scrollbar{width:8px}
.perm-scroll::-webkit-scrollbar-thumb{background:#c4d1e6;border-radius:8px}
.prow{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;background:#fff;flex-wrap:wrap;transition:.15s}
.prow:hover{border-color:#b9cdec;box-shadow:0 3px 10px rgba(16,42,90,.08)}
.prow .perm-user{flex:1;min-width:200px;display:flex;flex-direction:column;gap:3px}
.prow .perm-user small{color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.prow .avatar{width:34px;height:34px;flex-basis:34px;font-size:12px}
.prow-left{display:flex;align-items:center;gap:10px;flex:1;min-width:220px}
.ptogs{display:flex;gap:6px;flex-wrap:wrap}
.ptog{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:#fff;color:#a5b2ca;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:13px;transition:.15s;flex:0 0 32px}
.ptog:hover{border-color:var(--primary);color:var(--primary)}
.ptog.on{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 2px 6px rgba(21,82,194,.35)}
.perm-legenda{display:flex;gap:10px;flex-wrap:wrap;padding:10px 2px 2px;color:var(--muted);font-size:11.5px}
.perm-legenda i{color:var(--primary);width:14px;text-align:center;margin-right:3px}
/* ===== checkboxes ===== */
.perm-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.chk{display:flex;align-items:center;gap:9px;border:1px solid var(--border);border-radius:8px;padding:9px 11px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text);background:#fbfcff;transition:.15s}
.chk:hover{border-color:var(--primary);background:#f4f8ff}
.chk input{accent-color:var(--primary);width:15px;height:15px;cursor:pointer}
.chk i{color:var(--primary);width:16px;text-align:center}
.preset-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.preset-row button{border:1px solid var(--border);background:#fff;color:var(--primary);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer}
.preset-row button:hover{background:var(--primary);color:#fff}
.doc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.doc-meta{display:flex;flex-wrap:wrap;gap:14px;color:var(--muted);font-size:12.5px;margin:10px 0 14px;padding:10px 12px;background:#f5f8fc;border-radius:8px}
.doc-meta i{margin-right:5px;color:var(--primary)}
.doc-body{white-space:pre-wrap;background:#fbfcff;border:1px solid var(--border);border-radius:10px;padding:18px;font-size:14px;line-height:1.65}
.doc-body.docx-view,.doc-body.sheet-view{white-space:normal;background:#fff}
.docx-view h1,.docx-view h2,.docx-view h3{margin:14px 0 8px;color:var(--heading)}
.docx-view p{margin:0 0 10px}
.docx-view ul,.docx-view ol{margin:0 0 10px 22px}
.docx-view img{max-width:100%}
.docx-view table{border-collapse:collapse;width:100%;margin-bottom:10px}
.docx-view td,.docx-view th{border:1px solid var(--border);padding:6px 8px;font-size:13px}
.table-x{overflow:visible;max-height:none;margin-bottom:12px}
.sheet-title{margin:14px 0 6px;color:var(--heading);font-size:14px}
.pdf-frame{width:100%;height:70vh;max-height:calc(92vh - 220px);border:1px solid var(--border);border-radius:10px;background:#525659;display:block}
.pdf-restrito{height:70vh;max-height:calc(92vh - 220px);overflow-y:auto;background:#525659;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:12px;align-items:center;user-select:none;-webkit-user-select:none}
.pdf-restrito .pdf-page{max-width:100%;height:auto;box-shadow:0 6px 18px rgba(0,0,0,.45);border-radius:2px;pointer-events:none}
.restrito-aviso{width:100%;display:flex;align-items:center;gap:10px;background:rgba(21,82,194,.92);color:#fff;font-size:12.5px;font-weight:700;border-radius:8px;padding:9px 12px;flex:0 0 auto}
.prev-img{display:block;margin:0 auto;max-width:100%;border-radius:10px;border:1px solid var(--border)}
.prev-media{width:100%;max-height:56vh;border-radius:10px;background:#000}
.no-prev{padding:44px 20px;text-align:center;background:#f5f8fc;border-radius:10px;color:var(--muted)}
.no-prev i{font-size:44px;display:block;margin-bottom:12px;color:#9fb2d3}
/* ITEM: a barra de rolagem do MODAL (fora) rolava o card inteiro (título,
   metadados, ações), mas a pré-visualização (iframe do Drive/PDF) tem altura
   fixa e cuidava da própria rolagem por dentro — duas barras de rolagem
   "competindo" faziam parecer que dava pra rolar mas o conteúdo de baixo do
   documento nunca aparecia. Quando o modal é de visualização de documento
   (classe .modal-doc-view), o card vira uma coluna flex: cabeçalho e botões
   ficam fixos, e só a área de pré-visualização (.doc-viewer-corpo) rola,
   ocupando todo o espaço restante — sem disputa entre duas barras.  */
.modal-card.modal-doc-view{display:flex;flex-direction:column;max-height:92vh;overflow:hidden}
.modal-card.modal-doc-view>*{flex:0 0 auto}
.modal-card.modal-doc-view .doc-viewer-corpo{flex:1 1 auto;min-height:240px;overflow-y:auto;margin-bottom:14px}
.modal-card.modal-doc-view .doc-viewer-corpo .pdf-frame,
.modal-card.modal-doc-view .doc-viewer-corpo .pdf-restrito{height:100%;max-height:none}
/* ===== configurações ===== */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.cfg-body{padding:18px 22px}
.cfg-cols{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.logo-prev-wrap{background:#f5f8fc;border:1px dashed var(--border);border-radius:10px;padding:18px;display:flex;align-items:center;justify-content:center;min-height:130px}
.logo-prev-wrap img{max-width:230px;max-height:110px;object-fit:contain}
.fmt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px;margin:12px 0}
.fmt-grid .chk{padding:8px 10px;font-size:12.5px}
/* Barra única de "Salvar alterações" da tela Configurações — antes havia um
   botão igual repetido em cada seção (Formatos, Segurança da sessão), o
   que confundia por parecer que cada um salvava só a sua parte; agora é
   um único botão que salva a página inteira. Fixo (não sticky) no canto
   da tela para já aparecer mesmo lá em cima, nas seções de Dados
   cadastrais/Logotipo, sem precisar rolar a página até perto do fim. */
.cfg-savebar{position:fixed;right:28px;bottom:92px;z-index:60}
.cfg-savebar .btn{box-shadow:0 10px 26px rgba(15,32,66,.28)}
/* Painel de progresso do upload em lote (ITEM 20) — mostra qual arquivo
   está sendo enviado e quantos já terminaram, parecido com o indicador
   do Google Drive, enquanto os arquivos são processados um de cada vez. */
.upload-progress-panel{position:fixed;right:20px;bottom:20px;background:#fff;border-radius:12px;box-shadow:0 14px 36px rgba(10,30,70,.24);width:290px;z-index:180;font-size:13px;border:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column;max-height:340px}
.upload-progress-panel .up-title{font-weight:700;color:var(--heading);padding:12px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);flex:0 0 auto}
.upload-progress-panel .up-title i{color:var(--primary)}
.upload-progress-panel .up-title span{flex:1}
/* ITEM (X para fechar o painel): botão no canto superior direito do
   cabeçalho do painel — fecha (esconde) o painel de progresso. Fechar não
   cancela envios já em andamento, só tira o painel da tela; os arquivos
   ainda na fila continuam sendo enviados em segundo plano. */
.upload-progress-panel .up-fechar{flex:0 0 auto;width:22px;height:22px;border:none;background:transparent;color:#8493ac;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:13px}
.upload-progress-panel .up-fechar:hover{background:#eef2f8;color:var(--heading)}
.upload-progress-panel .up-list{overflow-y:auto;flex:1 1 auto}
.upload-progress-panel .up-item{display:flex;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid #f2f5fa;max-height:60px;opacity:1;overflow:hidden;transition:opacity .25s ease,max-height .25s ease,padding .25s ease}
.upload-progress-panel .up-item:first-child{border-top:none}
/* ITEM (some da lista ao concluir): transição de saída aplicada quando um
   arquivo termina com sucesso (ou é cancelado) — encolhe e desaparece em
   vez de simplesmente sumir, para o usuário perceber que aquele item foi
   concluído antes de sair da lista. */
.upload-progress-panel .up-item.up-item-saindo{opacity:0;max-height:0;padding-top:0;padding-bottom:0;border-top-color:transparent}
.upload-progress-panel .up-item-nome{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.upload-progress-panel .up-item.cancelado .up-item-nome{color:#a7b1c4;text-decoration:line-through}
.upload-progress-panel .up-item-status{width:18px;height:18px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#c3ccdc}
.upload-progress-panel .up-item-status.enviando{color:var(--primary)}
.upload-progress-panel .up-item-status.ok{color:var(--success)}
.upload-progress-panel .up-item-status.falha{color:var(--danger)}
.upload-progress-panel .up-item-status.cancelado{color:#a7b1c4}
/* ITEM (X por arquivo): cancela um arquivo ainda na fila (ainda não
   começou a enviar) ou marca como descartado um que já esteja enviando —
   o botão some assim que o item termina (sucesso ou falha), pois não faz
   sentido cancelar o que já acabou. */
.upload-progress-panel .up-item-cancelar{flex:0 0 auto;width:20px;height:20px;border:none;background:transparent;color:#c3ccdc;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:12px}
.upload-progress-panel .up-item-cancelar:hover{background:#fdecec;color:var(--danger)}
.upload-progress-panel .up-item-cancelar.hidden{visibility:hidden;pointer-events:none}
/* ITEM (reenviar arquivo com falha): só aparece quando o item termina com
   falha — deixa reenviar SÓ aquele arquivo (reaproveitando o mesmo
   documento, sem duplicar) em vez de precisar refazer o lote inteiro. */
.upload-progress-panel .up-item-reenviar{flex:0 0 auto;width:20px;height:20px;border:none;background:transparent;color:var(--primary);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:12px}
.upload-progress-panel .up-item-reenviar:hover{background:#e8f0fe}
.upload-progress-panel .up-item-reenviar.hidden{visibility:hidden;pointer-events:none}
.empresa-resumo{display:flex;flex-direction:column;gap:8px;font-size:14px;color:#3c4c6e}
.empresa-resumo i{color:var(--primary);width:18px;text-align:center;margin-right:6px}
/* ===== perfil / sobre ===== */
.perfil-top{display:flex;align-items:center;gap:18px;padding:22px}
.avatar-lg{width:74px;height:74px;border-radius:50%;background:var(--primary);color:#fff;font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center}
.perfil-nome{font-size:19px;color:var(--heading)}
.sobre-texto{padding:14px 22px 20px;color:#3c4c6e;line-height:1.7;font-size:14px}
.integ-row{display:flex;gap:10px;padding:0 22px 22px;flex-wrap:wrap}
.integ-row input{flex:1;min-width:240px;padding:11px 13px;border:1px solid var(--border);border-radius:8px;font:inherit;font-size:13px}
.integ-row input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(21,82,194,.13)}
.code{background:#0f2557;color:#d7e4ff;border-radius:10px;margin:0 22px 22px;padding:16px;font-family:ui-monospace,Consolas,monospace;font-size:12px;line-height:1.6;max-height:340px;overflow:auto;white-space:pre}
/* ===== toasts ===== */
#toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:200}
.toast{display:flex;align-items:center;gap:10px;background:#fff;border-radius:10px;padding:12px 16px;box-shadow:0 10px 30px rgba(10,30,70,.2);font-size:14px;font-weight:600;animation:slideIn .3s ease;border-left:4px solid var(--success);min-width:250px}
.toast i{color:var(--success)}
.toast.error{border-left-color:var(--danger)} .toast.error i{color:var(--danger)}
.toast.info{border-left-color:var(--primary)} .toast.info i{color:var(--primary)}
.toast.saindo{opacity:0;transform:translateX(20px);transition:.3s}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@media(max-width:960px){
  .menu-toggle{display:block}
  .sidebar{position:fixed;left:0;top:66px;bottom:0;z-index:60;transform:translateX(-105%);transition:.28s;box-shadow:20px 0 40px rgba(0,20,60,.15)}
  .sidebar.open{transform:none}
  .main{padding:20px 16px}
  .grid-2,.cfg-cols,.perm-grid{grid-template-columns:1fr}
  #syncBadge{display:none}
}
@media(max-width:700px){
  .login-screen{padding:16px;align-items:center}
  .login-card{padding:28px 22px;width:100%}
  .login-card img{width:170px;max-height:74px}
  .login-card h1{font-size:18px;margin-bottom:14px}
  .topbar{padding:0 12px;gap:8px;height:58px}
  .topbar .logo-rio{height:36px}
  .shell{min-height:calc(100vh - 58px)}
  .sidebar{top:58px}
  .main{padding:16px 12px}
  .page-title{font-size:21px}
  .card-head{padding:14px 14px 0}
  .toolbar{padding:12px 14px}
  .search-box{min-width:0;width:100%;flex-basis:100%}
  .toolbar-actions{margin-left:0;width:100%;justify-content:flex-end}
  .breadcrumb{padding:0 14px 10px}
  .breadcrumb-row{padding:0 14px 10px}
  .itens,.itens-grid{padding:8px 8px 14px}
  .btn{padding:9px 12px;font-size:13px}
  .modal-overlay{padding:10px}
  .modal-card{padding:18px 14px;width:100vw}
  .modal-actions{justify-content:stretch}
  .modal-actions .btn{flex:1;justify-content:center}
  .prow{flex-direction:column;align-items:stretch}
  .prow-left{min-width:0}
  .perm-topbar{flex-direction:column;align-items:stretch}
  .perm-topbar .search-box{width:100%}
  .doc-meta{gap:8px;font-size:11.5px}
  .table-wrap{padding:10px 12px 14px}
  .cfg-body{padding:14px}
  .sobre-texto{padding:12px 14px 16px}
  .integ-row{padding:0 14px 16px}
  .code{margin:0 14px 14px}
  #toasts{left:12px;right:12px}
  .toast{min-width:0;width:100%}
  .btn-camera-mobile{display:inline-flex}
  .cfg-savebar{right:16px;bottom:78px}
  .upload-progress-panel{left:12px;right:12px;width:auto;bottom:16px}
  .cfg-savebar .btn span{display:none}
}
</style>
</head>
<body>

<!-- ==================== LOGIN ==================== -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <img id="loginLogo" alt="" style="visibility:hidden">
    <h1>Gestão de Documentos</h1>
    <div id="loginStatus" class="login-status hidden"></div>
    <form id="loginForm" autocomplete="off">
      <label class="campo">Email
        <input id="loginEmail" type="email" required>
      </label>
      <label class="campo">Senha
        <input id="loginSenha" type="password" required>
      </label>
      <div id="loginErro" class="erro"></div>
      <button class="btn btn-primary btn-block" type="submit"><i class="fa-solid fa-right-to-bracket"></i> Entrar</button>
    </form>
  </div>
</div>

<!-- ==================== APP ==================== -->
<div id="app" class="hidden">
  <header class="topbar">
    <button class="menu-toggle" id="menuToggle" title="Menu"><i class="fa-solid fa-bars"></i></button>
    <img class="logo-rio" id="logoRio" alt="Logotipo" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==">
    <div class="topbar-right">
      <span id="syncBadge" style="display:none"></span>
      <span class="user-hello" id="userName"></span>
      <button class="btn btn-primary" data-action="logout"><i class="fa-solid fa-right-from-bracket"></i> Sair</button>
    </div>
  </header>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <nav id="sideNav"></nav>
      <div class="sidebar-version" id="sidebarVersao"></div>
    </aside>
    <main class="main"><div id="viewRoot"></div></main>
  </div>
</div>
<!-- ITEM (tela "tremendo" e seleção de arquivo se perdendo): este campo
     ficava DENTRO do HTML de #viewRoot, que é inteiramente reconstruído
     (innerHTML=...) a cada atualização automática da tela (ex.: quando um
     pull periódico chega). Se essa atualização acontecesse justamente
     enquanto a caixa de seleção de arquivos do sistema operacional
     estivesse aberta, o campo original era destruído por baixo dela — a
     escolha de arquivos do usuário terminava presa num elemento que já
     nem existia mais na página, o evento de seleção se perdia e a janela
     de envio nunca abria (o reflow constante da tela nesse meio-tempo é
     também o que causava a sensação de "tela tremendo"). Agora este campo
     fica FORA da área que é reconstruída — sobrevive a qualquer
     atualização de tela, então a seleção nunca mais se perde no meio do
     caminho. O filtro de tipos aceitos é atualizado dinamicamente (ver
     case 'enviar-arquivo') em vez de depender de recriar o elemento. -->
<input type="file" id="fileInput" multiple class="hidden">
<!-- ITEM (enviar uma pasta inteira): usa o atributo não-padrão
     webkitdirectory, suportado pelos navegadores baseados em Chromium e
     Firefox — deixa escolher uma pasta do computador inteira de uma vez,
     preservando os caminhos relativos (File.webkitRelativePath) para
     recriar a mesma estrutura de subpastas dentro da pasta atual do app
     (ver handleUploadPasta_). Fica fora da área reconstruída pelo mesmo
     motivo do #fileInput acima. -->
<input type="file" id="folderInput" webkitdirectory multiple class="hidden">

<div id="modalOverlay" class="modal-overlay hidden"><div class="modal-card" id="modalCard"></div></div>
<div id="toasts"></div>

<script>
/* ================= UTILITÁRIOS ================= */
const $  = (s, r) => (r||document).querySelector(s);
const $$ = (s, r) => Array.from((r||document).querySelectorAll(s));
const uid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const fmtData = ts => { if(!ts) return ''; const d = new Date(ts); if(isNaN(d)) return ''; return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); };
const fmtTam = b => b < 1024 ? b + ' B' : b < 1048576 ? (b/1024).toFixed(1) + ' KB' : (b/1048576).toFixed(1) + ' MB';
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function sanitizarHtmlGerado_(html){
  const tpl=document.createElement('template');tpl.innerHTML=String(html||'');
  tpl.content.querySelectorAll('script,iframe,object,embed,form,link,meta,style').forEach(n=>n.remove());
  tpl.content.querySelectorAll('*').forEach(n=>{
    Array.from(n.attributes).forEach(a=>{
      const k=a.name.toLowerCase(),v=a.value||'';
      if(k.indexOf('on')===0||k==='srcdoc'||k==='style'||(k==='href'&&/^\s*javascript:/i.test(v))||(k==='src'&&!/^\s*(https?:|data:image\/)/i.test(v)))n.removeAttribute(a.name);
    });
    if(n.tagName==='A'){const h=n.getAttribute('href')||'';if(!/^\s*https?:/i.test(h))n.removeAttribute('href');else{n.setAttribute('rel','noopener noreferrer');n.setAttribute('target','_blank');}}
  });
  return tpl.innerHTML;
}

const store = {
  _m: {},
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return (k in this._m) ? this._m[k] : null; } },
  set(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ this._m[k] = v; return false; } }
};
function guardarFolhaSeguro(f, rows){
  if(store.set('rio_'+f, JSON.stringify(rows))) return true;
  try{
    const slim = rows.map(r => (r && typeof r.arquivo === 'string' && r.arquivo.length > 900000) ? Object.assign({}, r, {arquivo:''}) : r);
    return store.set('rio_'+f, JSON.stringify(slim));
  }catch(e){ return false; }
}
// CORREÇÃO (item 9): mesmo princípio da correção no servidor — antes, o
// merge de uma linha do servidor sobre a linha local substituía o objeto
// INTEIRO. Se em algum momento o servidor devolvesse uma versão da linha
// sem "driveId"/"arquivo" (ex.: durante uma corrida de push, ou uma janela
// antes do backend corrigido entrar no ar), o merge local apagava também a
// cópia de segurança que só existia no navegador. Agora o merge é por
// campo: o servidor continua "ganhando" para os campos que ele de fato
// devolveu, mas um campo que só existe localmente (e não veio na resposta
// do servidor) é preservado em vez de apagado.
function mesclarRows(localRows, serverRows){
  const mapLocal = new Map();
  (localRows||[]).forEach(r => { if(r && r.id) mapLocal.set(r.id, r); });
  const mapFinal = new Map();
  (serverRows||[]).forEach(r => {
    if(!r || !r.id) return;
    const loc = mapLocal.get(r.id);
    mapFinal.set(r.id, loc ? Object.assign({}, loc, r) : r);
    mapLocal.delete(r.id);
  });
  mapLocal.forEach((r, id) => mapFinal.set(id, r));
  return Array.from(mapFinal.values());
}

    DB.get('Documentos').filter(d => formatoVisivel(d, u) && (!Sync.url() || d.driveId) && (ehAdmin(u) || permsDoc(d).includes('visualizar'))).forEach(d => {
      const chave = d.pastaId || '';

    // Garante que pastas sem nenhum arquivo também apareçam na lista.
    pastas.forEach(p => { if(!grupos.has(p.id)) grupos.set(p.id, []); });
    if(!grupos.has('')) grupos.set('', DB.get('Documentos').filter(d => (d.pastaId||null)===null && formatoVisivel(d,u) && (!Sync.url()||d.driveId)));
    Array.from(grupos.keys()).sort((a,b) => nomePasta(a).localeCompare(nomePasta(b),'pt-BR')).forEach(chave => {
      linhas.push({tituloPasta: nomePasta(chave)});
      grupos.get(chave)
        .slice().sort((a,b) => (b.atualizadoEm||b.criadoEm||0)-(a.atualizadoEm||a.criadoEm||0))
        .forEach(d => linhas.push({doc:d}));
    });
  } else {
    const {docs} = itensVisiveis();
    linhas.push({tituloPasta: pastaPorId(state.currentFolderId) ? pastaPorId(state.currentFolderId).nome : 'Início'});
    docs.forEach(d => linhas.push({doc:d}));
  }
  const emp = getEmpresa() || {};
  const html = '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Lista de arquivos</title><style>' +
    'body{font-family:Arial,sans-serif;color:#1a2a44;padding:24px;font-size:13px}' +
    'h1{font-size:18px;margin:0 0 4px}.sub{color:#5a6b85;margin:0 0 20px;font-size:12px}' +
    'h2{font-size:14px;margin:22px 0 6px;padding-bottom:4px;border-bottom:2px solid #1a2a44}' +
    'table{width:100%;border-collapse:collapse;margin-bottom:6px}' +
    'th,td{text-align:left;padding:6px 8px;border-bottom:1px solid #dde3ee;font-size:12px}' +
    'th{color:#5a6b85;font-weight:600}' +
    '.vazio{color:#8493ac;font-style:italic;padding:6px 8px}' +
    '@media print{body{padding:0}}' +
    '</style></head><body>' +
    '<h1>' + esc(emp.fantasia || 'Lista de arquivos') + '</h1>' +
    '<p class="sub">Gerado em ' + esc(new Date().toLocaleString('pt-BR')) + ' por ' + esc(u.nome || '') + '</p>' +
    (function(){
      let out = '', tabelaAberta = false;
      linhas.forEach(l => {
        if(l.tituloPasta !== undefined){
          if(tabelaAberta) out += '</table>';
          out += '<h2><i></i>' + esc(l.tituloPasta) + '</h2><table><thead><tr><th>Nome</th><th>Tipo</th><th>Tamanho</th><th>Data</th></tr></thead><tbody>';
          tabelaAberta = true;
        } else {
          const d = l.doc;
          out += '<tr><td>' + esc(d.titulo) + (d.ext ? '.' + esc(d.ext) : '') + '</td><td>' + esc((d.ext||'').toUpperCase()) + '</td><td>' + fmtTam(Number(d.tamanho||0)) + '</td><td>' + esc(fmtData(d.atualizadoEm || d.criadoEm)) + '</td></tr>';
        }
      });
      if(tabelaAberta) out += '</tbody></table>';
      return out || '<p class="vazio">Nenhum arquivo encontrado.</p>';
    })() +
    '</body></html>';
  const janela = window.open('', '_blank');
  if(!janela){ toast('Não foi possível abrir a janela de impressão — verifique se o navegador bloqueou pop-ups.', 'error'); return; }
  janela.document.open(); janela.document.write(html); janela.document.close();

/* ============ DB / SYNC ============ */
const DB = {
  // ITEM (defesa extra contra ids duplicados): se, por qualquer motivo, o
  // array salvo localmente já tiver dois registros com o mesmo id (efeito
  // colateral de alguma condição de corrida entre pull/push concorrentes),
  // esta deduplicação na LEITURA garante que o app nunca enxergue nem
  // reenvie essa duplicata adiante — fica só um registro por id (o
  // último, mais recente). Isso soma-se à correção equivalente no
  // servidor (aplicarDiffPush_), que agora também nunca GRAVA duas linhas
  // com o mesmo id — as duas camadas juntas fecham esse tipo de
  // duplicação nas duas pontas.
  get(f){
    try{
      const raw = store.get('rio_'+f);
      const parsed = raw ? JSON.parse(raw) : [];
      if(!Array.isArray(parsed)) return parsed;
      const porId = new Map();
      const semId = [];
      parsed.forEach(r => {
        if(!r || !r.id){ semId.push(r); return; }
        const atual = porId.get(r.id);
        if(!atual){ porId.set(r.id, r); return; }
        // ITEM (id duplicado escondendo o registro bom): antes, a última
        // ocorrência do id no array sempre "vencia", presumindo ser sempre
        // a mais completa. Se uma condição de corrida na gravação deixar
        // uma cópia INCOMPLETA (sem driveId) depois da cópia boa na
        // planilha, a incompleta acabava escondendo a completa — o
        // arquivo sumia da contagem/lista mesmo já enviado com sucesso.
        // Agora prioriza quem tem driveId preenchido; empatado nisso,
        // prioriza o mais recente por atualizadoEm/criadoEm.
        const atualCompleto = !!atual.driveId, novoCompleto = !!r.driveId;
        if(novoCompleto && !atualCompleto){ porId.set(r.id, r); return; }
        if(!novoCompleto && atualCompleto){ return; }
        const tsAtual = atual.atualizadoEm || atual.criadoEm || 0;
        const tsNovo = r.atualizadoEm || r.criadoEm || 0;
        if(tsNovo >= tsAtual) porId.set(r.id, r);
      });
      return semId.concat(Array.from(porId.values()));
    }catch(e){ return []; }
  },
  // CORREÇÃO (revert ao mover vários arquivos): antes, DB.set só salvava
  // localmente e mandava a linha inteira para o servidor, sem saber quais
  // ids de fato mudaram. Isso impedia proteger especificamente os itens que
  // acabaram de ser movidos contra um pull concorrente que ainda não viu o
  // push terminar (ver marcarPendenteLocal_ abaixo). Agora comparamos com o
  // snapshot anterior e passamos os ids alterados para Sync.push.
  set(f, rows){
    const anteriores = DB.get(f);
    const antigosPorId = {};
    anteriores.forEach(r => { if(r && r.id) antigosPorId[r.id] = r; });
    const alterados = [];
    (rows||[]).forEach(r => {
      if(!r || !r.id) return;
      if(JSON.stringify(antigosPorId[r.id]) !== JSON.stringify(r)) alterados.push(r.id);
    });
    guardarFolhaSeguro(f, rows);
    if((f === 'Documentos' || f === 'Pastas') && alterados.length) marcarPendenteLocal_(f, alterados);
    // CORREÇÃO CRÍTICA (perda de dados ao editar com cache local
    // incompleto): junto com o array completo, manda também os ids que o
    // PRÓPRIO app marcou como exclusão de verdade nesta folha (ver
    // marcarExcluido_, chamado por toda ação real de excluir, sempre
    // ANTES do DB.set correspondente). O servidor agora só apaga esses
    // ids explícitos — nunca mais infere exclusão pela simples ausência
    // no array, o que antes apagava pastas/documentos que o navegador
    // nunca chegou a carregar (ex.: outra empresa/pasta não navegada).
    const idsExcluidos = tombstones[f] ? Array.from(tombstones[f].keys()) : [];
    return Sync.push(f, rows, alterados, idsExcluidos);
  }
};
/* ============ TOMBSTONES (evita que exclusões "ressuscitem" numa sincronização em andamento) ============
   Quando algo é excluído, o app manda a lista atualizada para a planilha, mas essa gravação é
   assíncrona. Se uma sincronização (pull) ocorrer antes dela terminar, o servidor ainda responde com o
   item "excluído" presente, e a mesclagem local+servidor o traz de volta. Para evitar isso, guardamos
   por alguns minutos quais ids foram excluídos e os ignoramos em qualquer mesclagem nesse período. */
const TOMBSTONE_MS = 3 * 60 * 1000;
const tombstones = {};
function marcarExcluido_(folha, ids){
  const arr = Array.isArray(ids) ? ids : [ids];
  if(!arr.length) return;
  if(!tombstones[folha]) tombstones[folha] = new Map();
  const now = Date.now();
  arr.forEach(id => { if(id) tombstones[folha].set(id, now); });
}
function filtrarTombstones_(folha, rows){
  const m = tombstones[folha];
  if(!m || !m.size || !Array.isArray(rows)) return rows;
  const now = Date.now();
  return rows.filter(r => {
    if(!r || !r.id) return true;
    const t = m.get(r.id);
    if(t === undefined) return true;
    if(now - t > TOMBSTONE_MS){ m.delete(r.id); return true; }
    return false;
  });
}
/* Igual ao mecanismo de tombstones acima, mas para "Excluidos": essas
   linhas não têm "id" (a chave é data_hora+usuario+tipo+nome, ver
   excluidoKey), então usam seu próprio mapa. Protege contra um pull que
   esteja em voo (ou seja disparado por outra ação) responder logo depois
   da exclusão selecionada confirmar no servidor, trazendo de volta as
   linhas que acabaram de ser removidas. */
const tombstonesExcluidos_ = new Map();
function marcarExcluidoHistorico_(chaves){
  const now = Date.now();
  (Array.isArray(chaves) ? chaves : []).forEach(k => { if(k) tombstonesExcluidos_.set(k, now); });
}
function filtrarTombstonesExcluidos_(rows){
  if(!tombstonesExcluidos_.size || !Array.isArray(rows)) return rows;
  const now = Date.now();
  return rows.filter(r => {
    const k = excluidoKey(r);
    const t = tombstonesExcluidos_.get(k);
    if(t === undefined) return true;
    if(now - t > TOMBSTONE_MS){ tombstonesExcluidos_.delete(k); return true; }
    return false;
  });
}
/* ============ CORREÇÃO: proteção contra corrida push × pull ao mover/enviar itens ============
   BUG 1 (mover vários arquivos): ao mover VÁRIOS arquivos (ou pastas) de uma
   vez, o app aplicava a mudança localmente (otimista) e mandava o push pro
   servidor, que move cada item no Drive um por um, sequencialmente (ver
   processarDoc_ / processarPasta_ em Code.gs) — para muitos itens isso pode
   levar bem mais que alguns segundos. Só que agendarPull() sempre disparava
   um pull fixo 3.5s depois do push, e adotarDados() sobrescrevia
   "Documentos"/"Pastas" inteiramente com o que veio do servidor, SEM
   mesclar com o estado local (mesclarRows só era usado para "Usuarios").
   Se esse pull respondesse antes do push terminar no servidor, ele trazia
   de volta a pastaId/parentId antiga — e o app "desmovia" o item sozinho
   pouco depois.
   BUG 2 (upload de arquivo novo): o envio do CONTEÚDO do arquivo
   (apiUploadArquivo, POST em iframe) é uma chamada separada do push de
   metadados (apiPush). O servidor nunca guarda o campo "arquivo" (base64)
   na planilha — ele só existe no navegador como cópia de segurança para
   permitir reenviar em caso de falha. Um pull comum que respondesse depois
   que o push de metadados confirmasse, mas ENQUANTO o upload do conteúdo
   ainda estivesse em andamento, sobrescrevia a linha local inteira com a
   versão do servidor (sem "arquivo"), apagando essa cópia de segurança
   antes mesmo do upload terminar — se o upload falhasse depois disso,
   "Reenviar" não tinha mais o que reenviar.
   FIX: enquanto existe um push de metadados OU um upload de conteúdo em
   andamento para um id de "Documentos"/"Pastas", qualquer pull que chegar
   nesse meio-tempo mantém a versão local desse id. Usamos contagem de
   referência (mais de uma operação pode proteger o mesmo id ao mesmo
   tempo — é exatamente o caso normal de salvar um arquivo novo: o push de
   metadados e o upload do conteúdo saem quase juntos) e uma expiração
   (PENDENTE_LOCAL_MS) para nunca travar a proteção pra sempre caso algo dê
   errado e nenhuma confirmação chegue.
   ITEM (conteúdo "não disponível" ao reenviar): esse tempo era 2 minutos,
   mas o próprio envio de um arquivo pode legitimamente levar até 180s de
   timeout do cliente + mais ~20s de tentativas de confirmação com o
   servidor antes de desistir de vez (ver handleUploadComTimeout_ /
   verificarUploadConfirmadoNoServidor_) — ou seja, mais de 3 minutos no
   pior caso. Com a proteção expirando aos 2 minutos, um pull podia chegar
   DEPOIS da proteção cair mas ANTES do envio realmente terminar, apagando
   o campo "arquivo" (o backup do conteúdo) da cópia local — e quando o
   envio de fato falhava (ou o usuário tentava reenviar depois), não
   sobrava mais conteúdo nenhum pra reenviar, daí a mensagem "conteúdo não
   está mais disponível". Agora a janela de proteção é mais folgada que o
   pior caso inteiro do pipeline de envio, com margem de sobra. */
const PENDENTE_LOCAL_MS = 5 * 60 * 1000;
const pendentesLocal_ = {}; // { folha: Map(id -> {contagem, desde}) }
function marcarPendenteLocal_(folha, ids){
  const arr = Array.isArray(ids) ? ids : [ids];
  if(!arr.length) return;
  if(!pendentesLocal_[folha]) pendentesLocal_[folha] = new Map();
  const m = pendentesLocal_[folha], agora = Date.now();
  arr.forEach(id => {
    if(!id) return;
    const atual = m.get(id);
    m.set(id, {contagem: (atual ? atual.contagem : 0) + 1, desde: agora});
  });
}
function limparPendenteLocal_(folha, ids){
  const m = pendentesLocal_[folha];
  if(!m) return;
  const arr = Array.isArray(ids) ? ids : [ids];
  arr.forEach(id => {
    const atual = m.get(id);
    if(!atual) return;
    if(atual.contagem <= 1) m.delete(id); else m.set(id, {contagem: atual.contagem - 1, desde: atual.desde});
  });
}
function existePendenteLocal_(folha){
  const m = pendentesLocal_[folha];
  return !!(m && m.size);
}
function protegerPendentesLocais_(folha, rowsServidor){
  const m = pendentesLocal_[folha];
  if(!m || !m.size || !Array.isArray(rowsServidor)) return rowsServidor;
  const agora = Date.now();
  const locaisPorId = new Map();
  (DB.get(folha) || []).forEach(r => { if(r && r.id) locaisPorId.set(r.id, r); });
  const idsNoServidor = new Set();
  const resultado = rowsServidor.map(r => {
    if(!r || !r.id) return r;
    idsNoServidor.add(r.id);
    const info = m.get(r.id);
    if(!info) return r;
    if(agora - info.desde > PENDENTE_LOCAL_MS){ m.delete(r.id); return r; } // expirou: confia no servidor
    return locaisPorId.has(r.id) ? locaisPorId.get(r.id) : r;
  });
  // ITEM (pasta nova "aparece, some e volta a aparecer"): o .map() acima só
  // consegue PROTEGER/substituir linhas que o servidor já devolveu — mas um
  // item recém-criado (pasta ou arquivo) ainda não existe no servidor
  // enquanto o push que o criou não terminar. Se um pull ganhar essa
  // corrida (chegar antes do push terminar), o item nem aparecia na
  // resposta do servidor — e como o .map() não tem como "inventar" uma
  // linha que nunca recebeu, o item local pendente simplesmente sumia da
  // tela até um pull seguinte (já com o push concluído) trazê-lo de volta.
  // Agora, qualquer id pendente-local que ainda não veio na resposta do
  // servidor é adicionado de volta ao resultado (mantendo a versão local
  // otimista), em vez de ser descartado por omissão.
  m.forEach((info, id) => {
    if(idsNoServidor.has(id)) return; // já tratado acima
    if(agora - info.desde > PENDENTE_LOCAL_MS){ m.delete(id); return; } // expirou: confia no servidor (item some se realmente não existir)
    const localRow = locaisPorId.get(id);
    if(localRow) resultado.push(localRow);
  });
  return resultado;
}
// ITEM (conteúdo "não está mais disponível" ao reenviar): a proteção
// acima (protegerPendentesLocais_) é de propósito limitada no tempo
// (PENDENTE_LOCAL_MS) — ela existe só para não deixar um pull "vencer a
// corrida" contra um push que ainda está em andamento, e precisa expirar
// em algum momento como válvula de segurança. Mas o backup local do
// conteúdo do arquivo (campo "arquivo", usado pelo botão de reenviar) é
// uma garantia DIFERENTE: enquanto o documento não tiver "driveId"
// confirmado, ele ainda pode precisar ser reenviado — não importa se isso
// acontece 2 minutos ou 20 minutos depois do envio original. Por isso,
// independente da janela de tempo acima, para qualquer documento que
// ainda não tenha "driveId" (o servidor nunca devolve o campo "arquivo" —
// ele é removido antes de cada push, de propósito, para não pesar a
// sincronização), mantemos aqui o conteúdo que já existir na cópia local,
// para o botão "Reenviar" continuar funcionando enquanto o documento não
// for enviado de verdade (ou explicitamente removido pelo usuário).
function preservarConteudoNaoEnviado_(rows){
  if(!Array.isArray(rows) || !rows.length) return rows;
  const locaisPorId = new Map();
  (DB.get('Documentos') || []).forEach(r => { if(r && r.id) locaisPorId.set(r.id, r); });
  return rows.map(r => {
    if(!r || !r.id || r.driveId || r.arquivo) return r;
    const local = locaisPorId.get(r.id);
    return (local && local.arquivo) ? Object.assign({}, r, {arquivo: local.arquivo}) : r;
  });
}
let pullTimer = null;
// ITEM 6: antes, agendarPull disparava um único pull 3.5s depois do push e
// parava por aí — se o servidor ainda não tivesse terminado de gravar o
// driveId (upload em lote, fila do LockService, etc.), a mensagem "Enviando
// para o Drive…" ficava travada pra sempre na tela, mesmo com o arquivo já
// salvo no Drive, até o usuário fazer alguma outra ação que reagendasse um
// pull. Agora, enquanto existir algum arquivo sem driveId/erroUpload — ou
// algum item de Documentos/Pastas ainda com movimentação pendente —
// continuamos reagendando o pull automaticamente até o status ser resolvido.
function existeUploadPendente_(){
  return DB.get('Documentos').some(d => d.tipo === 'arquivo' && !d.driveId && !d.erroUpload);
}
function existeMovePendente_(){
  return DB.get('Documentos').some(d => d.movePending) || DB.get('Pastas').some(p => p.movePending)
    || existePendenteLocal_('Documentos') || existePendenteLocal_('Pastas');
}
// "imediato": pula o atraso de 3.5s — usado logo após um push de
// Documentos/Pastas confirmar (sucesso ou falha), para o app já refletir o
// estado real do servidor sem esperar o próximo ciclo do timer.
function agendarPull(imediato){
  if(!Sync.url()) return;
  clearTimeout(pullTimer);
  pullTimer = setTimeout(() => {
    Sync.pull().then(data => {
      if(Sync.applyData(data)){
        // CORREÇÃO (V48): só re-renderiza quando o conteúdo realmente
        // mudou (Sync.ultimaMudou) — evita redesenhar o dashboard inteiro
        // a cada ciclo de polling enquanto nada de novo chegou do servidor,
        // que era o que fazia a tela parecer "se mexendo" sozinha.
        if(!currentUser()){
          if(session && session.token) gasCall_('apiLogout',[session.token]).catch(()=>{});
          limparSessao_(); mostrarLogin();
        } else if(Sync.ultimaMudou && (!$('#modalOverlay') || $('#modalOverlay').classList.contains('hidden'))){
          // ITEM (dashboard "estático" durante o envio): enquanto um lote de
          // upload está rodando, cada arquivo que termina (ou cada
          // confirmação de verificação) fazia esse pull periódico perceber
          // mudança e redesenhar o dashboard inteiro na hora — a lista
          // "pulava"/reordenava a cada arquivo, dando a sensação de tela
          // instável durante o envio. Agora, com um lote ativo, o dashboard
          // fica parado (o painel de envio continua atualizando normalmente,
          // já que ele não depende de renderApp); a lista só é redesenhada
          // de uma vez quando o lote inteiro termina (handleUploadLote já
          // chama renderItens() no fim, em seu bloco finally).
          if(!uploadLoteAtivo_) renderApp();
        }
      }
      if(existeUploadPendente_() || existeMovePendente_()) agendarPull();
    }).catch(() => { if(existeUploadPendente_() || existeMovePendente_()) agendarPull(); });
  }, imediato ? 0 : 3500);
}
const JSONP_TIMEOUT_MS = 25000;
let jsonpSeq = 0;
/*
 * Comunicação GitHub Pages -> Apps Script.
 *
 * IMPORTANTE: para login, leitura da planilha e ações normais usamos SOMENTE
 * JSONP. O fallback por iframe/POST foi removido porque é justamente ele que
 * provoca o aviso "Permitir acesso de rede?" em ambientes de pré-visualização
 * e em alguns navegadores.
 *
 * Upload de arquivo continua usando POST em iframe separadamente, pois o
 * payload pode conter base64 e não deve ser colocado na URL.
 */
function gasCall_(fn,args,timeoutMs){

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(function(res) {
          resolve(res);
        })
        .withFailureHandler(function(err) {
          reject(new Error(err && err.message ? err.message : 'Erro na chamada'));
        })
        .executarApiFn(fn, args || []);
    });
  }
  args=args||[];
  if(!DEFAULT_GAS_URL) return Promise.reject(new Error('URL do Apps Script não configurada.'));
  return new Promise((resolve,reject)=>{
    const cb='__hddocs_jsonp_'+Date.now()+'_'+(++jsonpSeq);
    const script=document.createElement('script');
    let done=false;
    const timer=setTimeout(()=>finish(new Error('Tempo esgotado ao consultar o Apps Script. Verifique se a implantação do Apps Script está publicada para "Qualquer pessoa".')),Number(timeoutMs||JSONP_TIMEOUT_MS));
    function cleanup(){
      clearTimeout(timer);
      try{script.remove();}catch(e){}
      try{delete window[cb];}catch(e){window[cb]=undefined;}
    }
    function finish(err,data){
      if(done)return; done=true; cleanup();
      if(err)reject(err);else resolve(data);
    }
    window[cb]=data=>finish(null,data);
    script.onerror=()=>finish(new Error('Não foi possível acessar o Apps Script pelo canal JSONP. Verifique a implantação/publicação da URL /exec.'));
    const q=new URLSearchParams();
    q.set('api','1');
    q.set('fn',fn);
    q.set('args',JSON.stringify(args));
    q.set('callback',cb);
    q.set('_',String(Date.now()));
    script.async=true;
    script.src=DEFAULT_GAS_URL + (DEFAULT_GAS_URL.indexOf('?')>=0?'&':'?') + q.toString();
    document.head.appendChild(script);
  });
}



/* POST é reservado exclusivamente para upload de arquivos. */
function postApi_(payload){
  if(typeof google !== 'undefined' && google.script && google.script.run){
    return new Promise((resolve, reject) => {
      let done = false;
      // ITEM (upload trava sem aviso no celular): este caminho não tinha
      // NENHUM timeout — numa conexão de celular instável (comum durante
      // captura de fotos, troca de rede wifi/dados, ou a aba ficando em
      // segundo plano), a chamada podia ficar pendurada indefinidamente,
      // sem nunca chamar sucesso nem falha, deixando o usuário sem
      // nenhum feedback. Agora, depois de 45s sem resposta, desiste com
      // uma mensagem clara — o mesmo padrão já usado no canal JSONP
      // (30s) logo abaixo, com uma margem um pouco maior aqui porque o
      // conteúdo do arquivo pode ser mais pesado.
      const timer = setTimeout(() => {
        if(done) return; done = true;
        reject(new Error('Tempo esgotado ao enviar o arquivo. Verifique sua conexão com a internet e tente novamente.'));
      }, 45000);
      google.script.run
        .withSuccessHandler(function(res){
          if(done) return; done = true; clearTimeout(timer);
          resolve(res);
        })
        .withFailureHandler(function(err){
          if(done) return; done = true; clearTimeout(timer);
          reject(new Error(err && err.message ? err.message : 'Erro no upload'));
        })
        .uploadArquivoViaScriptRun(payload.payload);
    });
  }
  if(!DEFAULT_GAS_URL) return Promise.reject(new Error('URL do Apps Script não configurada.'));
  return new Promise((resolve,reject)=>{
    const id='post_'+Date.now()+'_'+(++jsonpSeq);
    payload=Object.assign({},payload,{requestId:id});
    const iframe=document.createElement('iframe');
    iframe.name=id; iframe.id=id; iframe.style.display='none';
    iframe.setAttribute('aria-hidden','true');
    document.body.appendChild(iframe);
    const form=document.createElement('form');
    form.method='POST'; form.action=DEFAULT_GAS_URL; form.target=id; form.style.display='none';
    const input=document.createElement('textarea');
    input.name='payload'; input.value=JSON.stringify(payload); input.style.display='none';
    form.appendChild(input); document.body.appendChild(form);
    let done=false;
    const timer=setTimeout(()=>finish(new Error('Tempo esgotado ao enviar o arquivo para o Apps Script.')),30000);
    function finish(err,data){
      if(done)return; done=true; clearTimeout(timer); window.removeEventListener('message',onMessage);
      try{form.remove();iframe.remove();}catch(e){}
      if(err)reject(err);else resolve(data);
    }
    function onMessage(ev){
      const d=ev&&ev.data;
      if(!d||d.type!=='hddocs-api-result'||d.id!==id)return;
      finish(null,d.data);
    }
    window.addEventListener('message',onMessage);
    try{form.submit();}catch(e){finish(e);}
  });
} 

function chamarAcaoGet_(params){
  params=params||{};
  if(params.acao==='escanearPendentes'||params.acao==='verificarOrfaos') return gasCall_('apiAction',[Object.assign({},params,{token:session?session.token:''})]);
  return Promise.reject(new Error('Ação não suportada.'));
}
let backendAntigo = false;
/* CORREÇÃO (item 8): antes, cada Sync.push disparava um fetch imediatamente,
   sem esperar o anterior da mesma aba terminar. Se duas chamadas saíssem
   quase juntas, a ordem de chegada no servidor não era garantida — e o push
   mais "atrasado" podia sobrescrever no Sheets o resultado do mais recente.
   Por isso passamos a enfileirar os pushes por aba, um de cada vez.
   ITEM ("Não foi possível confirmar a sincronização" durante lotes
   grandes): enfileirar UM POR VEZ virou, na prática, o maior gargalo de
   velocidade do envio em lote — cada arquivo do lote dispara seu próprio
   push de metadados, e como cada um só começa depois que o anterior
   TERMINOU O CICLO INTEIRO (ida e volta pela rede, mais o tempo do
   servidor), um lote de 25 arquivos podia ter o 20º push só começando a
   ser ENVIADO depois de dezenas de segundos de espera — aumentando muito
   a chance de estourar o timeout antes mesmo de o servidor processar.
   Isso não precisa mais ser assim: o apiPush no servidor já usa seu
   próprio bloqueio (LockService) para nunca deixar dois pushes da MESMA
   aba serem escritos fora de ordem — a proteção contra sobrescrita
   (motivo original desta fila) já está garantida no servidor. Então agora
   permitimos até PUSH_CONCORRENCIA pushes da mesma aba "em voo" ao mesmo
   tempo (a fila só seleciona o MAIS ANTIGO em andamento para esperar,
   quando o limite já foi atingido) — isso reduz e muito o tempo total de
   um lote grande, sem abrir mão da ordem correta (garantida pelo
   servidor) nem sobrecarregar demais o Apps Script com chamadas
   simultâneas demais. */
const filaPush_ = {}; // { folha: [promises em voo, mais antiga primeiro] }
// Reduzido de 3 para 2 pela mesma cautela do UPLOAD_CONCORRENCIA acima —
// menos chamadas simultâneas ao Apps Script, menos chance de esbarrar em
// bloqueios do navegador ou limites de simultaneidade do próprio Google.
const PUSH_CONCORRENCIA = 2;

function corpoComUsuario_(extra){ return Object.assign({token:session?session.token:''},extra||{}); }

const Sync = {
  url(){ return !!DEFAULT_GAS_URL; },
  push(f,rows,idsAlterados,idsExcluidos){
    if(!session||!DEFAULT_GAS_URL)return Promise.resolve({ok:false});
    let out=rows;
    if(f==='Documentos')out=rows.map(r=>{if(!r.arquivo)return r;const c=Object.assign({},r);delete c.arquivo;return c;});
    const body=corpoComUsuario_({folha:f,rows:out,idsExcluidos:Array.isArray(idsExcluidos)?idsExcluidos:[]});
    const fila = filaPush_[f] || (filaPush_[f] = []);
    const anterior = fila.length >= PUSH_CONCORRENCIA ? fila.shift() : Promise.resolve();
    const idsProtegidos=Array.isArray(idsAlterados)?idsAlterados:[];
    const protegeMoveRace = (f==='Documentos'||f==='Pastas');
    const timeoutPush = protegeMoveRace
      ? Math.min(90000, Math.max(JSONP_TIMEOUT_MS, JSONP_TIMEOUT_MS + idsProtegidos.length*4000))
      : JSONP_TIMEOUT_MS;

    }).catch(err=>{

  },
  pushAll(){if(session)FOLHAS.forEach(f=>this.push(f,DB.get(f)));},
  uploadArquivo(payload){
    if(!session||!DEFAULT_GAS_URL)return Promise.reject(new Error('sessão indisponível'));
    const docId = payload && payload.docId;

  ensureDriveRoot(){const u=currentUser();if(!u||!podeSincronizarDrive_(u)||!DEFAULT_GAS_URL)return;gasCall_('apiEnsureRoot',[session.token]).catch(()=>{});},
  excluirDrive(tipo,registroId){if(!session||!registroId)return Promise.reject(new Error('sessão indisponível'));return gasCall_('apiExcluirDrive',[session.token,tipo,registroId]);},
  limparExcluidos(){if(!session)return;return gasCall_('apiLimparExcluidos',[session.token]);},
  escanearPendentes(pastaId){return chamarAcaoGet_({acao:'escanearPendentes', pastaId: pastaId||null});},
  verificarOrfaos(pastaId){return chamarAcaoGet_({acao:'verificarOrfaos', pastaId: pastaId||null});},
  repararDrive(pastaId){return gasCall_('apiSincronizarDrive',[session?session.token:'', pastaId||null]);},
  limparIdsDuplicados(){return gasCall_('apiLimparIdsDuplicados',[session?session.token:'']);},
  async login(email, senha, _semRetentativa){
    try{
      if(!window.crypto||!crypto.subtle) return {ok:false,erro:'Seu navegador não suporta autenticação segura.'};
      const enc=new TextEncoder();
      async function sha256Hex_(texto){
        const digest=await crypto.subtle.digest('SHA-256',enc.encode(String(texto||'')));
        return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');

      const pre = desafioPreFetch_;
      if(pre && pre.email === email && pre.dados && (Date.now() - pre.obtidoEm) < 120000){

      } else {

      const prova = await sha256Hex_(hashLocal + '::' + String(desafio.nonce));
      const res = await gasCall_('apiLoginComDesafio', [email, [prova], desafio.nonce]);
      if(res && res.desafioExpirado && !_semRetentativa){
        return Sync.login(email, senha, 1);
      }
      if(res && res.desafioExpirado && _semRetentativa === 1){
        return Sync.login(email, senha, 2);
      }
      return res;
    }catch(e){ return {ok:false, erro:(e && e.message) || 'Não foi possível autenticar.'}; }
  },
  async trocarSenha(userId,senhaAtual,senhaNova){return gasCall_('apiTrocarSenha',[session?session.token:'',senhaAtual,senhaNova]);},
  async atualizarPerfil(userId,nome,email,senha){return gasCall_('apiAtualizarPerfil',[session?session.token:'',nome,email,senha||'']);},
  async enviarEmailDocumento(docId,destinatario,assunto,mensagem){return gasCall_('apiEnviarEmailDocumento',[session?session.token:'',docId,destinatario,assunto||'',mensagem||'']);},
  async enviarEmailDocumentos(docIds,destinatario,assunto,mensagem){return gasCall_('apiEnviarEmailDocumentos',[session?session.token:'',docIds,destinatario,assunto||'',mensagem||'']);},
  async pull(){if(!DEFAULT_GAS_URL)throw new Error('URL do Apps Script indisponível');return gasCall_('apiPull',[session?session.token:'']);},
