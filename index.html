<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="google-site-verification" content="yQigN6Y2hMkyqXraxrlb9k2KJJs6It0Sq0oZQw8xQrM"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Gerenciador de Documentos</title>

    <link rel="preconnect" href="https://script.google.com" crossorigin="anonymous"/>
    <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin="anonymous"/>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #f0f2f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      #custom-iframe {
        width: 100%;
        height: 100vh;
        border: none;
        display: block;
        opacity: 0;
        transition: opacity 0.4s ease-in-out;
        background-color: #f0f2f5;
      }
    </style>
</head>
<body>

  <iframe 
    id="custom-iframe" 
    src="https://script.google.com/macros/s/AKfycbxWd5Koielaa9VtbgYzMuBYIVPen8NFBlJMS3_52QY1U0nZXUCo1Qk7O8g7ezJiNRmHbA/exec" 
    title=Gerenciador de Documentos"
    onload="document.getElementById('loader').style.display='none'; this.style.opacity='1';">
  </iframe>

</body>
</html>
